function memoBox(cid,val,id,kind){
  const ts=tplsOf(cid), c=DB.cases.find(x=>x.id===cid)||{}, v=String(val||'');
  const chip=(t,i)=>`<button type="button" class="tchip${v.includes(tplBlock(t))?' on':''}" data-tpl="${i}" data-for="${id}" data-cid="${esc(cid)}"${t.kind?` title="${esc(t.kind)} の工事用"`:''}>${esc(t.title)}</button>`;
  const front=[], rest=[]; ts.forEach((t,i)=>((tplHit(t,kind)||v.includes(tplBlock(t)))?front:rest).push(chip(t,i)));
  const sm='font-weight:400;color:var(--sub);font-size:12px;margin-left:6px';
  return `<label class="fl" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">伝達事項・備考${ts.length?`<span style="${sm}">${esc(c.client||'')} のテンプレート${kind&&rest.length?'（'+esc(kind)+'）':''}：</span>${front.join('')||`<span style="${sm};margin-left:0">この工事用は無い</span>`}${rest.length?`<button type="button" class="tmore" data-n="${rest.length}">ほかのテンプレート（${rest.length}件）▼</button><span class="trest" hidden>${rest.join('')}</span>`:''}`
      :(c.client?`<span style="${sm}">${esc(c.client)} のテンプレートはまだ無い（左のメニュー「顧客」→ ${esc(c.client)} →「発注書の備考」で登録すると、ここにボタンで出る）</span>`:'')}</label>

}

/* ================= 請求 =================
   ・月で絞る（締め月）／日付の範囲で絞る（完工日）
   ・顧客ごとの合計／物件ごと／年間の表 を切り替える
   ・請求書は「作る」と番号が付き、中身を写して固定する（bills）。あとから案件を直しても、出した請求書は変わらない */
let bMode='month', bFrom='', bTo='', bView='client', bSt='', bCl='', bOpen='';
const liveBills=()=>(DB.bills||[]).filter(b=>b.st!=='取消');
function billOfCase(){ const m={}; liveBills().forEach(b=>(b.items||[]).forEach(i=>{ m[i.case_id]=b; })); return m; }
const billDate=c=>c.done||c.plan||'';
const bKey=c=>c.client||'（未設定）';
/* 請求書の状態 → [色, 文字] */
function billState(b){
  if(!b)return ['non','未請求'];
  if(b.st==='入金済')return ['use','入金済み'+(b.paidDate?' '+md(b.paidDate):'')];
  if(b.due&&b.due<fmtD(new Date()))return ['late','入金が遅れている'];
  return ['wait','請求済み'];
}
const BST={non:'未請求',wait:'請求済み・入金待ち',late:'入金が遅れている',use:'入金済み'};
function billCases(){
  if(bMode==='range'){ if(!bFrom||!bTo)return []; return DB.cases.filter(c=>{ const d=billDate(c); return d&&d>=bFrom&&d<=bTo; }); }
  return DB.cases.filter(c=>cycMonth(c)===iMonth);
}
/* まだ請求書に入っていない案件から、請求書の下書きを作る */
function billDraft(nm,m){
  const bc=billOfCase();
  const list=DB.cases.filter(c=>bKey(c)===nm&&cycMonth(c)===m&&!bc[c.id]).sort((a,b)=>billDate(a).localeCompare(billDate(b)));
  const items=list.filter(c=>salesEx(c)>0).map(c=>({case_id:c.id,date:billDate(c),prop:c.prop||'',kind:c.kind||'',amt:salesEx(c)}));
  const sub=items.reduce((a,i)=>a+i.amt,0), [f,t]=cycle(nm,m);
  return {client:nm,month:m,from:f,to:t,items,subtotal:sub,tax:Math.round(sub*0.1),total:sub+Math.round(sub*0.1),due:dueOf(nm,m),zero:list.length-items.length};
}

/* ---- 案件ページ：物件が主役。物件の下にタブ（概要／案件情報／見積・発注／工程／写真／完了報告・請求）。

const CPTABS=['概要','案件情報','見積・発注','工程','写真','完了報告・請求'];

/* 次にやること：この案件で、いま止まっている所。t＝直しに行くタブ、lv＝warn（急ぎ）／wait（待ち）／todo */
function caseTodos(c){
  const out=[], add=(t,lv,m)=>out.push({t,lv,m});
  const ps=procsOf(c.id), ls=linesOf(c.id), ods=ordersOf(c.id), reps=(DB.reports||[]).filter(r=>r.case===c.id);
  if(c.done&&c.bill)return out;   /* 完工して請求月も入っていれば、やることなし */
  const miss=[!c.addr&&'住所',!c.keyInfo&&'鍵情報'].filter(Boolean);
  if(miss.length&&!c.done)add('案件情報','todo',`${miss.join('・')}が未入力。業者に現場の場所や入り方が伝わらない`);
  if(!c.done){
    if(stIdx(c.st)<stIdx('見積提出')&&stIdx(c.st)>=0)add('見積・発注','todo','見積を作って、提出したら「見積を提出した」を押す');
    else if(c.st==='見積提出')add('見積・発注','wait','見積の返事待ち。受注が決まったら「受注にする」');
    if(!(+c.sales)&&stIdx(c.st)>=stIdx('受注')&&ls.some(l=>lineSell(l)>0))add('見積・発注','warn','受注額が未入力。このままだと請求・月次が ¥0 になる（明細の表の下のボタンで入れられる）');
    const nok=ls.filter(l=>!l.kind&&+l.qty>0&&!l.cut).length; if(nok)add('見積・発注','todo',`区分の付いていない明細が ${nok}行。区分を付けると、工程と打診に内容が出る`);
    if(stIdx(c.st)>=stIdx('受注')){
      if(!ps.length)add('工程','todo','工程がまだ無い。区分のボタンで工程を足す');
      ps.forEach(p=>{
        if(p.ask==='打診中')add('工程','wait',`${p.kind}：${p.who} さんに ${p.date?md(p.date):''} を打診中。返事待ち`);
        else if(String(p.ask||'').startsWith('辞退'))add('工程','warn',`${p.kind}：${p.ask.slice(3)} さんは都合が悪い。別の業者に打診する`);
        else if(!p.who)add('工程','todo',`${p.kind}の業者が決まっていない`);
        else if(!p.date)add('工程','todo',`${p.kind}（${p.who}）の日程が決まっていない`);
        else if(!p.order&&!isStaffJob(p.kind)&&p.prog!=='完了')add('見積・発注','todo',`${p.kind}（${p.who}）の発注書を作る`);
      });
      ods.forEach(o=>{ if(o.st==='下書き')add('見積・発注','warn',`発注書 ${o.no}（${o.who||'業者未定'}）がまだ下書き。内容を確かめて「発注」を押す`);
        else if(o.st==='送付済')add('見積・発注','wait',`発注書 ${o.no}：${o.who} さんの承諾待ち`); });
    }
    reps.filter(r=>r.st==='報告済').forEach(r=>add('完了報告・請求','warn',`${r.who} さんの完了報告が届いている。確かめて承認する`));
    if(ps.length&&ps.every(p=>p.prog==='完了'))add('案件情報','todo','全部の工程が終わっている。完了日を入れる');
  } else if(!c.bill)add('案件情報','todo','完了している。請求月を入れる');
  return out;
}

async function shrinkImg(file){
  try{ const img=await createImageBitmap(file); const sc=Math.min(1,1280/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),'image/jpeg',0.7)); }catch(e){ return file; }
}
function cpAddFiles(files){
  const cid=cpCase, cat=cpUpCat, phase=PHASED.indexOf(cat)>=0?cpUpPh:'';
  files=Array.from(files||[]).filter(f=>/^image\//.test(f.type)); if(!files.length||!cid)return;
  cpUps.n+=files.length; files.forEach(f=>cpQ.push({f,cid,cat,phase})); cpPump(); cpShowMsg();
}
function cpShowMsg(){ const m=document.getElementById('cpUpMsg'); if(m)m.textContent=cpUpMsg(); }
function cpPump(){
  while(cpUps.run<3&&cpQ.length){ const u=cpQ.shift(); cpUps.run++;
    (async()=>{ try{ const b=await shrinkImg(u.f), path=`staff/${u.cid}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.jpg`;
        const {error}=await sb.storage.from('reports').upload(path,b,{contentType:'image/jpeg',upsert:false}); if(error)throw error;
        const {data,error:e2}=await sb.rpc('staff_add_photos',{p_case:u.cid,p_cat:u.cat,p_phase:u.phase,p_paths:[path]}); if(e2||!data)throw (e2||new Error('登録できなかった'));
        cpUps.ok++; }catch(e){ cpUps.ng++; alog('photo up ERR',(e&&e.message)||e); }
      cpUps.run--; cpShowMsg(); cpPump();

}

function madoriOf(c){
  if(!c)return {v:'',guess:false};
  if(c.madori)return {v:c.madori,guess:false};
  const t=[c.memo,c.items,c.prop,...linesOf(c.id).map(l=>l.name)].join(' ');
  const m=/([1-4])\s*(SLDK|LDK|DK|K|R)/.exec(t.replace(/[１-４]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)));
  if(!m)return {v:'',guess:false};
  const v=+m[1]>=3?'3K以上':m[1]+m[2].replace('SLDK','LDK');
  return {v:MADORI.indexOf(v)>=0?v:'',guess:true};

const PL_LOW=30;   /* 粗利率がこれ未満の月は赤で知らせる（％） */
function vPl(){
  const now=fmtD(new Date()), cy=+now.slice(0,4), cm=+now.slice(5,7), nowM=ym(now);

  const MS=[]; for(let i=0;i<12;i++){ const m=PL_FY_START+i, y=plFy+(m>12?1:0); MS.push(`${y}-${String(m>12?m-12:m).padStart(2,'0')}`); }
  const mOf=c=>ym(DB.basis==='請求'?c.bill:planOf(c));
  const agg={}; MS.forEach(m=>{ agg[m]={s:0,c:0,n:0}; });
  DB.cases.forEach(c=>{ const m=mOf(c); if(!agg[m])return; agg[m].s+=salesEx(c); agg[m].c+=costOf(c.id); agg[m].n++; });
  const T={s:0,c:0,n:0}; MS.forEach(m=>{ T.s+=agg[m].s; T.c+=agg[m].c; T.n+=agg[m].n; });
  if(plMonth&&!agg[plMonth])plMonth='';
  const maxS=Math.max(1,...MS.map(m=>agg[m].s));
  const num=v=>Math.round(v||0).toLocaleString('ja-JP'), pctN=(v,s)=>s?v/s*100:null, pct=(v,s)=>s?(v/s*100).toFixed(1)+'%':'';

  const cell=(m,v,s,o)=>{ o=o||{}; const r=o.ratio?pctN(v,s):null, low=o.flag&&r!=null&&s>0&&r<PL_LOW;
    return `<td class="r${v<0?' neg':''}${m?mc(m):' ptot'}"${m?` data-plm="${m}"`:''}>${o.bar&&m?`<i class="plbar" style="width:${Math.round(v/maxS*100)}%"></i>`:''}<span class="v">${v||o.zero?num(v):'<span class="z">0</span>'}</span>${
      o.ratio?`<small class="${low?'low':''}"${low?` title="粗利率が ${PL_LOW}% 未満"`:''}>${r==null?'&nbsp;':r.toFixed(1)+'%'}</small>`:''}</td>`; };
  const row=(f,o)=>MS.map(m=>cell(m,f(agg[m]),agg[m].s,o)).join('')+cell('',f(T),T.s,o);
  const none=()=>MS.map(m=>`<td class="r na${mc(m)}" data-plm="${m}">—</td>`).join('')+`<td class="r na ptot">—</td>`;

  const lowList=()=>{ const all=DB.cases.filter(c=>agg[mOf(c)]&&salesEx(c)>0&&costOf(c.id)>0).map(c=>({c,s:salesEx(c),k:costOf(c.id)})).map(x=>({...x,r:(x.s-x.k)/x.s*100})).filter(x=>x.r<PL_LOW).sort((a,b)=>a.r-b.r);

  const lows=MS.filter(m=>agg[m].s>0&&(agg[m].s-agg[m].c)/agg[m].s*100<PL_LOW);
  /* 月を押すと、その月の案件（粗利率の低い順） */
  const drill=()=>{ if(!plMonth)return ''; const cs=DB.cases.filter(c=>mOf(c)===plMonth).map(c=>({c,s:salesEx(c),k:costOf(c.id)})).sort((a,b)=>((a.s?(a.s-a.k)/a.s:9)-(b.s?(b.s-b.k)/b.s:9)));
    const x=agg[plMonth];
    return `<div class="card pldrill"><div class="bar" style="margin:0 0 8px"><h3 style="font-size:14px;margin:0">${plMonth.slice(0,4)}年${+plMonth.slice(5,7)}月の案件　${cs.length}件</h3>
        <span class="note" style="margin:0">売上 ${yen(x.s)}　原価 ${yen(x.c)}　粗利 ${yen(x.s-x.c)}（${pct(x.s-x.c,x.s)||'—'}）　粗利率の低い順</span><span class="grow"></span><button class="btn small" data-plm="${plMonth}">閉じる</button></div>
      ${cs.length?`<div class="tw" style="max-height:340px"><table><thead><tr><th>物件</th><th>依頼元</th><th>状態</th><th class="r">売上</th><th class="r">原価</th><th class="r">粗利</th><th class="r">粗利率</th></tr></thead><tbody>
        ${cs.map(({c,s,k})=>{ const r=s?(s-k)/s*100:null; return `<tr><td><a class="cplink" data-cpage="${c.id}" title="案件ページを開く">${esc(c.prop||'（物件未入力）')}</a></td>
          <td><span class="cl" style="background:${col(c.client)}">${esc(c.client||'—')}</span></td><td><span class="st ${stCls(c.st)}">${esc(c.st)}</span></td>
          <td class="r">${yen(s)}</td><td class="r">${k?yen(k):'<span style="color:var(--warn)">未入力</span>'}</td>
          <td class="r" style="color:${s-k<0?'var(--warn)':'inherit'}">${yen(s-k)}</td><td class="r" style="font-weight:700;color:${r!=null&&r<PL_LOW?'var(--warn)':'inherit'}">${r==null?'—':r.toFixed(1)+'%'}</td></tr>`; }).join('')}</tbody></table></div>`
      :'<p class="note" style="margin:0">この月に乗っている案件は無い。</p>'}</div>`; };
  return `<div class="bar"><h2>月次</h2>
      <button class="btn small" data-plfy="-1" title="前の年度">◀</button><b style="font-size:14px">${plFy}年度</b><span class="note" style="margin:0">（${plFy}年${PL_FY_START}月〜${plFy+1}年${PL_FY_START-1}月）</span><button class="btn small" data-plfy="1" title="次の年度">▶</button>
      <span class="grow"></span><span class="note" style="margin:0">計上基準</span>
      <select id="basisSel" title="売上をどの日付で月に乗せるか">${optsL(['完工','請求'],DB.basis,{'完工':'計上：完工基準','請求':'計上：請求月基準'})}</select></div>
    <div class="kpi">
      <div class="k"><small>${plFy}年度 売上高（税抜）</small><b>${yen(T.s)}</b></div>
      <div class="k"><small>売上原価</small><b>${yen(T.c)}</b></div>

      <div class="k"><small>粗利率</small><b style="color:${T.s&&(T.s-T.c)/T.s*100<PL_LOW?'var(--warn)':'inherit'}">${T.s?((T.s-T.c)/T.s*100).toFixed(1)+'%':'—'}</b></div>
      <div class="k"><small>案件数</small><b>${T.n}</b></div>
      ${lows.length?`<div class="k warnk"><small>粗利率が ${PL_LOW}% 未満の月</small><b>${lows.map(m=>`<a data-plm="${m}">${+m.slice(5,7)}月</a>`).join('・')}</b></div>`:''}</div>
    <div class="plw"><table class="plt"><thead>
      <tr><th class="g" colspan="2">（税抜・円）</th>${MS.map(m=>`<th class="r${mc(m)}" data-plm="${m}" title="押すと、この月の案件が下に出る">${m.slice(5,7)==='01'||m===MS[0]?`<small>${m.slice(0,4)}年</small>`:''}${+m.slice(5,7)}月</th>`).join('')}<th class="r ptot">年度合計</th></tr></thead><tbody>
      <tr class="band sales"><td class="g" colspan="2">売上高</td>${row(x=>x.s,{bar:1})}</tr>
      ${plSga?`<tr class="sum cogs"><td class="g vert" rowspan="${2+IT.cogs.length}"><span>原価</span></td><td class="g2 rt">売上原価 合計</td>${row(x=>x.c,{ratio:1})}</tr>
      <tr class="dt"><td class="g2">人件費（外注）</td>${row(x=>x.c,{ratio:1})}</tr>
      ${IT.cogs.map(x=>`<tr class="dt"><td class="g2">${esc(x.name)}</td>${none()}</tr>`).join('')}`
      :`<tr class="sum cogs"><td class="g" colspan="2">売上原価</td>${row(x=>x.c,{ratio:1})}</tr>`}
      <tr class="band gross"><td class="g" colspan="2">売上総利益<small>粗利率</small></td>${row(x=>x.s-x.c,{ratio:1,flag:1})}</tr>
      ${plSga?`<tr class="sum sga"><td class="g vert" rowspan="${1+IT.sga.length}"><span>販管費</span></td><td class="g2 rt">販管費 合計</td>${none()}</tr>
      ${IT.sga.map(x=>`<tr class="dt"><td class="g2">${esc(x.name)}</td>${none()}</tr>`).join('')}`
      :`<tr class="sum sga"><td class="g" colspan="2">販売費及び一般管理費</td>${none()}</tr>`}
      <tr class="band op"><td class="g" colspan="2">営業利益<small>販管費 未取込</small></td>${row(x=>x.s-x.c,{ratio:1})}</tr>
      <tr class="cnt"><td class="g" colspan="2">案件数</td>${MS.map(m=>`<td class="r${mc(m)}" data-plm="${m}">${agg[m].n||''}</td>`).join('')}<td class="r ptot">${T.n}</td></tr>
    </tbody></table></div>
    <div class="bar" style="margin:8px 0 0"><button class="btn small" data-plsga="${plSga?0:1}">${plSga?'内訳をたたむ':`内訳をひらく（原価 ${1+IT.cogs.length}科目・販管費 ${IT.sga.length}科目）`}</button>
      <button class="btn small" id="plEdit" title="月次の表に出す科目を、足す・名前を変える・並べ替える・消す">科目を編集</button>
      <span class="note" style="margin:0">月を押すと、その月の案件が下に出る。金額の下の小さい数字は売上高に対する比率。粗利率が ${PL_LOW}% 未満の月は赤。</span></div>
    ${drill()}
    ${lowList()}
    <p class="note">売上高と売上原価（人件費・外注）は台帳の数字（案件の受注額と、業者への発注金額）。「—」の行（材料費・駐車場代・販管費）はまだ取り込んでいない。会計ソフトから取り込めるようにする予定で、それまで営業利益は売上総利益と同じ値になる。${
      z.length?`<br><span style="color:var(--warn)">この年度に、売上はあるのに発注が1件も入っていない案件が ${z.length}件・${yen(z.reduce((a,c)=>a+salesEx(c),0))} ある。その分、原価が抜けて粗利が大きく出ている（要確認の「原価なし」）。</span>`:''}</p>`;
}

/* 要確認からその場で直す */
function fixCost(cid){

  return `<div style="margin-top:8px">
    ${ps.map(p=>`<div class="prow" data-p="${p.id}">

function fixDone(cid){
  const c=DB.cases.find(x=>x.id===cid); if(!c)return '';

    <span class="note" style="margin:0">完工日</span>

/* ================= 要確認 ================= */
let ckScope='運用中';
function vCheck(){
  const B=byId();
  let all=issues();
  const total=all.length;
  if(ckScope==='運用中')all=all.filter(i=>{const c=B[i.c]; return c&&c.live;});
  /* 同じ案件・同じ種類は1つにまとめる（工程ごとに何度も出ないように） */
  const g={};
  all.forEach(i=>{ const arr=(g[i.k]=g[i.k]||[]); const hit=arr.find(x=>x.c===i.c);
    if(hit){hit.n=(hit.n||1)+1; if(i.t&&hit.t.indexOf(i.t)<0&&hit.t.length<80)hit.t+='／'+i.t;} else arr.push(Object.assign({n:1},i)); });
  const order=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  const shown=order.reduce((a,k)=>a+g[k].length,0);
  return `<div class="bar"><h2>要確認 <span style="color:var(--warn)">${shown}</span></h2>
      <div class="seg"><button data-ck="運用中" class="${ckScope==='運用中'?'on':''}">運用中だけ</button><button data-ck="すべて" class="${ckScope==='すべて'?'on':''}">過去データも</button></div>
      <span class="note" style="margin:0">${ckScope==='運用中'?`過去データを含めると ${total} 件。過去分は「マスタ」の一括置き換えや「完工日なし」の予定日ボタンでまとめて減らせる`:'案件ごとにまとめて数えている'}</span></div>
    ${shown?`<div class="kpi">${order.map(k=>`<div class="k"><small>${esc(k)}</small><b>${g[k].length}</b></div>`).join('')}</div>`
      :'<div class="card empty">運用中の案件に、直すところは無い。</div>'}
    ${order.map(k=>`<h3 style="font-size:14px;margin:14px 0 7px">${esc(k)}　${g[k].length}件</h3>
      ${g[k].slice(0,25).map(i=>`<div class="ck"><span class="t">${esc(k)}${i.n>1?` ×${i.n}`:''}</span><b>${esc((B[i.c]||{}).prop||i.t)}</b>${(B[i.c]||{}).prop&&i.t!==(B[i.c]||{}).prop?`<span class="note" style="margin:0 0 0 8px">${esc(i.t)}</span>`:''}
        <div class="d">${esc(i.d)}</div>
        ${k==='原価なし'?fixCost(i.c):
          k==='完工日なし'?fixDone(i.c):
          `<button class="btn small" data-open="${i.c}" style="margin-top:6px">この案件を開く</button>`}</div>`).join('')}
      ${g[k].length>25?`<p class="note">ほか ${g[k].length-25} 件。上から直していくと減る。</p>`:''}`).join('')}
    <p class="note">この一覧は入力を直すと自動で減る。</p>`;
}

/* ================= render ================= */
/* 再描画の前後で「どこを見ていたか・どこに入力していたか」を覚えて戻す。
   #main を丸ごと書き直す方式なので、これが無いと1セル直すたびに表が先頭に戻りフォーカスも消える */
const SCROLLERS='.tw,.lnw,.boardwrap,.cases,#dw,.cal,.drawer';
function elKey(el){
  if(el.id)return '#'+el.id;
  const cls=(typeof el.className==='string'?el.className:'').trim(); if(!cls)return null;
  const sel='.'+cls.split(/\s+/).join('.');
  return sel+'|'+[...document.querySelectorAll(sel)].indexOf(el);
}
function elByKey(k){
  if(!k)return null;
  if(k[0]==='#')return document.getElementById(k.slice(1));
  const [sel,i]=k.split('|'); return document.querySelectorAll(sel)[+i]||null;
}
function memView(){
  const m={win:[window.scrollX,window.scrollY],els:[],focus:null};
  document.querySelectorAll(SCROLLERS).forEach(el=>{ if(el.scrollTop||el.scrollLeft){const k=elKey(el); if(k)m.els.push([k,el.scrollLeft,el.scrollTop]);} });
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!a.closest('.ask')){
    let sel=null;
    if(a.id)sel='#'+CSS.escape(a.id);
    else{
      const attr=['data-lf','data-pf','data-f'].find(n=>a.hasAttribute(n));
      const row=a.closest('[data-l],[data-p],[data-pr],[data-v],[data-cm]');
      if(attr&&row){const rn=['data-l','data-p','data-pr','data-v','data-cm'].find(n=>row.hasAttribute(n));
        sel=`[${rn}="${CSS.escape(row.getAttribute(rn))}"] [${attr}="${CSS.escape(a.getAttribute(attr))}"]`;}
      else if(attr){const box=a.closest('#dw,.drawer,.card'); const bk=box?elKey(box):null;
        sel=(bk&&bk[0]==='#'?bk+' ':'')+`[${attr}="${CSS.escape(a.getAttribute(attr))}"]`;}
      else if(a.dataset.k)sel=`[data-k="${CSS.escape(a.dataset.k)}"]`;
    }
    if(sel){let ss=null,se=null; try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){} m.focus={sel,ss,se};}
  }
  return m;
}
function restoreView(m){
  if(!m)return false;
  let hitBoard=false;
  m.els.forEach(([k,x,y])=>{const el=elByKey(k); if(el){el.scrollLeft=x; el.scrollTop=y; if(/boardwrap/.test(k))hitBoard=true;}});
  window.scrollTo(m.win[0],m.win[1]);
  if(m.focus){ let el=null; try{el=document.querySelector(m.focus.sel);}catch(e){}
    if(el){ el.focus({preventScroll:true});
      try{ if(m.focus.ss!=null&&typeof el.setSelectionRange==='function'&&/^(text|search|)$/.test(el.type||''))el.setSelectionRange(m.focus.ss,m.focus.se); }catch(e){} } }
  return hitBoard;
}
let lastProcView='';
/* 発注の明細表の高さを、画面の下端までにそろえる。最初に開いたときから明細がたくさん見えるように */
function fitLnw(){
  const t=document.querySelector('#main .lnw'); if(!t)return;
  const top=t.getBoundingClientRect().top+window.scrollY, nav=(document.querySelector('.top')||{offsetHeight:0}).offsetHeight;
  let h=window.innerHeight-top-12;
  const wide=window.innerWidth>980;   /* 広い画面：メニューは左なので、上の帯の高さは引かない */
  if(h<window.innerHeight*0.72)h=window.innerHeight-(wide?16:nav+24);   /* 上が詰められないほど低い画面では、従来どおり画面のほぼ全部 */
  t.style.maxHeight=Math.max(240,Math.round(h))+'px';
}
/* 工程を組む：日の幅を、表の枠に1か月が収まる幅にする（52〜86px。狭い画面では横にスクロール） */
function fitProc(){
  const w=document.querySelector('#main .boardwrap.pcw'), t=w&&w.querySelector('table.bd'); if(!t)return;
  const D=+t.dataset.days||31, col=Math.max(52,Math.min(86,Math.floor((w.clientWidth-114)/D)));
  [t,document.querySelector('#main .avwrap table.bd')].forEach(x=>{ if(x){ x.style.setProperty('--col',col+'px'); x.style.width=(112+col*D)+'px'; x.classList.toggle('narrow',col<76); } });
}
window.addEventListener('resize',()=>{ if(inOrder())fitLnw(); if(inProc())fitProc(); });
function render(){
  if(!SESSION||!ME){ paintLogin(); return; }
  tipHide(); keepView();
  const mem=memView();
  withHidden(()=>{ renderTabs(); paint(); });
  if(inOrder()){ fitLnw(); pinApply(); }
  if(inProc())fitProc();
  const hitBoard=restoreView(mem);
  if(inProc()){
    /* 工程表は、案件か月が変わったときだけ最初のチップに寄せる（同じ表を触っている間は位置を保つ） */
    const key=pCase+'|'+pShift;
    const wrap=document.querySelector('#main .boardwrap.pcw');
    const ch=wrap&&wrap.querySelector('.chip.pc');
    if(wrap&&ch&&(key!==lastProcView||!hitBoard)&&key!==lastProcView){const td=ch.closest('td');
      wrap.scrollLeft=Math.max(0,td.offsetLeft-wrap.clientWidth/2+td.offsetWidth/2);}
    lastProcView=key;
  }
}
/* 入力の change の直後は、ブラウザが次の欄へフォーカスを移してから描き直す（Tabで流せるように） */
let renderTimer=null;
function renderSoon(){ clearTimeout(renderTimer); renderTimer=setTimeout(()=>{renderTimer=null; render();},0); }
/* ---- 今までの案件を隠す（このブラウザだけ）。押した時点にある案件をすべて画面から外す。データは消さない ----
   画面を描くあいだだけ DB の案件・工程・発注・明細・完了報告を絞り、描き終わったら元に戻す（保存や操作はいつも全部のデータで動く） */
let HIDE=(()=>{ try{ const v=JSON.parse(localStorage.getItem('aw-hideold')||'null'); return v&&v.ids?{at:v.at,ids:new Set(v.ids)}:null; }catch(e){ return null; } })();
function setHideOld(on){
  if(on){ const ids=DB.cases.map(c=>c.id); HIDE={at:new Date().toISOString(),ids:new Set(ids)};
    try{ localStorage.setItem('aw-hideold',JSON.stringify({at:HIDE.at,ids})); }catch(e){ toast('このブラウザに覚えられなかった'); } }
  else { HIDE=null; try{ localStorage.removeItem('aw-hideold'); }catch(e){} }
  selCase=null; pCase=null; oCase=null; render();
}
function hideBar(){
  if(!HIDE)return '';   /* 隠していないとき：ボタンはメニューの下に置く（renderTabs） */
  return `<div class="hidebar on"><b>今までの案件 ${HIDE.ids.size.toLocaleString()} 件を隠しています</b>（${md(HIDE.at.slice(0,10))} に隠した。データは消えていません。このブラウザだけ）
    <button class="btn small" id="hideOff">全部表示に戻す</button></div>`;
}
function withHidden(fn){
  if(!HIDE)return fn();
  const keep={cases:DB.cases,procs:DB.procs,orders:DB.orders,lines:DB.lines,reports:DB.reports};
  const H=HIDE.ids;
  DB.cases=keep.cases.filter(c=>!H.has(c.id)); DB.procs=keep.procs.filter(p=>!H.has(p.case));
  DB.orders=keep.orders.filter(o=>!H.has(o.case)); DB.lines=keep.lines.filter(l=>!H.has(l.case));
  if(keep.reports)DB.reports=keep.reports.filter(r=>!H.has(r.case));
  try{ return fn(); } finally { Object.assign(DB,keep); }
}
function paint(){
  document.getElementById('main').innerHTML=(tab==='case'?'':hideBar()+inboxBanner())+(
    tab==='case'?vCase():tab==='vendor'?vVendors():tab==='client'?vClients():tab==='ledger'?vLedger():tab==='order'?vOrder():tab==='proc'?vProc():tab==='board'?vBoard():tab==='kanko'?vKanko():tab==='insp'?vInsp():

/** 区分だけ決めた工程を1本足す（業者・日付は空） */
function addKind(cid,k,quiet){
  const c=DB.cases.find(x=>x.id===cid); if(!c)return;
  if(!quiet)snap();
  DB.pseq++;
  /* 検査の担当：検査ができる人が1人だけならその人。何人もいれば空のまま（工程を組むの「検査担当の予定」で選ぶ） */
  const insps=isInsp(k)?DB.vendors.filter(v=>v.active!==false&&canInspect(v)).map(v=>v.name):[];
  const who=insps.length===1?insps[0]:'';
  DB.procs.push({id:'Q'+DB.pseq+DEV,case:cid,kind:k,who,date:'',amt:0,month:'',prog:''});
  if(!quiet)save();
}
function addInspection(cid){
  const c=DB.cases.find(x=>x.id===cid); if(!c)return;
  const ps=procsOf(cid);
  const base=ps.filter(p=>p.kind==='清掃'&&p.date).map(endOf).sort().pop()
    ||lastDayOf(ps)||c.done||c.plan||'';
  snap(); DB.pseq++;
  DB.procs.push({id:'Q'+DB.pseq+DEV,case:cid,kind:'AW検査',who:M.kensa||'検査担当',
    date:base,amt:0,month:'',prog:''});
  recalcPlan(c);
  save(); render();
  toast(`${c.prop||'現場'} に AW検査（${M.kensa||'検査担当'}${base?' '+md(base):''}）を入れた`, undo);
}
/* 手配ボード：職人の休みをその月ぶん入れる */
function askOff(who,m){
  const cur=offDays(who,m).join(',');
  const el=document.createElement('div'); el.className='ask';
  el.innerHTML=`<div class="dlg"><h4>${esc(who)} の休み（${mlab(m)}）</h4>
    <p class="note" style="margin:0 0 8px">休む日を数字で、カンマ区切り（例：3,10,17,24）。空にすると休みなし。</p>
    <input type="text" id="offT" value="${esc(cur)}" style="width:100%">
    <div class="askbtn" style="margin-top:12px"><button class="btn small" id="askNo">やめる</button>
      <button class="btn small primary" id="askYes">保存</button></div></div>`;
  document.body.appendChild(el); el.querySelector('#offT').focus();
  el.querySelector('#askNo').onclick=()=>el.remove();
  el.querySelector('#askYes').onclick=()=>{

    snap(); DB.off[who]=DB.off[who]||{}; DB.off[who][m]=days; save(); el.remove(); render();

function openCase(id){selCase=id; tab='ledger'; render();
  const dw=document.getElementById('dw'); if(dw)dw.scrollIntoView({block:'nearest'});}
function setField(id,f,v){
  const c=DB.cases.find(x=>x.id===id); if(!c)return;
  snap('case:'+id+':'+f);
  if(f==='sales'||f==='add')v=Math.round(+v||0);
  if(f==='bill'&&v)v=v+'-01';
  c[f]=v;
  if(f==='done'){setDone(c,v);return save();}
  if(f==='plan'){ if(v)c.planManual=1; else {delete c.planManual; recalcPlan(c);} }   /* 空にすると工程からの自動に戻る */
  save();

/* 発注済みの工程：送ったあとの発注書は業者を付け替えられない（前の業者宛ての発注書が、新しい業者に見えてしまう） */
function procOrderGuard(p,who){
  const o=p&&p.order?DB.orders.find(x=>x.id===p.order):null; if(!o||who===p.who||o.st==='下書き')return true;
  toast(`${o.no} は ${o.who||'業者未定'} さん宛てに送ってある（${o.st}）。業者を変えるときは、先に発注を取り消してください`); return false;
}
/* 工程が正：発注書の工期は工程の日付に合わせる。下書きの発注書は業者も合わせる（保存のたびに掛ける） */
function syncOrdersFromProcs(){
  const seen={};
  (DB.procs||[]).forEach(p=>{ if(!p.order||seen[p.order])return; seen[p.order]=1; const o=(DB.orders||[]).find(x=>x.id===p.order); if(!o)return;
    if(p.date&&(o.start!==p.date||(o.end||'')!==(p.end||''))){ o.start=p.date; o.end=p.end||''; }
    if(o.st==='下書き'&&p.who&&o.who!==p.who){ o.who=p.who; o.taxable=vendorTaxable(p.who); (DB.lines||[]).forEach(l=>{ if(l.order===o.id)l.who=p.who; }); } });
}
function setProc(pid,f,v){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  if(f==='who'&&!procOrderGuard(p,v)){ render(); return; }
  snap('proc:'+pid+':'+f);
  if(f==='amt')v=+v||0;
  p[f]=v; if(f==='date'||f==='end')p.month='';
  if((f==='who'||f==='date')&&p.ask){ p.ask=''; p.askAt=null; }
  if(f==='who'&&v){const mv=vendorOf(v); if(mv&&mv.defKind&&PKINDS.indexOf(p.kind)<0)p.kind=mv.defKind;}
  if(f==='end'&&p.end&&(!p.date||p.end<=p.date))p.end='';          // 開始以前＝1日だけ
  if(f==='date'&&p.end&&p.end<=p.date)p.end='';
  const c=DB.cases.find(x=>x.id===p.case);
  if(c&&(f==='date'||f==='end'))recalcPlan(c);
  save();
}

/* その工程の作業量：間取り・大きさ（大中小）と、その人が受け持つ明細（検査の人は自社施工、ほかはその区分の明細） */
function workOf(p,c){
  const ls=linesOf(c.id).filter(l=>!l.cut&&+l.qty>0&&(isInsp(p.kind)?l.kind==='自社施工':(l.kind===p.kind||(p.who&&l.who===p.who))));
  return {vol:volumeOf(c),ls};
}
function workHtml(p,c){
  const w=workOf(p,c), v=w.vol;
  const head=`間取り ${v.madori?esc(v.madori)+(v.guess?'（推測）':''):'未設定'}　大きさ <strong>${v.size}</strong>`;
  const lab=isInsp(p.kind)?'自社施工':esc(p.kind)+'の明細';
  const list=w.ls.slice(0,6).map(l=>`・${esc(l.name)} ${+l.qty}${esc(l.unit||'')}`).join('<br>');
  return `<span class="w">${head}</span><span class="w">${lab} <strong>${w.ls.length}</strong>件${w.ls.length?'<br>'+list+(w.ls.length>6?`<br>ほか${w.ls.length-6}件`:''):''}</span>`;

/* ================= ドラッグ ================= */
let dragId=null;
const clearDZ=()=>document.querySelectorAll('td.ok,td.ng').forEach(n=>n.classList.remove('ok','ng'));
function checkDrop(pid,who,ds){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return ['工程が見つからない'];
  const w=[], len=spanLen(p), days=spanDays({date:ds,end:len>1?addDays(ds,len-1):''}), last=days[days.length-1]||ds;
  const h=days.find(d=>isOff(who,d));
  if(h)w.push(`${who} は ${md(h)} が休み`);
  if(!isStaffJob(p.kind)&&clash(pid,who,days))w.push(`${days.length>1?md(ds)+'〜'+md(last):md(ds)} はすでに現場が入っている（1日2現場になる）`);
  const c=DB.cases.find(x=>x.id===p.case);
  if(c){const other=procsOf(c.id).filter(x=>x.id!==pid&&x.date);
    if(p.kind==='清掃'&&other.some(x=>isSeko(x.kind)&&endOf(x)>ds))w.push('工事より前に清掃が来る');
    if(isSeko(p.kind)&&other.some(x=>x.kind==='清掃'&&x.date<last))w.push('清掃より後に工事が来る');
    if(isInsp(p.kind)&&other.some(x=>x.kind==='清掃'&&endOf(x)>ds))w.push('清掃より前にAW検査が来る');}
  return w;
}
function applyMove(pid,who,ds){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return; if(!procOrderGuard(p,who)){ render(); return; }
  snap();
  const c=DB.cases.find(x=>x.id===p.case);
  const from=`${p.who} ${md(p.date)}`;
  const len=spanLen(p); p.who=who; p.date=ds; p.end=len>1?addDays(ds,len-1):''; p.month='';
  recalcPlan(c);
  selProc=pid; save(); render();
  toast(`${(c||{}).prop||'現場'}：${from} → ${who} ${md(ds)}`, undo);
}
/** 工程を組むタブ：担当はそのままで日だけ動かす */
function setDate(pid,ds,de){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  if(de&&de<ds){const t=ds;ds=de;de=t;}
  const nEnd=(de&&de>ds)?de:'';
  if(p.date===ds&&(p.end||'')===nEnd)return;
  snap(); const from=p.date?spanLabel(p):'未定'; p.date=ds; p.end=nEnd; p.month='';
  const c=DB.cases.find(x=>x.id===p.case);
  recalcPlan(c);
  selProc=pid; save(); render();
  toast(`${p.kind}（${p.who||'業者未定'}）を ${from} → ${spanLabel(p)} に`, undo);
}
/** ドラッグ：期間の長さを保ったまま開始日を動かす */
function shiftDate(pid,ds){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  const len=spanLen(p); setDate(pid,ds,len>1?addDays(ds,len-1):'');
}
function dateWarn(pid,ds,de){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return [];
  const w=[]; const days=spanDays({date:ds,end:de||''}); const last=days[days.length-1]||ds;
  if(p.who&&SEN.indexOf(p.who)>=0){const h=days.find(d=>isOff(p.who,d));
    if(h)w.push(`${p.who} は ${md(h)} が休み`);}
  if(p.who&&!isStaffJob(p.kind)&&clash(pid,p.who,days))
    w.push(`${p.who} は ${days.length>1?md(ds)+'〜'+md(last):md(ds)} に別の現場がある`);
  const other=procsOf(p.case).filter(x=>x.id!==pid&&x.date);
  if(p.kind==='清掃'&&other.some(x=>isSeko(x.kind)&&endOf(x)>ds))w.push('工事より前に清掃が来る');
  if(isSeko(p.kind)&&other.some(x=>x.kind==='清掃'&&x.date<last))w.push('清掃より後に工事が来る');
  if(isInsp(p.kind)&&other.some(x=>x.kind==='清掃'&&endOf(x)>ds))w.push('清掃より前にAW検査が来る');
  return w;
}
function tryDate(pid,ds,de,keep){
  if(keep){const p=DB.procs.find(x=>x.id===pid); const len=p?spanLen(p):1; de=len>1?addDays(ds,len-1):'';}
  const w=dateWarn(pid,ds,de);
  if(!w.length){setDate(pid,ds,de);return;}
  const el=document.createElement('div'); el.className='ask';
  el.innerHTML=`<div class="askbox"><h4>この日に置くと問題が出る</h4>
    <ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="askbtn"><button class="btn small" id="askNo">やめる</button>
      <button class="btn small primary" id="askYes">このまま置く</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#askNo').onclick=()=>el.remove();
  el.querySelector('#askYes').onclick=()=>{el.remove();setDate(pid,ds,de);};
}
/** 工程を組む表のクリック：1回目＝開始日、2回目＝終了日。同じ日を2回なら1日だけ */
function clickDay(pid,ds){
  if(pendStart&&pendStart.pid===pid){
    const a=pendStart.day; pendStart=null;
    if(a===ds){tryDate(pid,ds,'');}
    else{tryDate(pid,a<ds?a:ds,a<ds?ds:a);}

function tryMove(pid,who,ds){

    <div class="askbtn"><button class="btn small" id="askNo">やめる</button>
      <button class="btn small primary" id="askYes">このまま移動</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#askNo').onclick=()=>el.remove();
  el.querySelector('#askYes').onclick=()=>{el.remove();applyMove(pid,who,ds);};
}

/* 検索欄。日本語の変換中は描き直さない（変換が途中で確定されてしまうため） */
const QIDS=['fQ','pQ','mQ','oQ'];
let composing=false, qTimer=null;
function setQ(id,v){
  if(id==='fQ')fQ=v;
  else if(id==='mQ')mQ=v;
  else if(id==='oQ'){oQ=v; oCase=null; oSel={};}
  else {pQ=v; pCase=null;}
}
function renderQ(id){
  const el=document.getElementById(id);
  const pos=el?el.selectionStart:null;
  render();
  const n=document.getElementById(id);
  if(n){ n.focus();
    try{ const p=(pos==null?n.value.length:Math.min(pos,n.value.length)); n.setSelectionRange(p,p); }catch(_){}
  }
}
document.addEventListener('compositionstart',e=>{ if(QIDS.indexOf(e.target.id)>=0)composing=true; });
document.addEventListener('compositionend',e=>{
  if(QIDS.indexOf(e.target.id)<0)return;
  composing=false; setQ(e.target.id,e.target.value);
  clearTimeout(qTimer); qTimer=setTimeout(()=>renderQ(e.target.id),10);
});
/* 数字欄はフォーカスで全選択。「0」の前後に打って 01 / 30 になるのを防ぐ */
document.addEventListener('focusin',e=>{
  const t=e.target; if(!(t instanceof HTMLInputElement)||t.type!=='number')return;
  setTimeout(()=>{ try{ t.select(); }catch(_){ } },0);
});
document.addEventListener('input',e=>{
  const id=e.target.id; if(QIDS.indexOf(id)<0)return;
  setQ(id,e.target.value);
  if(composing||e.isComposing)return;
  clearTimeout(qTimer); qTimer=setTimeout(()=>renderQ(id),180);
});
const DL={save:async({filename,data})=>{ const u=URL.createObjectURL(data); const el=document.createElement('a'); el.href=u; el.download=filename; document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }};
let canDl=true;
async function exportCsv(){
  if(!DL){toast('この画面ではファイルの書き出しが使えない');return;}
  const head=['案件ID','顧客','物件','区分','ステータス','売上税抜','追加税抜','売上税込','原価税抜','粗利税抜',
    '完工予定','完工日','請求月','工程'];
  const rows=DB.cases.map(c=>[c.id,c.client,c.prop,c.kind,c.st,c.sales,c.add,salesOf(c),costOf(c.id),
    grossOf(c),planOf(c),c.done,ym(c.bill),
    procsOf(c.id).map(p=>`${p.kind}:${p.who||'未定'}:${p.date||'未定'}:${p.amt}`).join(' / ')]);
  const csv='﻿'+[head,...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  try{
    await DL.save({filename:'ワークス台帳.csv',data:new Blob([csv],{type:'text/csv'})});
    toast('CSVを書き出した');
  }catch(e){
    toast(e&&e.code==='declined'?'書き出しを取りやめた':'書き出せなかった');
  }
}

function adminCards(){
  if(location.hash!=='#admin')return '';
  return `<div class="card" style="margin-top:18px"><h3 style="margin:0 0 6px">旧台帳（Artifact版）からの取り込み</h3>
      <p class="note">旧台帳のマスタ画面（#admin）で「全データをコピーする」を押してから、ここに貼り付けて「取り込む」。同じ id は上書き、無いものは追加。</p>
      <textarea id="impJson" style="width:100%;height:120px;font:11px ui-monospace,monospace" placeholder="ここに貼り付け"></textarea>
      <div class="bar"><button class="btn small primary" id="impRun">取り込む</button><span id="impMsg" class="note"></span></div></div>`;
}
function vMaster(){ return vMaster0()+adminCards(); }
function paintLogin(){
  const main=document.getElementById('main')||document.body;
  const email=(()=>{try{return localStorage.getItem('aw-email')||'';}catch(e){return '';}})();
  main.innerHTML=`<div class="card" style="max-width:420px;margin:60px auto;padding:24px">
    <h2 style="margin:0 0 6px">ワークス台帳</h2>
    <p class="note" style="margin:0 0 14px">会社のメールアドレスを入れると、ログイン用のリンクが届きます。</p>
    <input type="email" id="lgEmail" placeholder="name@and-w.co.jp" value="${esc(email)}" style="width:100%;margin-bottom:10px">

    btn.disabled=true; const ok=await sendMagicLink(v); document.getElementById('lgMsg').textContent=ok?'メールを確認してください（届かない場合は迷惑メールも）':'送れませんでした'; btn.disabled=false; };
}
/* 旧台帳（Artifact版）の全データを貼り付けて取り込む */
async function importFromV3(){
  const ta=document.getElementById('impJson'), msg=document.getElementById('impMsg'); if(!ta)return;
  let d; try{ d=JSON.parse(ta.value); }catch(e){ msg.textContent='貼り付けた内容が読めない（JSON ではない）'; return; }
  if(!d||!Array.isArray(d.cases)){ msg.textContent='形式が違う'; return; }
  msg.textContent='取り込み中…';
  try{
    const put=async(t,recs)=>{ for(let i=0;i<recs.length;i+=200){ const {error}=await sb.from(t).upsert(recs.slice(i,i+200).map(r=>recToRow(t,r)),{onConflict:t==='vendors'?'name':'id'}); if(error)throw new Error(t+'：'+error.message); } };
    const vendors=(d.vendors||[]).map(v=>Object.assign({},v,{id:v.id||('V'+Math.random().toString(36).slice(2,10))}));
    const clients=(d.clients||[]).map(c=>Object.assign({},c,{id:c.id||('CL'+Math.random().toString(36).slice(2,10))}));
    await put('clients',clients); await put('vendors',vendors); await put('prices',d.prices||[]);
    await put('cases',d.cases||[]); await put('procs',d.procs||[]); await put('lines',d.lines||[]); await put('orders',d.orders||[]);
    const recv=Object.entries(d.recv||{}).map(([k,v])=>{const [client,month]=k.split('|'); return {org:ORG,client,month,amount:+v||0};});
    const paid=Object.entries(d.paid||{}).map(([k,v])=>{const [who,month]=k.split('|'); return {org:ORG,who,month,amount:+v||0};});
    const off=[]; Object.entries(d.off||{}).forEach(([who,m])=>Object.entries(m||{}).forEach(([month,days])=>off.push({org:ORG,who,month,days:(days||[]).map(Number)})));
    if(recv.length){const {error}=await sb.from('receipts').upsert(recv); if(error)throw error;}
    if(paid.length){const {error}=await sb.from('payments').upsert(paid); if(error)throw error;}
    if(off.length){const {error}=await sb.from('days_off').upsert(off); if(error)throw error;}
    await sb.from('settings').upsert({org:ORG,key:'basis',value:d.basis||'完工'});
    msg.textContent=`取り込んだ：案件 ${(d.cases||[]).length}・工程 ${(d.procs||[]).length}・明細 ${(d.lines||[]).length}・発注 ${(d.orders||[]).length}。読み直します`;
    await dbLoad(); render();
  }catch(e){ msg.textContent='失敗：'+String((e&&e.message)||e); }
}

render();
initAuth();
if(reseeded)toast('元データを新しくしたので、この画面に保存してあった前回の編集は消えている');
</script>
