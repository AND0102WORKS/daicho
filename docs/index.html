<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<title>ワークス台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F6F5F1; --card:#FFFFFF; --card2:#FBFAF7; --ink:#1E2A32; --sub:#55616B;
  --line:#DAD7CE; --line2:#ECEAE3; --acc:#0F5E63; --acc-ink:#FFFFFF;
  --warn:#A8321A; --warn-bg:#FBE9E4; --ok:#1F6B45; --ok-bg:#E3F0E8;
  --c-step:#E7D8F0; --c-crea:#CFE3EE; --c-buddy:#F3E2C7; --c-pres:#D8E9D4;
  --c-nz:#F6D9D9; --c-izumi:#E2E4CF; --c-other:#E6E4DD;
  --gut:max(16px, env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding:0 var(--gut) 40px}
h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:.01em}
p{margin:0}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:9px var(--gut);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:15px;line-height:1.25}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:8px 9px;border-radius:8px;font-weight:700;
  color:var(--sub);min-height:36px;font-size:13.5px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.src{margin-left:auto;font-size:11px;color:var(--sub);text-align:right;line-height:1.5}
.tabs button{display:inline-flex;align-items:center;gap:6px;position:relative}
.tabs button svg{flex:none;width:17px;height:17px}
.tabs button .bdg{font-style:normal;background:var(--warn);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700;line-height:1.6}
.tabs .sep{display:none}
#menuFold{display:none}
.src .btn{margin-top:4px}
/* 広い画面：メニューは左に縦に並べる。たたむとアイコンだけ（body.slim） */
@media (min-width:981px){
  .top{position:fixed;left:0;top:0;bottom:0;width:var(--side);flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:6px;
    padding:14px 10px 10px;border-bottom:none;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
  body{--side:196px}
  body.slim{--side:56px}
  .top .brand{padding:2px 8px 10px;font-size:16px;white-space:nowrap}
  .top .brand small{display:none}
  .tabs{flex-direction:column;gap:2px;flex-wrap:nowrap}
  .tabs button{text-align:left;padding:9px 12px;font-size:14px;gap:11px;min-height:40px;white-space:nowrap}
  .tabs button svg{width:21px;height:21px}
  .tabs button .bdg{margin-left:auto}
  .tabs .sep{display:block;height:1px;background:var(--line);margin:6px 4px}
  #menuFold{display:block;border:none;background:transparent;text-align:left;padding:8px 12px;color:var(--sub);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  #menuFold:hover{color:var(--ink)}
  .top .src{margin:auto 0 0;text-align:left;padding:8px 6px 0;border-top:1px solid var(--line)}
  .wrap{margin-left:var(--side);padding-top:12px}
  .drawer{top:10px;max-height:calc(100vh - 24px)}
  body.slim .top{padding:14px 6px 10px}
  body.slim .top .brand{font-size:0;padding:0 0 8px;text-align:center}
  body.slim .top .brand::before{content:"W";font-size:18px}
  body.slim .tabs button{justify-content:center;padding:9px 0;gap:0}
  body.slim .tabs button span{display:none}
  body.slim .tabs button .bdg{position:absolute;right:1px;top:1px;margin:0;font-size:10px;padding:0 5px}
  body.slim #menuFold{text-align:center;padding:8px 0;font-size:14px}
  body.slim .top .src{display:none}
}
/* 月次の表（損益）。月が横。1つのマスに金額（上）と比率（下）。色は明細の表と同じ（青＝売上・橙＝原価・緑＝利益） */
.plw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:calc(100vh - 230px)}
table.plt{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%;table-layout:auto}
table.plt th,table.plt td{padding:4px 9px;line-height:1.3;height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--card);color:var(--ink);position:relative}
table.plt thead th{position:sticky;top:0;z-index:3;background:var(--card2);font-weight:700;font-size:12.5px;color:var(--ink);text-align:right;border-bottom:1px solid var(--line);cursor:pointer;height:32px}
table.plt thead th small{font-weight:500;font-size:10px;color:var(--sub);margin-right:4px}
table.plt thead th.g,table.plt thead th.ptot{cursor:default}
table.plt thead th.g{text-align:left;font-weight:500;font-size:11px;color:var(--sub)}
table.plt td.r{text-align:right;min-width:78px;cursor:pointer}
table.plt td.ptot{cursor:default}
table.plt td .v{display:block}
table.plt td small{display:block;font-size:10.5px;font-weight:500;color:var(--sub);line-height:1.25}
table.plt td small.low{color:var(--warn);font-weight:800}
table.plt td .z{color:#C4BFB3;font-weight:400}
table.plt .plbar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);opacity:.55;border-radius:0 2px 0 0}
table.plt .g{position:sticky;left:0;z-index:2;text-align:left;font-weight:700}
table.plt .g2{position:sticky;left:30px;z-index:2;min-width:170px;border-right:2px solid #8E9AA0}
table.plt td.g[colspan]{border-right:2px solid #8E9AA0;min-width:200px}
table.plt thead .g{z-index:4;left:0;border-right:2px solid #8E9AA0}
table.plt .vert{width:30px;min-width:30px;max-width:30px;padding:0;text-align:center;vertical-align:middle;font-weight:700;font-size:11px;color:var(--sub);border-right:1px solid var(--line2)}
table.plt .vert span{writing-mode:vertical-rl;letter-spacing:.25em}
table.plt tr.band td{font-weight:800;font-size:13px;height:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.plt tr.band.sales td{background:#EEF4FA}
table.plt tr.band.gross td{background:#EEF6F0}
table.plt tr.band.op td{background:var(--ok-bg);border-top:2px solid var(--ok);font-size:13.5px}
table.plt tr.band td.g small{display:inline;font-weight:500;font-size:10.5px;color:var(--sub);margin-left:8px}
table.plt tr.sum td{font-weight:700;background:#FBF3E6}
table.plt tr.sum.sga td{background:#F3EFE7}
table.plt tr.sum td.vert{background:var(--card)}
table.plt tr.dt td{color:var(--sub);font-weight:400}table.plt tr.dt td.g2{color:var(--ink);padding-left:20px}
table.plt td.na{color:#C4BFB3}
table.plt td.neg .v{color:var(--warn)}
table.plt td.cur,table.plt th.cur{box-shadow:inset 0 0 0 9999px rgba(15,94,99,.05)}
table.plt th.cur{color:var(--acc)}
table.plt td.sel,table.plt th.sel{box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc),inset 0 0 0 9999px rgba(15,94,99,.09)}
table.plt th.sel{box-shadow:inset 2px 0 0 var(--acc),inset -2px 0 0 var(--acc),inset 0 2px 0 var(--acc),inset 0 0 0 9999px rgba(15,94,99,.09)}
table.plt tbody tr:hover td{background-image:linear-gradient(rgba(0,0,0,.018),rgba(0,0,0,.018))}
table.plt .ptot{font-weight:700;border-left:2px solid #8E9AA0;min-width:100px}
table.plt tr.cnt td{color:var(--sub);font-size:11.5px;border-bottom:none}
.kpi .k.warnk{border-color:#E7BCB0;background:var(--warn-bg)}.kpi .k.warnk b{font-size:14px;color:var(--warn)}.kpi .k.warnk a{cursor:pointer;text-decoration:underline}
.vst{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.vst i{width:7px;height:7px;border-radius:50%;display:inline-block}
.vst.use{background:var(--ok-bg);color:var(--ok)}.vst.use i{background:var(--ok)}
.vst.inv{background:#FFF1D6;color:#7A5200}.vst.inv i{background:#C98A00}
.vst.non{background:var(--line2);color:var(--sub)}.vst.non i{background:#9AA}
.vst.late{background:#FBE3E0;color:#A32A1E}.vst.late i{background:#C0392B}
.vst.wait{background:#E4ECF7;color:#2B4C7E}.vst.wait i{background:#3D6DB5}
.sub2{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.tpl{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px;margin-bottom:10px}
.tpl h5{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}.tpl pre{margin:0;font-family:inherit;font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:var(--sub)}
.tchip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--acc);color:var(--acc);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.tmore{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
.trest{display:inline-flex;gap:6px;flex-wrap:wrap}.trest[hidden]{display:none}
.tchip::before{content:'＋'}.tchip.on{background:var(--acc);color:#fff}.tchip.on::before{content:'✓'}
.memota{width:100%;height:120px;font-family:inherit;font-size:13px;line-height:1.7;margin-top:4px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;box-sizing:border-box;resize:vertical}
.osmemo{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.osmemo .memota{height:76px}
/* 発注書の下のボタン：長い発注書でも、いつも見える所に置く */
.obact{position:sticky;bottom:-22px;background:var(--card);padding:10px 0 12px;margin:10px 0 0;border-top:1px solid var(--line);z-index:2;align-items:center}
.bseg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.bseg button{border:none;background:none;padding:0 13px;height:34px;font-weight:700;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer;opacity:1}
.bseg button+button{border-left:1px solid var(--line)}
.bseg button.on{background:var(--acc);color:#fff}
.billdoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 30px;max-width:780px;margin:0 auto;color:#111}.billdoc th{border-bottom:2px solid #222;background:none}
tr.vrow{cursor:pointer}tr.vrow td{padding:9px 10px}tr.vrow .nm b{font-size:13.5px}tr.vrow .nm small,.vnote{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.miss{color:var(--warn);font-weight:700}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.vgrid .card{margin:0}@media(max-width:1000px){.vgrid{grid-template-columns:1fr}}
.vpact{float:right;display:flex;gap:6px;align-items:center}.cphead .vst{vertical-align:3px}
.vgrid .cpform{grid-template-columns:1fr 1fr}.vpact a.btn{text-decoration:none}
.vlock{background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--sub);font-size:12.5px}
.vname{display:flex;align-items:center;gap:10px}.vname b{font-size:15px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;height:34px}
.pldrill{margin-top:10px;border-left:4px solid var(--acc)}
.pllow{margin-top:10px}
.pledw{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.pledw{grid-template-columns:1fr}}
.pled h5{margin:0 0 6px;font-size:13px}.pled h5 small{font-weight:500;color:var(--sub);margin-left:8px;font-size:11px}
.plrow{display:flex;gap:4px;align-items:center;margin-bottom:4px}.plrow .li{flex:1;height:30px}.plrow .btn{padding:0 8px;min-height:30px}
.plrow .x{border:none;background:none;color:var(--warn);font-weight:900;font-size:16px;cursor:pointer;padding:0 6px}
.plrow.fix{background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:5px 9px;flex-wrap:wrap}.plrow.fix .nm{font-weight:700;font-size:12.5px}.plrow.fix small{color:var(--sub);font-size:11px}
/* 明細の表のいちばん下：合計の行（列の真下にそろえる。スクロールしても下に残る） */
.ln tfoot td{position:sticky;bottom:0;z-index:3;background:var(--card);border-top:2px solid var(--acc);padding:6px 8px;font-size:14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln tfoot td.lab{text-align:left}.ln tfoot td.lab small{font-weight:500;font-size:11.5px;color:var(--sub);margin-left:12px}.ln tfoot td.lab small.w{color:var(--warn);font-weight:700}
.cpembed .ohead>.bar>h3,.cpembed .ohead>.bar>.cl,.cpembed .ohead>.bar>.st,.cpembed .ohead>.bar>.flag,.cpembed .ohead [data-open]{display:none}
.cpembed .siteinfo:not(.miss){display:none}
.cpback{color:var(--acc);font-weight:700;cursor:pointer;font-size:12.5px;margin-right:12px;vertical-align:3px;white-space:nowrap}
.cpsub a{color:inherit;cursor:pointer}.cpsub a:hover{color:var(--acc)}.cpsub .ed{margin-left:8px;color:var(--acc);font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.bar h2{font-size:17px;margin-right:4px}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-width:112px}
.kpi .k small{display:block;font-size:10.5px;color:var(--sub);margin-bottom:1px}
.kpi .k b{font-size:17px;font-variant-numeric:tabular-nums}
select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=month]{
  height:36px;border:1.5px solid var(--line);border-radius:8px;padding:0 9px;background:var(--card)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums;
  appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes chgflash{0%{background:#FDE9A9}70%{background:#FDF3D4}100%{background:transparent}}
table.ln tr.chg td{animation:chgflash 1.6s ease-out}
label.fl{display:block;font-size:11px;color:var(--sub);font-weight:700;margin:0 0 3px}
.btn{height:36px;padding:0 13px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);
  font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.small{height:30px;padding:0 9px;font-size:12.5px;border-color:var(--line)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--card2);text-align:left;padding:8px 9px;
  font-size:11.5px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:var(--card2)}
tbody tr.on td{background:var(--ok-bg)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.cl{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;
  background:var(--line2);white-space:nowrap}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.wip{background:#FFF1D6}
.st.new{background:var(--warn-bg);color:var(--warn)}
.flag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);
  border-radius:4px;padding:0 5px;margin-right:3px}
/* board */
.boardwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:72vh}
table.bd{font-size:12px;table-layout:fixed;--col:86px;--slot:30px;--slots:1}
table.bd th,table.bd td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;vertical-align:top;overflow:hidden}
table.bd thead th{padding:4px 2px;text-align:center;width:var(--col);font-size:11px}
table.bd thead th b{font-size:13px;color:var(--ink)}
table.bd thead th small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
table.bd thead th.sat{background:#EAF1F6}table.bd thead th.sun{background:#F8EDED}
table.bd thead th.nm,table.bd tbody th.nm{width:112px}
table.bd tbody th.nm{position:sticky;left:0;z-index:3;background:var(--ground);text-align:left;
  padding:6px 8px;font-weight:700;min-width:104px;width:104px;border-right:1px solid var(--line);font-size:12.5px}
table.bd tbody th.nm small{display:block;font-weight:400;color:var(--sub);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c{width:var(--col);height:calc(var(--slots) * var(--slot) + 6px);padding:2px;position:relative;cursor:cell}
td.c:hover{box-shadow:inset 0 0 0 2px var(--acc)}
.badd-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.badd-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;padding:7px 10px;font-size:13.5px;line-height:1.45;cursor:pointer}
.badd-list button:last-child{border-bottom:0}
.badd-list button.on{background:var(--ok-bg);font-weight:700}
.badd-list button small{display:block;color:var(--sub);font-weight:400;font-size:11.5px;margin-top:2px}
.badd-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.badd-row label{font-size:12px;color:var(--sub)}
table.bd th.sm,table.bd td.sm{width:54px;text-align:center;background:var(--ground);font-weight:700}
.more{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;line-height:1.5}
td.c.off{background:repeating-linear-gradient(135deg,#F1EFEA,#F1EFEA 5px,#E8E5DE 5px,#E8E5DE 10px)}
td.c.ok{outline:2px dashed var(--acc);outline-offset:-2px;background:var(--card2)}
td.c.ng{outline:2px dashed var(--warn);outline-offset:-2px;background:var(--warn-bg)}
.chip{display:block;width:100%;text-align:left;border:none;border-radius:6px;padding:2px 4px;
  height:calc(var(--slot) - 2px);margin-bottom:2px;overflow:hidden;
  font-family:inherit;font-size:11px;line-height:1.3;cursor:grab;color:var(--ink)}
.chip.sel{outline:2px solid var(--ink);outline-offset:-2px}
.chip.drag{opacity:.35}
.chip.tent{outline:1.5px dashed var(--ink);outline-offset:-2px;opacity:.78}
.chip .tentb{display:inline-block;font-size:9.5px;font-weight:900;background:var(--card);border:1px solid var(--ink);border-radius:3px;padding:0 3px;margin-right:3px;line-height:1.25}
.ctag{display:inline-block;font-size:11px;font-weight:700;color:var(--ink);border-radius:9px;padding:0 8px;margin-right:6px;line-height:1.6}
.chip .p{display:block;font-weight:700;font-size:10.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
/* ================= v4：Supabase が正。DB（メモリ）は画面用の写し =================
   方針：
   ・開くときに表を読んで DB を組み立てる。保存は「変わった行だけ upsert、消えた行は delete」。
   ・他の人の変更は Realtime（postgres_changes）で行単位に受け取り、その行だけ差し替える。
   ・合流・墓標・箱分け・採番ロックは無い（サーバー側で行単位に決まる）。
   ・列名と JS の項目名が違うものだけ MAP で変換する。 */
const M={seed:'db',cases:[],procs:[],clients:[],vendors:[],off:{},
  kensa:'',          /* AW検査の担当：発注先マスタで既定の工程区分が AW検査 の人（読み込み時に入る） */
  status:["受付","現調済","見積提出","受注","発注書送付","施工中","清掃済","完工","報告済","請求済"],
  senzoku:[],        /* 専属職人：発注先マスタの区分が 専属 の人（読み込み時に入る。配列は同じものを使い回す） */
  termNote:{},asof:'Supabase'};
const SB_URL='https://stcvyehefqnrxibanlxg.supabase.co', SB_KEY='sb_publishable_ZZelNGtUNXLpXs7j4Nd_zw_XFYwI3fx';
let sb=null, SESSION=null, ME=null, ORG='hq';
let DB=null, undoStack=[];
let reseeded=false;
const DEV=(()=>{ try{ let d=localStorage.getItem('aw-dev'); if(!d){ d='-'+Math.random().toString(36).slice(2,5); localStorage.setItem('aw-dev',d);} return d; }catch(e){ return '-'+Math.random().toString(36).slice(2,5); } })();
let dbState='', dbDirty=false, dbBusy=false, dbSaveTimer=null;
const AWLOG=(()=>{try{return JSON.parse(localStorage.getItem('aw-log')||'[]');}catch(e){return [];}})();
function alog(ev,x){ try{ AWLOG.push([new Date().toISOString().slice(5,19),DEV,ev,x==null?'':String(x).slice(0,160)]); while(AWLOG.length>80)AWLOG.shift(); localStorage.setItem('aw-log',JSON.stringify(AWLOG)); }catch(e){} }

/* ---- 表と JS 項目の対応 ---- */
const TABLES={
  cases: {cols:['id','org','client','prop','kind','st','live','ord','ord_by','sales','add_amt','bill','kisan','want','plan','plan_manual','done','keyx','warr','recv','case_no','src','memo','items','report','photo','addr','key_info','madori','est_amt','est_date','est_file'],
          map:{add:'add_amt',planManual:'plan_manual',caseNo:'case_no',ordBy:'ord_by',keyInfo:'key_info',estAmt:'est_amt',estDate:'est_date',estFile:'est_file'}, dates:['kisan','want','plan','done','est_date'], bools:['live','plan_manual']},
  procs: {cols:['id','org','case_id','kind','who','start_date','end_date','amt','month','prog','order_id','auto','memo','ask','ask_at'],
          map:{case:'case_id',date:'start_date',end:'end_date',order:'order_id',askAt:'ask_at'}, dates:['start_date','end_date'], bools:['auto'], ts:['ask_at']},
  lines: {cols:['id','org','case_id','no','name','spec','qty','unit','sell','price','kind','who','memo','cut','src','order_id','cost_qty','cost_unit'],
          map:{case:'case_id',order:'order_id',cqty:'cost_qty',cunit:'cost_unit'}, dates:[], bools:['cut']},
  orders:{cols:['id','org','no','case_id','who','kind','start_date','end_date','due','naiyo','memo','st','sent','proc_id','taxable','token'],
          map:{case:'case_id',start:'start_date',end:'end_date',proc:'proc_id'}, dates:['start_date','end_date','due','sent'], bools:['taxable']},
  /* seen_at・first_seen_at（業者が業者ページを開いた日時）は DB が入れる。画面は読むだけ */
  vendors:{cols:['id','org','name','full_name','type','def_kind','inv','close_day','site','phone','email','taxable','kinds','active','src','contact','addr','invited_at','pay_m','pay_d'],
          map:{full:'full_name',defKind:'def_kind',close:'close_day',invitedAt:'invited_at',payM:'pay_m',payD:'pay_d'}, dates:[], bools:['active','taxable'], ts:['invited_at']},
  clients:{cols:['id','org','name','full_name','mail','method','close_day','site','note','src','est_mode','contact','phone','addr','pay_m','pay_d','tpls'],
          map:{full:'full_name',close:'close_day',estMode:'est_mode',payM:'pay_m',payD:'pay_d'}, dates:[], bools:[]},
  prices:{cols:['id','org','name','alias','kind','unit','price','who','client','memo'], map:{}, dates:[], bools:[]},
  /* 完了報告（業者ページから出る）。スタッフは承認・差し戻しだけ書く */
  reports:{cols:['id','org','proc_id','case_id','who','done_date','note','base','extra','extra_note','photos','st','reply','approved_at','invoice_id'],
          map:{proc:'proc_id',case:'case_id',done:'done_date',extraNote:'extra_note',approvedAt:'approved_at',invoiceId:'invoice_id'}, dates:['done_date'], bools:[], ts:['approved_at']},
  /* 業者の請求書（業者ページで発行）／支払明細書（台帳で発行） */
  invoices:{cols:['id','org','who','kind','month','period_from','period_to','items','subtotal','tax','total','taxable','inv','st','issued_at','confirmed_at','paid_date'],
          map:{from:'period_from',to:'period_to',issuedAt:'issued_at',confirmedAt:'confirmed_at',paidDate:'paid_date'}, dates:['period_from','period_to','paid_date'], bools:['taxable'], ts:['issued_at','confirmed_at']},
  /* 顧客への請求書（台帳で作る）。作った時点の中身（items）を写して固定する */
  bills:{cols:['id','org','no','client','client_id','month','period_from','period_to','items','subtotal','tax','total','issued_date','due_date','st','paid_date','paid_amt','memo'],
          map:{clientId:'client_id',from:'period_from',to:'period_to',issued:'issued_date',due:'due_date',paidDate:'paid_date',paidAmt:'paid_amt'}, dates:['period_from','period_to','issued_date','due_date','paid_date'], bools:[]},
};
const REV={}; Object.keys(TABLES).forEach(t=>{ REV[t]={}; Object.entries(TABLES[t].map).forEach(([j,c])=>{REV[t][c]=j;}); });
/* 行（DBの列）→ JS のレコード */
function rowToRec(t,row){
  const T=TABLES[t], r={};
  Object.keys(row).forEach(c=>{ if(c==='updated_at'||c==='created_at')return;   /* token は読むだけ（職人・業者のリンク用。書き戻さない） */
    let v=row[c]; const j=REV[t][c]||c;
    if(v===null||v===undefined) v=(T.bools.indexOf(c)>=0)?(c==='taxable'):'';   /* 課税区分が空なら課税として扱う */
    if(T.dates.indexOf(c)>=0&&v){ if(v instanceof Date) v=`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; else v=String(v).slice(0,10); }
    if(t==='lines'&&c==='cut') v=v?1:0;
    r[j]=v; });
  if(t==='vendors'||t==='clients'){ if(r.full==null)r.full=''; }
  return r;
}
/* JS のレコード → 行 */
function recToRow(t,rec){
  const T=TABLES[t], row={};
  T.cols.forEach(c=>{ const j=REV[t][c]||c; let v=rec[j];
    if(c==='org'){ row.org=rec.org||ORG; return; }
    if(v===undefined) return;
    if(T.dates.indexOf(c)>=0) v=(v&&/^\d{4}-\d{2}-\d{2}/.test(String(v)))?String(v).slice(0,10):null;
    else if((T.ts||[]).indexOf(c)>=0) v=v?String(v):null;   /* 日時。空は null */
    else if(T.bools.indexOf(c)>=0) v=!!v;
    else if(['sales','add_amt','est_amt','amt','sell','price','close_day','site','base','extra','subtotal','tax','total'].indexOf(c)>=0||(t==='lines'&&c==='no')) v=(v===''||v==null)?(c==='no'?null:0):Math.round(+v||0);   /* DB は int。小数だと保存が全部止まる */
    else if(c==='qty') v=(v===''||v==null)?0:(+v||0);
    else if(c==='cost_qty') v=(v===''||v==null)?null:(+v||0);
    else if(c==='pay_m'||c==='pay_d') v=(v===''||v==null)?null:Math.round(+v||0);   /* 支払日（何か月後の何日）。空＝サイトから決める */   /* 空＝販売の数量と同じ */
    else if(v===null) v='';
    row[c]=v; });
  return row;
}
const sig=r=>{ const o={}; Object.keys(r).sort().forEach(k=>{ if(k!=='_u'&&k!=='token')o[k]=r[k]; }); return JSON.stringify(o); };
/* 職人・業者向けページのリンク */
const siteBase=()=>location.origin+location.pathname.replace(/[^/]*$/,'');
const vendorLink=v=>v&&v.token?siteBase()+'me.html?t='+v.token:'';
const orderLink=o=>o&&o.token?siteBase()+'order.html?t='+o.token:'';
function copyText(t,msg){ navigator.clipboard.writeText(t).then(()=>toast(msg||'コピーした')).catch(()=>prompt('コピーできなかった。手で選んでコピー：',t)); }
let recLast={};   /* 'table:id' → sig。変わった行を見つけるため */
const COLS={cases:1,procs:1,lines:1,orders:1,vendors:1,clients:1,prices:1,reports:1,invoices:1,bills:1};
function rememberAll(){ recLast={}; Object.keys(COLS).forEach(t=>(DB[t]||[]).forEach(r=>{ if(r.id)recLast[t+':'+r.id]=sig(r); })); kvSaved=kvFlat(); }
/* 入金・支払済・休み・計上基準・見送り：最後に保存した値（キーごと）。
   全件をまとめて書くと、古い画面の人が他の人の入力を古い値で上書きしてしまうので、変わったキーだけ書く */
let kvSaved={recv:{},paid:{},off:{},skip:{},basis:'完工',pl:'null',co:'null'};
function kvFlat(){
  const num=o=>{ const r={}; Object.entries(o||{}).forEach(([k,v])=>{ const n=Math.round(+v||0); if(n)r[k]=n; }); return r; };
  const off={}; Object.entries(DB.off||{}).forEach(([who,m])=>Object.entries(m||{}).forEach(([month,days])=>{ const d=(days||[]).map(Number).join(','); if(d)off[who+'|'+month]=d; }));
  const skip={}; Object.keys(DB.skip||{}).forEach(k=>{ if(DB.skip[k])skip[k]=1; });
  return {recv:num(DB.recv),paid:num(DB.paid),off,skip,basis:DB.basis||'完工',pl:JSON.stringify(DB.plItems||null),co:JSON.stringify(DB.co||null)};
}
const kvChanged=(cur,old)=>[...new Set([...Object.keys(cur),...Object.keys(old)])].filter(k=>cur[k]!==old[k]);
const kvSplit=k=>{ const i=k.lastIndexOf('|'); return [k.slice(0,i),k.slice(i+1)]; };
const SKIP_KEY='inbox_skip:';

/* ---- 読み込み ---- */
async function fetchAll(t,select){
  const out=[]; let from=0; const step=1000;
  for(;;){ const {data,error}=await sb.from(t).select(select||'*').range(from,from+step-1); if(error)throw error; out.push(...(data||[])); if(!data||data.length<step)break; from+=step; }
  return out;
}
async function dbLoad(){
  const [cases,procs,lines,orders,vendors,clients,prices,recv,paid,off,settings,reports,invoices,bills]=await Promise.all([
    fetchAll('cases'),fetchAll('procs'),fetchAll('lines'),fetchAll('orders'),fetchAll('vendors'),fetchAll('clients'),fetchAll('prices'),
    fetchAll('receipts'),fetchAll('payments'),fetchAll('days_off'),fetchAll('settings'),
    fetchAll('reports').catch(()=>[]),fetchAll('invoices').catch(()=>[]),fetchAll('bills').catch(()=>[])]);
  /* 業者への通知：通知を受け取る端末の数（業者ごと）と、知らせた記録。表がまだ無い DB でも台帳は開けるように */
  let pushRows=[], nlog=[]; try{ pushRows=await fetchAll('vendor_push','vendor_id'); }catch(e){} try{ nlog=await fetchAll('notify_log'); }catch(e){}
  /* 振込先：経理の印（profiles.fin）のある人だけが読める表。印が無ければ DB が1行も返さない */
  let bankRows=[]; if(ME&&ME.fin){ try{ bankRows=await fetchAll('vendor_bank'); }catch(e){ alog('bank',(e&&e.message)||e); } }   /* 表がまだ無い DB でも台帳は開けるように */
  DB={cases:cases.map(r=>rowToRec('cases',r)),procs:procs.map(r=>rowToRec('procs',r)),lines:lines.map(r=>rowToRec('lines',r)),
      orders:orders.map(r=>rowToRec('orders',r)),vendors:vendors.map(r=>rowToRec('vendors',r)),clients:clients.map(r=>rowToRec('clients',r)),
      prices:prices.map(r=>rowToRec('prices',r)),
      reports:reports.map(r=>rowToRec('reports',r)),invoices:invoices.map(r=>rowToRec('invoices',r)),bills:bills.map(r=>rowToRec('bills',r)),
      recv:{},paid:{},off:{},skip:{},basis:'完工',seed:'db',seq:0,pseq:0,lseq:0,oseq:0,prseq:0};
  DB.pushN={}; pushRows.forEach(r=>{ DB.pushN[r.vendor_id]=(DB.pushN[r.vendor_id]||0)+1; }); DB.nlog=nlog;
  DB.bank={}; bankRows.forEach(r=>{ if(r.bank)DB.bank[r.vendor_id]=r.bank; });
  recv.forEach(r=>{ if(+r.amount)DB.recv[r.client+'|'+r.month]=r.amount; });      /* 0 は「消した」の意味 */
  paid.forEach(r=>{ if(+r.amount)DB.paid[r.who+'|'+r.month]=r.amount; });
  off.forEach(r=>{ if((r.days||[]).length)(DB.off[r.who]=DB.off[r.who]||{})[r.month]=(r.days||[]).slice(); });
  settings.forEach(r=>{ if(r.key==='basis')DB.basis=r.value;
    else if(r.key==='cfg'&&r.value&&typeof r.value==='object')DB.cfg=r.value;
    else if(r.key==='co'&&r.value&&typeof r.value==='object')DB.co=r.value;   /* 請求書に載せる自社の情報 */
    else if(r.key==='pl_items'&&r.value&&typeof r.value==='object')DB.plItems=r.value;   /* 月次の科目（売上原価の内訳・販管費）。無ければ画面の既定 */   /* 会社ごとの設定（ボリュームの点数など）。無ければ画面の既定 */
    else if(String(r.key).indexOf(SKIP_KEY)===0&&r.value===true)DB.skip[String(r.key).slice(SKIP_KEY.length)]=1; });   /* 見送った受注受付 */
  /* 案件は新しいものが上。採番は既存の最大＋1 から */
  DB.cases.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  const mx=(arr,re)=>arr.reduce((m,r)=>{const k=re.exec(String(r.id)); return k?Math.max(m,+k[1]):m;},0);
  DB.seq=mx(DB.cases,/^[CRN](\d+)/); DB.pseq=mx(DB.procs,/^[PQ](\d+)/); DB.lseq=mx(DB.lines,/^L(\d+)/); DB.prseq=mx(DB.prices,/^PR(\d+)/);
  migrate(); rememberAll();
  if(typeof undoStack!=='undefined')undoStack.length=0; remoteLog.length=0;   /* 読み直す前の控えに戻すと、その間の他の人の変更を消してしまう */
  M.senzoku.length=0; DB.vendors.filter(v=>v.type==='専属').forEach(v=>M.senzoku.push(v.name));
  M.kensa=(DB.vendors.find(v=>v.defKind==='AW検査')||{}).name||'';
  dbState='読み込んだ '+new Date().toTimeString().slice(0,5);
  alog('load','cases='+DB.cases.length+' procs='+DB.procs.length+' lines='+DB.lines.length+' orders='+DB.orders.length);
}

function dbSaveSoon(){ dbDirty=true; clearTimeout(dbSaveTimer); dbSaveTimer=setTimeout(dbSaveNow,400); }
async function dbSaveNow(){
  if(!sb||!dbDirty)return; if(dbBusy){dbSaveSoon();return;}
  dbBusy=true; dbDirty=false;
  try{
    /* 画面側で id 無しで作られたマスタ行に id を振る */
    (DB.vendors||[]).forEach(v=>{ if(!v.id)v.id='V'+Math.random().toString(36).slice(2,10); });
    (DB.clients||[]).forEach(c=>{ if(!c.id)c.id='CL'+Math.random().toString(36).slice(2,10); });
    /* 先に全部の表の差分を出し、自分が消す行・書く行を覚えておく（Realtime の反射を「他の人の変更」と取り違えないため。
       案件を消すと DB 側で工程・明細・発注も一緒に消え、その通知が自分の delete より先に届くことがある） */
    const plan={};
    for(const t of Object.keys(COLS)){
      const arr=DB[t]||[], seen=new Set(), ups=[], dels=[], after=[];
      arr.forEach(r=>{ if(!r.id)return; seen.add(r.id); const k=t+':'+r.id, sg=sig(r); if(recLast[k]!==sg){ const row=recToRow(t,r); ups.push(row); after.push([k,sg]); sentRows[k]=row; } });
      Object.keys(recLast).forEach(k=>{ if(k.indexOf(t+':')!==0)return; const id=k.slice(t.length+1); if(!seen.has(id)){ dels.push(id); ownDel[k]=Date.now(); } });
      plan[t]={ups,dels,after};
    }
    for(const t of Object.keys(COLS)){
      const {ups,dels,after}=plan[t];
      if(dels.length){ const {error}=await sb.from(t).delete().in('id',dels); if(error)throw error; dels.forEach(id=>delete recLast[t+':'+id]); alog('del '+t,dels.length); }
      for(let i=0;i<ups.length;i+=200){ const {error}=await sb.from(t).upsert(ups.slice(i,i+200),{onConflict:'id'}); if(error)throw error; }
      after.forEach(([k,sg])=>{recLast[k]=sg;});     /* 成功してから「保存済み」にする（失敗分は次回また書く） */
      if(ups.length)alog('upsert '+t,ups.length);
    }
    /* 入金・支払済・休み・計上基準・見送り：変わったキーだけ書く。消したものは 0（休みは空）で上書きする */
    const cur=kvFlat();
    const recv=kvChanged(cur.recv,kvSaved.recv).map(k=>{const [client,month]=kvSplit(k); return {org:ORG,client,month,amount:cur.recv[k]||0};});
    const paid=kvChanged(cur.paid,kvSaved.paid).map(k=>{const [who,month]=kvSplit(k); return {org:ORG,who,month,amount:cur.paid[k]||0};});
    const off=kvChanged(cur.off,kvSaved.off).map(k=>{const [who,month]=kvSplit(k); return {org:ORG,who,month,days:cur.off[k]?cur.off[k].split(',').map(Number):[]};});
    const sets=kvChanged(cur.skip,kvSaved.skip).map(k=>({org:ORG,key:SKIP_KEY+k,value:!!cur.skip[k]}));
    if(cur.basis!==kvSaved.basis)sets.push({org:ORG,key:'basis',value:cur.basis});
    if(cur.pl!==kvSaved.pl&&DB.plItems)sets.push({org:ORG,key:'pl_items',value:DB.plItems});
    if(cur.co!==kvSaved.co&&DB.co)sets.push({org:ORG,key:'co',value:DB.co});
    if(recv.length){const {error}=await sb.from('receipts').upsert(recv); if(error)throw error; kvSaved.recv=cur.recv;}
    if(paid.length){const {error}=await sb.from('payments').upsert(paid); if(error)throw error; kvSaved.paid=cur.paid;}
    if(off.length){const {error}=await sb.from('days_off').upsert(off); if(error)throw error; kvSaved.off=cur.off;}
    if(sets.length){const {error}=await sb.from('settings').upsert(sets); if(error)throw error; kvSaved.skip=cur.skip; kvSaved.basis=cur.basis; kvSaved.pl=cur.pl; kvSaved.co=cur.co;}
    dbState='保存した '+new Date().toTimeString().slice(0,5);
  }catch(e){
    dbDirty=true; dbState='保存できていない：'+String((e&&e.message)||e); alog('save ERR',(e&&e.message)||e);
    const em=String((e&&e.message)||e);
    toast(/JWT|permission denied|not authenticated|401/i.test(em)?'保存できなかった。ログインが切れている可能性があります。ページを再読み込みしてログインし直してください（'+em+'）'
      :'保存に失敗した（'+em+'）。もう一度操作するか、再読み込みしてください');
  }finally{ dbBusy=false; }
  const el=document.getElementById('dbState'); if(el)el.textContent=dbState;
}

/* ---- 他の人の変更を受け取る ---- */
let rtChan=null;
/* 自分が送った行・消した行（Realtime で戻ってくる反射を、他の人の変更と区別する） */
let sentRows={}, ownDel={};
function isOwnEcho(t,k,rec){
  const sent=sentRows[k]; if(!sent)return false;
  const got=recToRow(t,rec);
  return Object.keys(sent).every(c=>{ const a=sent[c], b=got[c]; return String(a==null?'':a)===String(b==null?'':b); });
}
/* 他の人（と職人・業者ページ）の変更の記録。「元に戻す」は画面全体を控えに戻すので、
   そのままだと控えを取った後に入った他の人の追加・変更まで消してしまう。戻したあとにこれを掛け直す */
let remoteLog=[], remoteSeq=0;
function logRemote(e){ if(!undoStack.length){ remoteLog.length=0; return; } e.seq=++remoteSeq; remoteLog.push(e); if(remoteLog.length>3000)remoteLog.splice(0,remoteLog.length-3000); }
function remoteCanReplay(seq){ return !remoteLog.length || remoteLog[0].seq<=(seq||0)+1; }
function remoteReplay(seq){
  remoteLog.forEach(e=>{ if(e.seq<=(seq||0))return; const arr=DB[e.t]; if(!arr)return;
    const id=e.del||e.rec.id, i=arr.findIndex(r=>r.id===id);
    if(e.del){ if(i>=0)arr.splice(i,1); return; }
    const rec=JSON.parse(JSON.stringify(e.rec));
    if(i>=0)arr[i]=rec; else if(e.t==='cases')arr.unshift(rec); else arr.push(rec); });
}
function dbSubscribe(){
  if(!sb||rtChan)return;
  rtChan=sb.channel('ledger');
  Object.keys(COLS).forEach(t=>{
    rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},payload=>{
      const arr=DB[t]||[];
      if(payload.eventType==='DELETE'){ const id=payload.old&&payload.old.id; if(!id)return; const dk=t+':'+id;
        const mine=ownDel[dk]&&Date.now()-ownDel[dk]<60000; delete ownDel[dk];
        const i=arr.findIndex(r=>r.id===id);
        if(mine&&i<0)return;                           /* 自分が消した行の反射 */
        logRemote({t,del:id});
        if(i>=0){arr.splice(i,1); delete recLast[dk]; renderIdle();} return; }
      const rec=rowToRec(t,payload.new); const k=t+':'+rec.id, sg=sig(rec);
      if(recLast[k]===sg)return;                       /* 自分の書き込みの反射 */
      const i=arr.findIndex(r=>r.id===rec.id);
      if(i>=0&&isOwnEcho(t,k,rec)){                    /* 自分の書き込みの反射（DB が足した項目だけ受け取る。token など） */
        const l=arr[i]; let added=false; Object.keys(rec).forEach(x=>{ if(l[x]===undefined){ l[x]=rec[x]; added=true; } });
        ['vendor_id','client_id','seen_at','first_seen_at','token'].forEach(x=>{ if(rec[x]!==undefined&&l[x]!==rec[x])l[x]=rec[x]; });   /* 番号は DB が名前から埋める。画面は書かないので、いつも DB の値を受け取る */
        delete sentRows[k]; if(recLast[k]!==undefined)recLast[k]=sig(l); if(added)renderIdle(); return; }
      logRemote({t,rec:JSON.parse(JSON.stringify(rec))});
      if(i>=0){ const l=arr[i]; Object.keys(l).forEach(x=>delete l[x]); Object.assign(l,rec); } else { if(t==='cases')arr.unshift(rec); else arr.push(rec); }
      recLast[k]=sg;
      if(t==='orders'&&typeof onOrderRemote==='function'){ try{ onOrderRemote(arr.find(r=>r.id===rec.id)); }catch(e){ alog('onOrderRemote',e&&e.message); } }
      renderIdle();
    });
  });
  rtChan.subscribe(st=>{ alog('realtime',st);
    if(st==='SUBSCRIBED'){ if(rtDown)dbResync('つなぎ直し'); rtDown=false; }
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')rtDown=true; });
}
/* ---- 取り直し：Realtime が切れていた間（スリープ・回線切れ）の他の人・業者の変更を受け取る ----
   これが無いと、切れていた間の変更を知らないまま行を直したとき、行ごと古い値で上書きしてしまう（承諾・完了が元に戻る）。
   手元で直してまだ保存していない行は触らない。手元で消してまだ保存していない行は戻さない。 */
let rtDown=false, resyncBusy=false, hiddenAt=0;
async function dbResync(why){
  if(!sb||!ME||resyncBusy)return;
  if(dbBusy||dbDirty){ setTimeout(()=>dbResync(why),1500); return; }
  resyncBusy=true;
  try{
    const ts=Object.keys(COLS), got=await Promise.all(ts.map(t=>fetchAll(t).catch(()=>null)));
    /* 業者が通知を設定した・外した台数も合わせる */
    try{ const pr=await fetchAll('vendor_push','vendor_id'); DB.pushN={}; pr.forEach(r=>{ DB.pushN[r.vendor_id]=(DB.pushN[r.vendor_id]||0)+1; }); }catch(e){}
    const same=(t,a,b)=>JSON.stringify(recToRow(t,a))===JSON.stringify(recToRow(t,b));
    let n=0;
    ts.forEach((t,ix)=>{ const rows=got[ix]; if(!rows)return; const arr=DB[t]||(DB[t]=[]), seen=new Set();
      rows.forEach(row=>{ const rec=rowToRec(t,row), k=t+':'+rec.id; seen.add(rec.id);
        const i=arr.findIndex(r=>r.id===rec.id);
        if(i<0){ if(recLast[k]!==undefined)return;                       /* 手元で消して、まだ保存していない */
          logRemote({t,rec:JSON.parse(JSON.stringify(rec))}); if(t==='cases')arr.unshift(rec); else arr.push(rec); recLast[k]=sig(rec); n++; return; }
        const l=arr[i];
        if(recLast[k]===undefined||sig(l)!==recLast[k])return;           /* 手元で作った・直した行で、まだ保存していない */
        if(same(t,l,rec)){   /* 画面が書かない項目（DB が入れる番号・業者ページを開いた日時・リンク）だけ変わっていることがある */
          let ch=false; ['vendor_id','client_id','seen_at','first_seen_at','token'].forEach(x=>{ if(rec[x]!==undefined&&l[x]!==rec[x]){ l[x]=rec[x]; ch=true; } });
          if(ch){ recLast[k]=sig(l); n++; } return; }
        logRemote({t,rec:JSON.parse(JSON.stringify(rec))});
        Object.keys(l).forEach(x=>delete l[x]); Object.assign(l,rec); recLast[k]=sig(l); n++;
        if(t==='orders'&&typeof onOrderRemote==='function'){ try{ onOrderRemote(l); }catch(e){} } });
      for(let i=arr.length-1;i>=0;i--){ const r=arr[i], k=t+':'+r.id;     /* 向こうで消えた行 */
        if(!r.id||seen.has(r.id)||recLast[k]===undefined||sig(r)!==recLast[k])continue;
        logRemote({t,del:r.id}); arr.splice(i,1); delete recLast[k]; n++; } });
    alog('resync',why+' '+n);
    if(n){ M.senzoku.length=0; DB.vendors.filter(v=>v.type==='専属').forEach(v=>M.senzoku.push(v.name)); renderIdle(); }
  }catch(e){ alog('resync ERR',(e&&e.message)||e); }
  finally{ resyncBusy=false; }
}

async function initAuth(){
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession(); SESSION=session;
  /* この中から supabase を直接呼ばない。auth の内部ロックを持ったまま呼ぶことになり、トークン更新と重なって詰まる。
     必ず setTimeout で外に出してから処理する */
  sb.auth.onAuthStateChange((ev,s)=>{ setTimeout(()=>onAuth(ev,s),0); });
  if(SESSION)await boot(); else render();
}
function onAuth(ev,s){
  const had=!!SESSION; SESSION=s;
  if(!s){ if(denied){ dbState=denied; denied=''; render(); return; }
    if(had||ME){ ME=null; dbState='ログインが切れました。もう一度ログインしてください'; alog('auth',ev+' signed out'); render(); } return; }
  if(ev==='TOKEN_REFRESHED')checkClock(s);
  if(!ME)boot();
}
/* 取り立てのトークンの残り時間が有効期間と大きく違う＝この端末の時計がずれている。
   ずれているとトークンが「もう切れた」と判定され続け、更新が繰り返されてログインが切れる */
let clockWarned=false;
function checkClock(s){
  if(clockWarned||!s||!s.expires_at||!s.expires_in)return;
  const left=s.expires_at-Date.now()/1000;
  if(Math.abs(left-s.expires_in)>180){ clockWarned=true; alog('clock','left='+Math.round(left)+' expires_in='+s.expires_in);
    toast('この端末の時計がずれているようです。ログインが切れやすくなるので、日付と時刻の自動設定を確かめてください'); }
}
/* 読み込みは同時に1本だけ。以前はログイン直後の通知（INITIAL_SESSION・SIGNED_IN・TOKEN_REFRESHED）ごとに
   読み込みが重ねて走り、そのたびにトークン更新が起きて、更新の回数制限に当たってログインが切れていた */
let bootP=null, bootFails=0, denied='';
function boot(){ if(!bootP)bootP=boot1().finally(()=>{ bootP=null; }); return bootP; }
async function boot1(){
  if(!SESSION||ME)return;
  if(bootFails>=3)return;     /* 続けて失敗したら自動では繰り返さない（再読み込みでやり直す） */
  try{
    let {data:me}=await sb.from('profiles').select('*').eq('id',SESSION.user.id).maybeSingle();
    if(!me){   /* 初回ログインの後で登録された人：登録（role_presets）があれば、ここで利用者として作る */
      try{ await sb.rpc('ensure_profile'); const r=await sb.from('profiles').select('*').eq('id',SESSION.user.id).maybeSingle(); me=r.data; }catch(e){ alog('ensure_profile',(e&&e.message)||e); } }
    if(!me||['hq','staff','viewer'].indexOf(me.role)<0){   /* 登録の無いメールアドレス：何も読み込まない */
      denied='このメールアドレスは台帳に登録されていません。管理者に登録を頼んでください（'+((SESSION.user&&SESSION.user.email)||'')+'）';
      alog('auth','not registered'); dbState=denied; toast(denied); try{ await sb.auth.signOut(); }catch(e){} SESSION=null; ME=null; dbState=denied; render(); return; }
    ME=me; ORG=ME.org||'hq';
    await dbLoad(); dbSubscribe(); bootFails=0; render();
    await reloadInbox();
  }catch(e){ bootFails++; ME=null; dbState='読み込めなかった：'+String((e&&e.message)||e)+'。ページを再読み込みしてください'; alog('boot ERR',(e&&e.message)||e); toast(dbState); render(); }
}

/* ================= 検証 ================= */
function issues(){
  const out=[]; const B=byId(); const seen={};
  DB.cases.forEach(c=>{
    const cost=costOf(c.id), sales=salesEx(c), ps=procsOf(c.id);
    if(!sales&&c.live&&stIdx(c.st)>=stIdx('受注')){ const ss=Math.round(linesOf(c.id).reduce((a,l)=>a+lineSell(l),0));
      if(ss>0) out.push({k:'売上なし',c:c.id,t:`${c.prop}`,d:`明細の販売の合計は ${yen(ss)} あるのに、受注額が未入力。請求・月次が ¥0 になる`}); }
    ps.forEach(p=>{ const o=p.order?(DB.orders||[]).find(x=>x.id===p.order):null;
      if(o&&o.who&&p.who!==o.who) out.push({k:'発注先のずれ',c:c.id,t:`${c.prop}`,d:`発注書 ${o.no} は ${o.who} 宛てなのに、工程の業者は ${p.who||'未定'}。発注を取り消して作り直す`}); });
    if(sales>0&&cost===0) out.push({k:'原価なし',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} に対して発注が1件も入っていない。粗利が過大に出る`});
    if(sales>0&&cost>sales) out.push({k:'赤字',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} ＜ 原価 ${yen(cost)}（${yen(cost-sales)} の持ち出し）`});
    if(sales>0&&!c.bill) out.push({k:'請求月なし',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} が請求一覧に出てこない`});
    if(!c.done&&(c.bill||salesOf(c)>0)) out.push({k:'完工日なし',c:c.id,t:`${c.prop}`,
      d:'完工基準にしたので、完工日が入らないと売上がどの月にも乗らない'});
    if(c.client&&!isClient(c.client)) out.push({k:'顧客マスタ外',c:c.id,t:`${c.prop}`,d:`「${c.client}」は顧客マスタに無い`});
    if(c.want&&c.plan&&c.plan>c.want&&!c.done) out.push({k:'希望日に遅れる',c:c.id,t:`${c.prop}`,
      d:`依頼元の希望 ${md(c.want)} に対して、弊社の完了予定が ${md(c.plan)}`});
    if(c.live&&(c.ord||'未')==='未'&&!c.want) out.push({k:'希望日なし',c:c.id,t:`${c.prop}`,
      d:'依頼元の完了希望日が入っていない。工程を組む順番が決められない'});
    if(c.keyx==='有'&&!procsOf(c.id).some(p=>p.kind==='鍵交換')&&!c.done)
      out.push({k:'鍵交換の手配なし',c:c.id,t:`${c.prop}`,
        d:'発注書に鍵交換の記載があるのに、鍵交換の工程が入っていない'});
    if(c.done&&(c.done<'2020-01-01'||c.done>'2030-01-01'))
      out.push({k:'完工日が壊れている',c:c.id,t:`${c.prop}`,d:`完工日が「${c.done}」。手入力のミスがそのまま残っている`});

    ps.forEach(p=>{
      if(p.who&&!isVendor(p.who)) out.push({k:'発注先マスタ外',c:c.id,t:`${c.prop}`,d:`「${p.who}」は発注先マスタに無い。支払一覧・支払通知書に出ない`});
      if(p.who&&!p.date) out.push({k:'予定日なし',c:c.id,t:`${c.prop}`,d:`${p.who} の${p.kind}に予定日が入っていない`});
      if(p.who&&!p.amt&&!isStaffJob(p.kind)) out.push({k:'金額なし',c:c.id,t:`${c.prop}`,d:`${p.who} の${p.kind}に発注金額が入っていない`});
    });
    const k=ps.filter(p=>isSeko(p.kind)&&p.date), s=ps.filter(p=>p.kind==='清掃'&&p.date);
    const v=ps.filter(p=>isInsp(p.kind)&&p.date);
    if(k.length&&s.length){
      const lk=k.map(endOf).sort().pop(), fs=s.map(p=>p.date).sort()[0];
      if(fs<lk) out.push({k:'順序',c:c.id,t:`${c.prop}`,d:`清掃 ${md(fs)} が工事 ${md(lk)} より前（先行清掃なら正常）`});
    }
    if(s.length&&v.length){
      const ls=s.map(endOf).sort().pop(), fv=v.map(p=>p.date).sort()[0];
      if(fv<ls) out.push({k:'順序',c:c.id,t:`${c.prop}`,d:`AW検査 ${md(fv)} が清掃 ${md(ls)} より前`});
    }
    ps.forEach(p=>{ if(p.kind&&PKINDS.indexOf(p.kind)<0)
      out.push({k:'区分が旧のまま',c:c.id,t:`${c.prop}`,d:`「${p.kind}」は旧区分。内装／水道設備／電気設備／リペア補修 のどれかに直す`}); });
    const key=(c.prop||'').replace(/[\s　・（）()]/g,'').toLowerCase();
    if(key){ if(seen[key]) out.push({k:'物件名重複',c:c.id,t:`${c.prop}`,d:`同じ物件名の案件が他にもある（${seen[key]}）。二重計上でないか確認`}); else seen[key]=c.id; }
  });
  // 休みの日に手配が入っている（10月のみ休みデータあり）
  DB.procs.forEach(p=>{
    if(!p.who||!p.date)return;
    const hit=spanDays(p).find(d=>isOff(p.who,d));
    if(hit)
      out.push({k:'休みに手配',c:p.case,t:`${p.who} ${md(hit)}`,
        d:`スケジュール管理では休みの日に、台帳では ${(B[p.case]||{}).prop||'現場'} の${p.kind}が入っている`});
  });
  // 同一職人が同日2現場
  const slot={};
  DB.procs.forEach(p=>{ if(!p.who||!p.date||SEN.indexOf(p.who)<0||isStaffJob(p.kind))return;
    spanDays(p).forEach(d=>{const k=p.who+'|'+d; (slot[k]=slot[k]||[]).push(p);}); });
  Object.entries(slot).forEach(([k,ps])=>{ if(ps.length<2)return;
    const [who,d]=k.split('|');
    if(new Set(ps.map(p=>p.case)).size<2)return;
    out.push({k:'1日2現場',c:ps[0].case,t:`${who} ${md(d)}`,d:ps.map(p=>(B[p.case]||{}).prop).join(' ／ ')});
  });
  (DB.reports||[]).filter(r=>r.st==='報告済').forEach(r=>{ const p=DB.procs.find(x=>x.id===r.proc)||{};
    out.push({k:'完了報告の確認待ち',c:r.case,t:`${(B[r.case]||{}).prop||''}`,d:`${r.who} の${p.kind||'工程'}（完了 ${md(r.done)}）。支払タブで承認か差し戻し`}); });
  return out;
}

/* ================= 受注受付の取り込み =================
   叩き台「受注受付」の行を、Claudeの定期タスクが inbox に書く。
   この画面は inbox を読んで、まだ台帳に無い分だけ案件にする。 */
let INBOX=null, inboxMsg='', PRICEIN=[];
async function openInbox(){ /* v4：ログイン後に boot() が呼ぶ */ }
async function reloadInbox(){
  if(!sb||!SESSION)return;
  try{
    const rows=await fetchAll('inbox');
    INBOX=rows.map(r=>({_id:r.key,key:r.key,caseNo:r.case_no,client:r.client,orderNo:r.order_no,prop:r.prop,room:r.room,propCode:r.prop_code,
      recvDate:r.recv_date||'',net:r.net,tax:r.tax,gross:r.gross,estimate:r.estimate,plan:r.plan||'',moveIn:r.move_in||'',cancel:r.cancel||'',
      memo:r.memo,items:r.items,url:r.url,poLines:r.po_lines||undefined}));
    inboxMsg='';
    try{ autoMergeInbox(); }catch(e){}
  }catch(e){ INBOX=[]; inboxMsg='受注受付を読めなかった：'+String((e&&e.message)||e); }
  render();
}
const nkey=s=>{let t=String(s||''); try{t=t.normalize('NFKC');}catch(e){} return t.replace(/[\s　・（）()＜＞<>　＿_-]/g,'').toLowerCase();};   /* 全角英数も半角に寄せて比べる */
function inboxKind(t){
  const s=String(t||'');
  if(/鍵交換|シリンダー/.test(s))return '鍵交換';
  if(/入居中/.test(s))return '入居中修繕';
  for(const k of ['内装','水道設備','電気設備','リペア補修'])
    if((KIND_RULES.find(r=>r[0]===k)||[])[1].test(s))return '工事一式';
  if(/清掃|クリーニング|洗浄/.test(s))return '清掃のみ';
  return 'その他';
}
function pendingInbox(){
  if(!INBOX)return [];
  return INBOX.filter(r=>r.key&&!(DB.skip&&DB.skip[r.key])&&!DB.cases.some(c=>c.recv===r.key));
}
/* 見送り＝取り込んだ案件を削除した受注受付。未取り込みに数えない。「戻す」で未取り込みに戻る */
function skippedInbox(){
  if(!INBOX||!DB.skip)return [];
  return INBOX.filter(r=>r.key&&DB.skip[r.key]&&!DB.cases.some(c=>c.recv===r.key));
}
function unskipInbox(){
  const n=skippedInbox().length; if(!n)return;
  snap(); DB.skip={}; save(); render(); toast(`見送り ${n}件を未取り込みに戻した`, undo);
}

/* 単価表のうち、まだマスタに入っていないもの */
function pendingPrices(){
  if(!PRICEIN)return [];
  return PRICEIN.filter(r=>!DB.prices.some(p=>priceKey(p.name)===priceKey(r.name)
    &&(p.unit||'式')===(r.unit||'式')&&(p.client||'')===(r.client||'')));
}
function importPrices(){

  snap();
  rows.forEach(r=>{DB.prseq++;
    DB.prices.push({id:'PR'+DB.prseq+DEV,name:r.name,kind:r.kind||guessKind(r.name),unit:r.unit||'式',
      price:+r.price||0,who:r.who||'',client:r.client||'',memo:r.memo||''});});

  toast(`単価表から ${rows.length}件 取り込んだ${z?`（うち${z}件は単価未設定）`:''}`, undo);
}
/* 受注受付1行の情報を既存案件に流し込む。空欄だけ埋める（手で直した値は守る） */
const inboxProp=r=>[r.prop||'',r.room||''].filter(Boolean).join(' ').trim();
const inboxMemo=r=>[r.memo||'', r.moveIn?('次回入居 '+r.moveIn):'', r.items?('削除/追加 '+r.items):''].filter(Boolean).join(' / ');
function mergeInboxRow(r,c){
  const memo=inboxMemo(r);
  c.recv=r.key; c.live=true;
  if(!c.client&&r.client)c.client=r.client;
  if(!c.sales&&+r.net)c.sales=+r.net;
  if(!c.want&&r.plan)c.want=r.plan;
  if(!c.kisan&&r.moveIn)c.kisan=r.moveIn;   /* 次回入居日＝家賃の起算。財託は空で入ってくる */
  if(/鍵交換/.test(memo))c.keyx='有';
  if(/設備保証/.test(memo))c.warr='有';
  if(!c.bill&&r.recvDate)c.bill=r.recvDate.slice(0,7)+'-01';
  if(memo&&(c.memo||'').indexOf(memo)<0)c.memo=[c.memo||'',memo].filter(Boolean).join(' / ');
  c.items=r.items||c.items||'';
}
/* 合流先の候補。過去の完工済みには合流させない（同じ部屋の2回目が前回に吸われるのを防ぐ） */
function inboxMatch(r,exactOnly){
  const byRecv=DB.cases.find(x=>x.recv===r.key); if(byRecv)return byRecv;
  const key=nkey(inboxProp(r))||nkey(r.prop); if(!key)return null;
  const cand=DB.cases.filter(x=>x.live&&!x.done&&!x.recv);
  return cand.find(x=>nkey(x.prop)===key)
      ||(exactOnly?null:cand.find(x=>{const k=nkey(x.prop); return k&&k.length>=4&&(k.indexOf(key)>=0||key.indexOf(k)>=0);}))
      ||null;
}
/* 起動時：物件名がぴったり一致する運用中の案件には自動で合流する。新規作成は人がボタンで */
/* 依頼元の明細が二重に入っている案件を直す（以前の版の同期の穴で、入れ直した分が積み上がったもの）。
   依頼元の行数より多ければ、いちばん新しい取り込み（id の番号が大きい方）だけ残して、残りに墓標を立てる */
function healPO(cid){
  const want=poRowsOf(cid).length; if(!want)return 0;
  const rows=poLinesOf(cid).filter(l=>!l.order); if(rows.length<=want)return 0;
  const keep=new Set(rows.slice().sort((a,b)=>lnum(b.id)-lnum(a.id)||String(b.id).localeCompare(String(a.id))).slice(0,want).map(l=>l.id));
  const drop=rows.filter(l=>!keep.has(l.id)); if(!drop.length)return 0;
  DB.lines=DB.lines.filter(l=>keep.has(l.id)||!(l.case===cid&&l.src==='PO'&&!l.order));
  purgeShared('lines',drop.map(l=>l.id));
  return drop.length;
}
function healAllPO(){
  let n=0, cs=0; DB.cases.forEach(c=>{ if(!c.recv)return; const d=healPO(c.id); if(d){n+=d;cs++;} });
  if(n){ save(); toast(`二重に入っていた依頼元の明細 ${n}行（${cs}案件）を片づけた`); }
  return n;
}
function autoMergeInbox(){
  healAllPO();
  const rows=pendingInbox().filter(r=>inboxMatch(r,true));
  if(!rows.length)return 0;
  snap();
  rows.forEach(r=>mergeInboxRow(r,inboxMatch(r,true)));
  save();
  toast(`受注受付 ${rows.length}件を、同じ物件名の案件に自動で合流させた（金額・起算日・希望日・明細）`, undo);
  return rows.length;
}
function importInbox(){
  const rows=pendingInbox(); if(!rows.length){toast('新しい行は無い');return;}
  snap();
  let add=0, mrg=0;
  rows.forEach(r=>{
    const prop=inboxProp(r);
    const memo=inboxMemo(r);
    let c=inboxMatch(r,false);
    if(c){
      mergeInboxRow(r,c);
      mrg++;
    }else{
      DB.seq++;
      DB.cases.unshift({id:'R'+DB.seq+DEV,client:r.client||'',prop:prop||'（物件未入力）',
        kind:inboxKind((r.items||'')+' '+(r.memo||'')),st:'受注',ord:'未',live:true,
        src:'受注受付',recv:r.key,caseNo:r.caseNo||'',
        sales:+r.net||0,add:0,bill:r.recvDate?r.recvDate.slice(0,7)+'-01':'',
        kisan:r.moveIn||'',want:r.plan||'',plan:'',done:'',
        keyx:/鍵交換/.test(memo)?'有':'',warr:/設備保証/.test(memo)?'有':'',
        report:'',photo:'',memo,items:r.items||''});
      add++;
    }
  });
  save(); render();
  toast(`受注受付から ${add}件を新規、${mrg}件を既存に合流させた`, undo);
}
function inboxBanner(){
  if(tab!=='ledger'&&tab!=='order')return '';
  const p=pendingInbox();
  let msg, sty='margin:12px 0 0', btn='', sub='';
  if(inboxMsg){ msg=inboxMsg; sty+=';background:var(--warn-bg);border-color:var(--warn)'; }
  else if(INBOX===null){ if(tab==='order')return ''; msg='受注受付を確認中…'; sty+=';background:var(--card2);border-color:var(--line)'; }
  else if(!p.length){ if(tab==='order'&&!skippedInbox().length)return '';   /* 発注画面では、取り込むものが無ければ帯ごと出さない（明細を広く見せる） */
    msg=`受注受付 ${INBOX.length}件：未取り込みなし`; sty+=';background:var(--card2);border-color:var(--line)'; }
  else{

    sub=`<span class="grow note" style="margin:0">${esc(p.slice(0,3).map(r=>[r.client,r.prop,r.room].filter(Boolean).join(' ')).join('／'))}${p.length>3?' ほか':''}</span>`;
    btn='<button class="btn small primary" id="impInbox">取り込む</button>';
  }
  const sk=skippedInbox().length;
  return `<div class="selbar" style="${sty}"><b>${esc(msg)}</b>${sub||'<span class="grow"></span>'}${btn}
    ${sk?`<span class="note" style="margin:0" title="取り込んだあと案件を削除した受注受付。未取り込みには数えない">見送り ${sk}件</span><button class="btn small" id="unskipInbox">戻す</button>`:''}
    <button class="btn small" id="reloadInbox">読み直す</button></div>`;

/* ================= 発注 =================
   業者の見積を原価明細に落とす → 行を選んで業者ごとに発注する。
   コンクルーとの違い：見積フェーズなし／列は半分／工事内容は明細から自動 */
const OSTS=['下書き','送付済','承諾','完了','請求済'];
const OLSORTS=['工期が近い順','起算日が近い順','完了希望日が近い順','発注日が早い順','発注No順'];
const OSTC={'下書き':'','送付済':'wip','承諾':'wip','完了':'done','請求済':'done'};
const UNITS=['式','m','㎡','枚','個','箇所','台','本','日','人工'];
const costQty=l=>(l.cqty===''||l.cqty==null)?(+l.qty||0):(+l.cqty||0);   /* 原価の数量。空なら販売の数量と同じ */
const costUnit=l=>l.cunit||l.unit||'式';
const lineAmt=l=>Math.round(costQty(l)*(+l.price||0));   /* 原価（業者に払う）＝原価の数量×原価単価 */
const lineSell=l=>Math.round((+l.qty||0)*(+l.sell||0));   /* 販売（依頼元からもらう） */
const lnum=id=>{const m=/^L(\d+)/.exec(String(id||'')); return m?+m[1]:0;};

    const its=tc.items.filter(i=>String(i.str).trim()).map(i=>({x:i.transform[4],y:i.transform[5],w:i.width||0,h:i.height||Math.abs(i.transform[3])||10,t:String(i.str).trim()}));

function docTotal(rows){

    const k=/小\s*計|税\s*抜|税\s*別/.test(tx)?'sub':/消\s*費\s*税/.test(tx)?'tax':/税\s*込|合\s*計|総\s*額|御?請求金?額/.test(tx)?'total':''; if(!k||t[k]!=null)return;

/* 書類の上の方に書いてある案件の情報：住所・鍵の場所・間取り・日付。ラベル（物件所在地：など）の右の文字を読む */

  const a=DB.lines.find(x=>x.id===id), t=DB.lines.find(x=>x.id===tid); if(!a||!t||a===t||a.case!==t.case)return;

async function createOrder(cid,ids,f,quiet){
  const c=DB.cases.find(x=>x.id===cid);
  if(!quiet)snap();
  const n=await allocOrderNo();
  const oid='O'+n+DEV, no='AW-H'+String(n).padStart(4,'0');
  const amt=DB.lines.filter(l=>ids.indexOf(l.id)>=0).reduce((a,l)=>a+lineAmt(l),0);
  DB.orders.push({id:oid,no,case:cid,who:f.who,kind:f.kind,start:f.start,end:f.end,due:f.due,taxable:vendorTaxable(f.who),
    naiyo:f.naiyo,memo:f.memo!=null?f.memo:tplDefault(cid,f.kind),st:'下書き',sent:'',
    token:Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join(''),   /* 発注書のリンク。作ってすぐ送れるように画面で作る */
    name:`${c?c.prop||'':''} ${f.kind}_${f.who||'業者未定'}`.trim()});
  DB.lines.forEach(l=>{ if(ids.indexOf(l.id)>=0){l.order=oid;l.who=f.who;l.kind=f.kind;} });
  /* 「工程を組む」で作った工程があればそれに紐づける（期間を直していればそちらを正にする）。無ければ新しく1本作る */
  const p=f.proc?DB.procs.find(x=>x.id===f.proc&&x.case===cid&&!x.order):null;
  if(p){ p.order=oid; p.who=f.who; p.kind=f.kind; p.date=f.start; p.end=f.end; p.amt=Math.round(amt); }
  else { DB.pseq++;
    DB.procs.push({id:'Q'+DB.pseq+DEV,case:cid,kind:f.kind,who:f.who,date:f.start,end:f.end,
      amt:Math.round(amt),month:'',prog:'',order:oid,auto:1}); }
  recalcPlan(c);
  oSel={}; if(quiet)return; save(); render();
  toast(p?`${no} を作って、工程（${f.kind}／${f.who||'業者未定'}）に紐づけた`
         :`${no} を作った。工程も1本できた（${f.kind}／${f.who||'業者未定'}）`, undo);
  orderSheet(oid);   /* 作ったらすぐ発注書を見せる。まだ下書き：業者ページには出ない */
}
/* 完了予定日＝最後の工程の日。工程が1本も無ければ今の値を残す。完工済みは触らない */
function recalcPlan(c){
  if(!c||c.done||c.planManual)return;   /* 手で入れた完了予定は工程で上書きしない */
  const d=lastDayOf(procsOf(c.id)); if(d)c.plan=d;
}
/* 発注に載っている明細の合計（税抜）を、その発注の工程の発注金額に入れ直す。原価＝工程の発注金額の合計なので、明細を直すと原価も変わる */
const approvedExtra=pid=>(DB.reports||[]).filter(r=>r.proc===pid&&r.st==='承認').reduce((a,r)=>a+(+r.extra||0),0);
function syncOrderAmt(oid){
  const amt=Math.round(DB.lines.filter(l=>l.order===oid).reduce((a,l)=>a+lineAmt(l),0));
  /* 承認済みの完了報告の追加金額は、発注金額に足したまま残す（明細を直しても消さない） */
  DB.procs.filter(p=>p.order===oid).forEach(p=>{ p.amt=amt+approvedExtra(p.id); });
}
/* 発注の送付で '済' にした案件は、送付済以上の発注が1つも無くなったら '未' に戻す。手で '済' にしたものは触らない */
function recalcOrd(c){
  if(!c||c.ordBy!=='order')return;
  const live=DB.orders.some(o=>o.case===c.id&&OSTS.indexOf(o.st)>=OSTS.indexOf('送付済'));
  if(!live){c.ord='未'; delete c.ordBy;}
}
/* 発注が送付済以上になったら、案件側も「発注 済」「発注書送付」に揃える。変えたら true */
function markOrdered(o){
  if(OSTS.indexOf(o.st)<OSTS.indexOf('送付済'))return false;
  const c=DB.cases.find(x=>x.id===o.case); if(!c)return false;
  let ch=false;
  if(c.ord!=='済'){ c.ordBy='order'; c.ord='済'; ch=true; }
  if(STATUS.indexOf(c.st)<STATUS.indexOf('発注書送付')){ c.st='発注書送付'; ch=true; }
  return ch;
}
/* seen＝ボタンを押した時に画面に出ていた状態。業者の承諾などで裏で状態が変わっていたら、進めずに画面を更新して知らせる
   （古い表示のまま「送る」を押して、承諾済みの発注が「完了」になるのを防ぐ） */
function nextOrderSt(oid,seen){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  if(seen&&o.st!==seen){ render(); toast(`${o.no} は「${o.st}」に変わっていた。画面を更新したので、もう一度確かめてから押してください`); return; }
  const i=OSTS.indexOf(o.st); if(i<0||i>=OSTS.length-1)return;
  snap(); o.st=OSTS[i+1];
  if(o.st==='送付済') o.sent=fmtD(new Date());
  markOrdered(o);
  save(); render(); toast(`${o.no} を ${o.st} にした`, undo);
  if(o.st==='送付済')tellVendor(o);
}
/* 発注したら、業者に知らせる（携帯の通知・メール）。どちらも届かない業者は、リンクをコピーして知らせるよう案内する */
const vReach=v=>{ const n=v&&v.id?((DB.pushN||{})[v.id]||0):0; return {n,mail:!!(v&&v.email)}; };
const vReachLabel=v=>{ const r=vReach(v); return `携帯の通知 ${r.n?'設定済み（'+r.n+'台）':'未設定'}・メール ${r.mail?'登録あり':'未登録'}`; };
function tellVendor(o){
  if(typeof notifyOrder!=='function')return;
  notifyOrder(o.id).then(r=>{ if(!r||!r.ok)return; const got=[]; if(r.push)got.push(`携帯の通知（${r.push}台）`); if(r.mail==='sent')got.push('メール');
    toast(got.length?`${o.no}：${o.who} さんに ${got.join('・')} で知らせた`:`${o.no}：${o.who} さんは携帯の通知もメールも未設定。「リンクをコピー」で知らせてください`); if(tab==='order'||tab==='case')renderIdle(); });
}
function orderNotifyNote(o){
  const l=(DB.nlog||[]).filter(x=>x.order_id===o.id&&x.ok).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  if(!l.length)return ''; const d=new Date(l[0].at), at=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const ks=[...new Set(l.filter(x=>String(x.at).slice(0,16)===String(l[0].at).slice(0,16)).map(x=>x.kind==='push'?'携帯の通知':'メール'))];
  return `${at} に ${ks.join('・')} で知らせた`;
}
/* 他の端末・業者ページから発注の状態が変わった時（store4.js の Realtime から呼ばれる）。
   送付前のリンクで業者が承諾した場合も、案件側の「発注」を済にする */
function onOrderRemote(o){ if(markOrdered(o)) save(); }
/* 承諾済みの発注書の中身（明細）を変えたとき：業者が承諾したのは前の内容なので、承諾を取り消して「送付済」に戻す。
   承諾の日時は DB が消す（orders の st が 送付済 に戻ったとき）。業者にはもう一度承諾してもらう */
function unacceptOrder(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o||o.st!=='承諾')return false;
  o.st='送付済'; setTimeout(()=>toast(`${o.no} の中身を変えたので、${o.who||'業者'} さんの承諾を取り消した（送付済に戻した）。変えた内容を伝えて、もう一度承諾してもらってください`),50); return true;
}
function delOrder(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  /* 取り消しの歯止め：完了報告が出ている発注は取り消せない。送ったあとの発注は、確かめてから */
  const pids=DB.procs.filter(p=>p.order===oid).map(p=>p.id), reps=(DB.reports||[]).filter(r=>pids.indexOf(r.proc)>=0);
  if(reps.length||o.st==='完了'||o.st==='請求済'){ toast(`${o.no} は取り消せない：${reps.length?'完了報告が出ている':'状態が「'+o.st+'」になっている'}。取り消すと、報告と支払いの記録が宙に浮く`); return; }
  if(!confirm(o.st==='下書き'?`${o.no}（${o.who||'業者未定'}）を取り消しますか？\n明細は未発注に戻ります。`
    :`${o.no} は ${o.who||'業者'} さんに送ってあります（${o.st}）。\n取り消すと、業者ページからこの発注書が消えます。${o.st==='承諾'?'\n承諾済みです。':''}取り消したことを業者に伝えてください。\n\n取り消しますか？`))return;
  snap();
  DB.lines.forEach(l=>{ if(l.order===oid)l.order=''; });
  let kept=0;
  DB.procs=DB.procs.filter(p=>{ if(p.order!==oid)return true; if(p.auto)return false; p.order=''; p.amt=0; kept++; return true; });   /* 残す工程の発注金額は消す（明細が未発注に戻るので、二重に数えない） */
  DB.orders=DB.orders.filter(x=>x.id!==oid);
  const c=DB.cases.find(x=>x.id===o.case); recalcOrd(c); recalcPlan(c);
  save(); render(); toast(`${o.no} を取り消した（明細は未発注に戻した${kept?'。工程を組むで作った工程は残してある':''}）`, undo);
}
function payTerm(v){
  if(!v||!v.close)return '月末締め・翌月末払い';
  const c=(+v.close>=28)?'末日':v.close+'日', s=(+v.site>=28||!v.site)?'末日':v.site+'日';
  return `毎月${c}締め・翌月${s}払い`;
}

/* ================= 工程を組む ================= */
const shiftM=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)+n;
  while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return `${y}-${String(mo).padStart(2,'0')}`;};
function procMonth(c,ps){
  /* 工程の日付が無ければ、旗（完了希望→起算日→完了予定）の月を開く。それも無ければ今月 */
  const d=ps.map(p=>p.date).filter(Boolean).sort()[0]||c.want||c.kisan||c.plan||c.done||c.bill||fmtD(new Date());
  return shiftM(d.slice(0,7),pShift);
}
function vProc(){
  const DONE=DONE_ST;
  let list=DB.cases.filter(c=>
    (pFilter==='すべて'?true:
     pFilter==='発注前（未）'?(c.ord||'未')==='未':
     pFilter==='発注済・進行中'?((c.ord||'未')==='済'&&DONE.indexOf(c.st)<0):
     DONE.indexOf(c.st)>=0)&&
    (!pQ||(c.prop+c.client).toLowerCase().includes(pQ.toLowerCase())));
  list=sortCases(list,pSort);
  // 選んでいる案件は、工程を足して絞り込みから外れても一覧に残す
  const sel=pCase?DB.cases.find(x=>x.id===pCase):null;
  if(sel){ if(!list.some(c=>c.id===pCase)) list=[sel,...list]; }
  else pCase=(list[0]||{}).id||null;
  const c=DB.cases.find(x=>x.id===pCase);
  const mi=DB.cases.filter(x=>(x.ord||'未')==='未').length;
  const noP=DB.cases.filter(x=>(x.ord||'未')==='未'&&!procsOf(x.id).length).length;
  const left=`<div class="cases">${list.slice(0,300).map(x=>`
    <button class="ci ${pCase===x.id?'sel':''}" data-pc="${x.id}">
      <span class="cl" style="background:${col(x.client)}">${esc(x.client||'—')}</span>
      <b>${esc(x.prop||'（物件未入力）')}</b>
      <small>${(x.ord||'未')==='未'?'<span class="nf">発注 未</span>　':''}${esc(x.kind)}　${
        procsOf(x.id).length?procsOf(x.id).length+'工程':'<span class="nf">工程なし</span>'}</small>
      <small><i class="fdot r"></i>${x.kisan?md(x.kisan):'—'}　<i class="fdot b"></i>${x.want?md(x.want):'—'}　<i class="fdot y"></i>${
        x.plan?md(x.plan):'—'}</small></button>`).join('')||'<p class="note">該当なし</p>'}

  const idx=list.findIndex(x=>x.id===pCase);

      <button class="btn small" id="pNextCase" ${idx>=0&&idx<list.length-1?'':'disabled'}>次の案件 ▶</button>`:'';
  return `<div class="bar"><h2>工程を組む</h2>
      <button class="btn small" id="pHide" title="${pHide?'左の一覧を出す':'左の一覧を隠して工程表を広く使う'}">${pHide?'▶ 一覧を出す':'◀ 一覧を隠す'}</button>
      <select id="pFilter" title="案件の絞り込み">${optsL(['発注前（未）','発注済・進行中','完工済','すべて'],pFilter,
        {'すべて':'案件：すべて'})}</select>
      <select id="pSort" title="並び替え">${optsL(SORTS,pSort,{})}</select>
      <input type="search" id="pQ" placeholder="物件名で探す" value="${esc(pQ)}" style="width:150px">
      ${nav}
      <span class="note" style="margin:0" title="2026発注手配・完工予定（9月タブ）の発注列が「未」の行を取り込んである">発注前（未） <b style="color:var(--warn)">${mi}件</b>／工程なし ${noP}件</span></div>
    <div class="layout">${pHide?'':left}<div class="main">${c?procPanel(c):'<div class="card">'+(pHide?'該当する案件がない。絞り込みか検索を変える。':'左で案件を選ぶ。')+'</div>'}</div></div>`;
}
/* 工程表に立てる旗：起算日＝赤、依頼元の完了希望日＝青、弊社の完了予定日＝黄 */
const FLAGS=[['kisan','起算日','r'],['want','完了希望','b'],['plan','完了予定','y']];
const flagsOn=(c,ds)=>FLAGS.filter(f=>c[f[0]]&&c[f[0]]===ds);
const flagHtml=(c,ds)=>flagsOn(c,ds).map(f=>`<span class="ftag ${f[2]}" title="${f[1]} ${md(ds)}">${f[1]}</span>`).join('');
const flagCls=(c,ds)=>flagsOn(c,ds).map(f=>'fd-'+f[2]).join(' ');
function flagLine(c,m){
  return `<div class="flagline">${FLAGS.map(f=>{const v=c[f[0]];
    return `<span class="fi"><span class="ftag ${f[2]}${v?'':' off'}">${f[1]}</span>${
      v?`<b>${md(v)}</b>${ym(v)!==m?`<button class="btn small" data-pjump="${v.slice(0,7)}" title="その月の工程表へ">${+v.slice(5,7)}月へ</button>`:''}`
       :'<span class="note" style="margin:0">—</span>'}</span>`;}).join('')}
</div>`;
}
/* 工程を組む：予定表（見るだけ）。専属の職人と検査担当の、日ごとの予定の数。白＝空き。
   工程を入れるのは今までどおり工程の行・日付・業者の欄で（ここは押しても何も変わらない） */
const KABBR={'清掃':'清','AW検査':'検','検査':'検','内装':'内','リペア補修':'リ','水道設備':'水','電気設備':'電','現地調査':'調','自社施工':'自','鍵交換':'鍵'};
/* 帯の中の区分のボタンで、その区分の業者だけ出す（1つ選ぶ。「全部」もある）。区分は発注先マスタの「既定の工程区分」から自動で並ぶ。
   最初は、この案件で業者が決まっていない工程の区分。下の工程の行の業者欄を押すと、その行の区分に自動で切り替わる */
let avOne=null, avLast=null, avCur='', avQ='';   /* avQ：予定表の名前の検索（入っている間は区分に関係なく全員から探す） */
const AV_SKIP=['現地調査','自社施工'];
function avKinds(){
  const act=DB.vendors.filter(v=>v.active!==false);
  const ks=[...new Set(act.map(v=>v.defKind).filter(k=>k&&!isInsp(k)&&AV_SKIP.indexOf(k)<0))];
  ks.sort((a,b)=>(PKINDS.indexOf(a)+1||99)-(PKINDS.indexOf(b)+1||99));
  if(act.some(canInspect))ks.push('AW検査');

const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function boardRows(m){
  const D=daysIn(m), B=byId();
  const names=[...SEN,...[...new Set(DB.procs.filter(p=>p.who&&SEN.indexOf(p.who)<0&&spanInMonth(p,m))
    .map(p=>p.who))]];
  return names.map(nm=>{
    const days={};
    DB.procs.filter(p=>p.who===nm&&spanInMonth(p,m)).forEach(p=>{
      spanDays(p).forEach(ds=>{ if(ym(ds)!==m)return; const d=+ds.slice(8,10); (days[d]=days[d]||[]).push(p);});});
    return {name:nm,days,off:offDays(nm,m),sen:SEN.indexOf(nm)>=0};
  });
}
/* 顧客名の短い表示（チップ用） */
const clientShort=n=>{ n=String(n||''); return n.length>5?n.slice(0,5):n; };
/* 「仮で入れる」で作ったままの案件か（他に工程・明細・発注・売上・受注受付が無い）。そうなら仮予定の取り消しで案件ごと消す */
function tentOnly(c,pid){
  return !!(c&&c.id&&c.src==='仮予定'&&!c.recv&&!(+c.sales)&&!DB.procs.some(x=>x.case===c.id&&x.id!==pid)
    &&!(DB.lines||[]).some(l=>l.case===c.id)&&!(DB.orders||[]).some(o=>o.case===c.id));
}
/* 仮予定（procs.prog==='仮'）のチップを押した時：確定する・取り消す・案件を開く */
function askTent(pid){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  const c=DB.cases.find(x=>x.id===p.case)||{};
  const span=p.end&&p.end!==p.date?`${md(p.date)} 〜 ${md(p.end)}`:md(p.date);
  const el=document.createElement('div'); el.className='ask';
  el.innerHTML=`<div class="dlg"><h4>仮予定　${esc(c.prop||'（物件未入力）')}</h4>
    <p style="margin:0 0 4px"><span class="ctag" style="background:${col(c.client)}">${esc(c.client||'顧客なし')}</span>${esc(p.who||'担当未定')}　${esc(span)}　${esc(p.kind||'')}</p>
    ${p.memo?`<p style="margin:6px 0 4px;padding:7px 10px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;font-size:13px">${esc(p.memo)}</p>`:''}
    <p class="note" style="margin:0 0 12px">確定すると通常の工程になる。取り消すとこの予定が消える${tentOnly(c,pid)?'（仮で作った案件なので、案件も一緒に消える）':'（案件は残る）'}。</p>
    <div class="askbtn" style="flex-wrap:wrap"><button class="btn small" id="tOpen">案件を開く</button><span class="grow"></span>
      <button class="btn small danger" id="tDel">仮予定を取り消す</button>
      <button class="btn small primary" id="tFix">確定する</button>
      <button class="btn small" id="askNo">閉じる</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('#askNo').onclick=()=>el.remove();
  el.querySelector('#tOpen').onclick=()=>{ el.remove(); selProc=pid; openCase(p.case); };
  el.querySelector('#tFix').onclick=()=>{ snap(); p.prog=''; save(); el.remove(); render(); toast(`「${c.prop||''}」の仮予定を確定した`, undo); };
  el.querySelector('#tDel').onclick=()=>{ const both=tentOnly(c,pid); snap(); DB.procs=DB.procs.filter(x=>x.id!==pid);
    if(both)DB.cases=DB.cases.filter(x=>x.id!==c.id); else recalcPlan(c);
    save(); el.remove(); render(); toast(`「${c.prop||''}」の仮予定を取り消した${both?'（案件も消した）':''}`, undo); };
}

function vBoard(){
  const m=bMonth, D=daysIn(m), rows=boardRows(m), B=byId();

  let peak=1; rows.forEach(w=>{for(let d=1;d<=D;d++){const k=(w.days[d]||[]).length; if(k>peak)peak=k;}});
  const slots=Math.min(peak,MAXSLOT);
  const head=`<tr><th class="nm">職人・業者</th>${Array.from({length:D},(_,i)=>{
    const d=i+1, w=new Date(y,mo-1,d).getDay();

  const body=rows.map(w=>{
    let n=0;
    const tds=Array.from({length:D},(_,i)=>{
      const d=i+1, ds=`${m}-${String(d).padStart(2,'0')}`, off=w.off.includes(d);
      const ps=w.days[d]||[]; n+=ps.length;
      const attr=`data-who="${esc(w.name)}" data-day="${ds}"`;
      const cls=['c',off?'off':''].filter(Boolean).join(' ');
      const show=ps.slice(0,slots), rest=ps.length-show.length;
      const inner=show.map(p=>{const c=B[p.case]||{};
        return `<button class="chip ${selProc===p.id?'sel':''} ${p.prog==='仮'?'tent':''}" draggable="true" data-p="${p.id}"
          style="background:${col(c.client)}">
          <span class="p">${p.prog==='仮'?'<span class="tentb">仮</span>':''}${esc(c.prop||'（物件未入力）')}${p.date===ds?'':'<span class="cont">続</span>'}</span>
          <span class="y">${esc(clientShort(c.client))}${c.client?'・':''}${esc(p.kind)}${p.amt?' '+yen(p.amt):''}</span></button>`;}).join('')
        +(rest>0?`<span class="more">＋${rest}件</span>`:'');
      return `<td class="${cls}" ${attr}>${inner}</td>`;
    }).join('');
    return `<tr><th class="nm">${esc(w.name)}<small>${w.sen?`<button class="lnk" data-off="${esc(w.name)}" title="この月の休みを入れる">休み${w.off.length}日${w.off.length?'：'+w.off.join(',') :''} ✎</button>`:'外注'}</small></th>${tds}<td class="sm">${n}</td></tr>`;
  }).join('');
  return `<div class="bar"><h2>手配ボード</h2>

      <button class="btn small" id="signOut">ログアウト</button></div>

    <div class="boardwrap"><table class="bd" style="--slots:${slots};width:${112+86*D+54}px"><thead>${head}</thead><tbody>${body}</tbody></table></div>

      休み（斜線）は2026年10月のスケジュール管理から取り込んだもの。</p>`;

  const m=kMonth, D=daysIn(m), y=+m.slice(0,4), mo=+m.slice(5,7);

  const all=DB.cases.filter(c=>ym(planOf(c))===m);
  const insp=c=>procsOf(c.id).filter(p=>isInsp(p.kind));
  const noArr=c=>{const ps=procsOf(c.id);
    return !ps.length||ps.some(p=>!p.who||!p.date);};

    kView==='すべて'?true:

/* 表記ゆれを吸収してから照合する。貼替／張替／貼り替え／張り替え は同じ扱い */
const priceKey=s=>wide(s).replace(/[\s　（）()・]/g,'')
  .replace(/張り替え|貼り替え|張替え|貼替え|張替/g,'貼替').replace(/張り/g,'貼り')
  .replace(/剝離/g,'剥離').toLowerCase();
/* 依頼元ごとに呼び方が違うので、単価表の工事名に別名を持たせる（マスタの「別名」欄でも足せる） */
const ALIASES={
  'クロス貼替':['クロス張替','クロス貼り替え'],
  'CF貼替':['CF張替','クッションフロア貼替','クッションフロア張替','クッションフロア','CF'],
  'ソフト巾木':['巾木貼替','巾木張替','巾木交換'],
  'エアコン機械洗浄':['エアコン洗浄','エアコン内部洗浄','エアコンクリーニング','AC内部洗浄','AC洗浄','エアコン分解洗浄'],
  'コーキング打替':['コーキング','コーキング打ち替え','シーリング打替','シーリング打ち替え'],
  '電球交換':['電球'],
  'カーテンレール(W1800)':['カーテンレール交換','カーテンレール取付','カーテンレール新設'],
  '給気口(レジスター)交換':['レジスター交換','レジスター','給気口交換'],
  '洗濯パンエルボ':['エルボ交換','エルボ','洗濯エルボ'],
  '冷蔵庫搬去処分':['冷蔵庫撤去','冷蔵庫処分','冷蔵庫搬出'],
  '冷蔵庫背板貼り':['背板張り','背板貼り','背板'],
  '網戸貼替(大)':['網戸張替','網戸貼替'],
  'パッキン・コマ交換':['パッキン交換','コマ交換'],
  'シングルレバー水栓交換':['シングルレバー'],
  'ワックス剥離洗浄':['WAX剥離洗浄','ワックス剥離','WAX剥離'],
  '引掛シーリング取り付け(丸型)':['引掛シーリング'],
  '床鳴り止め取付':['床鳴り'],
  'UB鏡裏取り':['鏡裏取り'],
  'タオル掛け交換':['タオル掛け'],
  'ペーパーホルダー交換':['ペーパーホルダー'],
  '便座交換':['ウォシュレット交換','便座'],
  '玄関ドアクローザー調整':['ドアクローザー調整','ドアクローザー'],
  '照明引き紐交換':['引き紐交換','引き紐'],
  'ドアスコープ交換':['ドアスコープ'],
  'スイッチ交換':['スイッチ'],
  'コンセント交換':['コンセント'],
};
const ALIASK={}; Object.keys(ALIASES).forEach(n=>{ALIASK[priceKey(n)]=ALIASES[n].map(priceKey);});
/* 単価表1行が持つ照合キー：工事名＋別名欄＋既定の別名 */
function priceKeys(p){
  const k0=priceKey(p.name), ks=[k0];
  String(p.alias||'').split(/[／/,、\n]/).forEach(a=>{const k=priceKey(a); if(k)ks.push(k);});
  (ALIASK[k0]||[]).forEach(k=>ks.push(k));
  return ks.filter(Boolean);
}
/** 明細の名称から発注単価を引く。業者指定の行が優先、無ければ共通の行 */
function findPrice(name,who,unit,client){
  const k=priceKey(name); if(!k)return null;
  /* 1) 完全一致（別名込み） */
  let hit=DB.prices.filter(p=>priceKeys(p).indexOf(k)>=0);
  /* 2) 部分一致。名称が別名を含む（「キッチンコーキング」⊃「コーキング」）か、その逆。いちばん長く当たったものを採る */
  if(!hit.length){
    let best=0, cand=[];
    DB.prices.forEach(p=>{
      priceKeys(p).forEach(pk=>{
        if(pk.length<3)return;
        if(k.indexOf(pk)<0&&pk.indexOf(k)<0)return;
        if(pk.length>best){best=pk.length;cand=[p];}
        else if(pk.length===best&&cand.indexOf(p)<0)cand.push(p);
      });
    });
    const names=cand.map(p=>p.name).filter((v,i,a)=>a.indexOf(v)===i);
    if(names.length===1)hit=cand;           /* 候補が1種類に絞れたときだけ使う */
  }
  /* 依頼元が一致する単価を優先。無ければ依頼元を指定していない（共通の）単価 */
  if(client){
    const byCl=hit.filter(p=>p.client===client);
    hit = byCl.length ? byCl : hit.filter(p=>!p.client);
  }
  if(hit.length>1&&unit){                       /* 同じ名前で単位違い（コーキング打替 m と 式） */
    const byUnit=hit.filter(p=>(p.unit||'式')===unit);
    if(byUnit.length)hit=byUnit;
  }
  return hit.find(p=>p.who&&p.who===who) || hit.find(p=>!p.who) || null;
}

function parsePrices(txt){
  return String(txt||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s0=>{
    const s=s0.replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
    const c=s.split(/\t|,|、|\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
    const name=c[0]||''; let unit='式', price=0, who='', kind='', client='';
    c.slice(1).forEach(x=>{
      if(UNITS.indexOf(x)>=0){unit=x;return;}
      if(PKINDS.indexOf(x)>=0){kind=x;return;}
      const v=+String(x).replace(/[,¥￥円\s]/g,'');
      if(/\d/.test(x)&&!isNaN(v)){price=v;return;}
      if(isClient(x)){client=x;return;}
      if(isVendor(x))who=x;
    });
    return {name,unit,price,who,client,kind:kind||guessKind(name)};
  }).filter(r=>r.name&&r.price);
}

  const draw=()=>{
    const k=priceKey(q.value), raw=q.value.trim().toLowerCase();
    /* 2文字ずつの共通部分で点を付けて似た順に並べる（「エアコン機械洗浄」→「エアコン洗浄」が上に来る） */
    const grams=[]; for(let i=0;i+2<=k.length;i++)grams.push(k.slice(i,i+2));
    const score=p=>{ if(!raw)return 1;
      const ks=priceKeys(p); let best=0;
      ks.forEach(pk=>{ if(pk.indexOf(k)>=0||k.indexOf(pk)>=0){best=Math.max(best,100);return;}
        const n=grams.filter(g=>pk.indexOf(g)>=0).length; best=Math.max(best,n); });
      if(!best&&((p.name||'')+(p.alias||'')).toLowerCase().includes(raw))best=1;
      return best; };
    let list=DB.prices.map(p=>[p,score(p)]).filter(x=>x[1]>0);
    list.sort((a,b)=>(b[1]-a[1])||((b[0].client===cl)-(a[0].client===cl))||((!b[0].client)-(!a[0].client))||String(a[0].name).localeCompare(String(b[0].name),'ja'));

  };
  draw(); q.oninput=draw;
  el.querySelector('#askNo').onclick=()=>el.remove();

    snap('pick');

    l.price=price; if(!l.unit&&p.unit)l.unit=p.unit;
    if(p.who&&!l.who){l.who=p.who; if(!l.kind){const vd=vendorOf(p.who); if(vd&&vd.defKind)l.kind=vd.defKind;}}
    if(p.kind&&!l.kind)l.kind=p.kind;
    if(el.querySelector('#ppAlias').checked&&l.name){
      const k=priceKey(l.name);
      if(k&&priceKeys(p).indexOf(k)<0)p.alias=(p.alias?p.alias+'／':'')+l.name.trim();
    }
    el.remove(); save(); render(); toast(`原価単価 ${yen(price)} を入れた（${p.name}）`, undo);
  };
  el.querySelector('#ppAdd').onclick=()=>{
    const price=+el.querySelector('#ppNew').value; if(!(price>0)){toast('単価を入れてください');return;}
    if(!l.name){toast('明細の名称が空');return;}
    snap('pick'); DB.prseq++;
    DB.prices.push({id:'PR'+DB.prseq+DEV,name:l.name.trim(),kind:l.kind||guessKind(l.name),unit:l.unit||'式',price,who:l.who||'',client:cl,memo:''});
    l.price=price; el.remove(); save(); render(); toast(`単価表に登録して ${yen(price)} を入れた`, undo);
  };
  setTimeout(()=>q.focus(),0);

function applyPrices(cid){
  const cl=(DB.cases.find(x=>x.id===cid)||{}).client||'';
  const ls=DB.lines.filter(l=>l.case===cid&&!l.order&&+l.qty>0);
  let n=0, miss=[], todo=[];
  snap();
  ls.forEach(l=>{
    if(l.price)return;
    const p=findPrice(l.name,l.who,l.unit,cl);
    if(p&&+p.price>0){l.price=+p.price; if(p.unit&&!l.unit)l.unit=p.unit; n++;}
    else if(p){todo.push(l.name);}          /* 表にはあるが単価が空 */
    else if(l.name)miss.push(l.name);
  });
  save(); render();
  const tail=[todo.length?`${todo.length}行は単価未設定（${todo.slice(0,2).join('・')}${todo.length>2?' ほか':''}）`:'',
              miss.length?`${miss.length}行は${cl?cl+'の':''}単価表に無い`:''].filter(Boolean).join('／');
  toast(n?`${n}行に単価を入れた${tail?'／'+tail:''}`
         :(DB.prices.length?(tail||'単価表に合う行が無かった'):'単価マスタがまだ空'), n?undo:null);
}

/* 招待：業者ページの専用リンクを送る。送ったら「招待済み」。相手が開くと DB が「利用中」にする */
function vInviteMsg(v){ return [`${v.full||v.name} 様`,'',`いつもお世話になっております。${(DB.cfg&&DB.cfg.company)||'アンドワークス'}です。`,
  '今後、工事のご依頼・日程のご相談・発注書・完了報告を、下記の専用ページで行います。','ログインは不要です。このリンクを開いて、ブックマーク（ホーム画面に追加）をお願いします。','',vendorLink(v),'',
  '※ このリンクはご本人専用です。他の方には渡さないでください。'].join('\n'); }
function vInvite(nm){
  const v=vendorOf(nm); if(!v)return; if(!v.token){ toast('リンクがまだできていない。少し待ってから、もう一度押してください'); return; }
  const el=document.createElement('div'); el.className='ask';
  el.innerHTML=`<div class="dlg" style="max-width:580px;width:94vw"><h4>${esc(nm)} さんを招待する</h4>
    <p class="note" style="margin:0 0 10px">業者ページの専用リンクを送る。相手はログイン不要で、リンクを開くだけで、打診への返事・工程・発注書・完了報告・請求が使える。</p>
    <label class="fl">送る文面（直せる）</label><textarea id="vMsg" style="width:100%;height:190px;font-family:inherit;font-size:13px;line-height:1.7">${esc(vInviteMsg(v))}</textarea>
    <div class="askbtn" style="margin-top:12px;gap:6px"><button class="btn small" id="askNo">やめる</button><span class="grow"></span>
      <button class="btn small" data-vgo="copy">文面をコピー</button><button class="btn small" data-vgo="mail"${v.email?'':' title="メールアドレスが未登録。宛先は自分で入れる"'}>メールで送る</button><button class="btn small primary" data-vgo="line">LINEで送る</button></div>
    <p class="note" style="margin:8px 0 0">押すと「招待済み」になり、相手がページを開くと「利用中」に変わる。${v.invitedAt?`前回 ${md(String(v.invitedAt).slice(0,10))} に送っている。`:''}</p></div>`;
  el.addEventListener('click',e=>{ const t=e.target; if(t.id==='askNo'){ el.remove(); return; } const go=t.dataset.vgo; if(!go)return;
    const msg=el.querySelector('#vMsg').value;
    if(go==='copy')copyText(msg,'案内の文面をコピーした。LINE やメールに貼って送る');
    else if(go==='mail')window.open(`mailto:${encodeURIComponent(v.email||'')}?subject=${encodeURIComponent('【ご案内】工事のご依頼・発注書の専用ページ')}&body=${encodeURIComponent(msg)}`);
    else window.open('https://line.me/R/share?text='+encodeURIComponent(msg),'_blank','noopener');
    snap('vinvite:'+nm); v.invitedAt=new Date().toISOString(); save(); el.remove(); render(); });
  document.body.appendChild(el);
}

/* ---- 発注書の備考テンプレート（顧客ごと。clients.tpls＝[{id,title,body,always}]） ---- */
const tplsOf=cid=>{ const c=DB.cases.find(x=>x.id===cid), cl=c&&clientOf(c.client); return (cl&&Array.isArray(cl.tpls))?cl.tpls:[]; };
const tplBlock=t=>`【${t.title}】\n${t.body}`;
/* テンプレートは「どの工事で出すか」（kind。空＝すべての工事）を持つ。発注書の工事区分に合うものだけを前に出す */
const tplHit=(t,kind)=>!t.kind||!kind||t.kind===kind;
const tplDefault=(cid,kind)=>tplsOf(cid).filter(t=>t.always&&tplHit(t,kind)).map(tplBlock).join('\n\n');
/* 備考の欄：上に、その案件の顧客のテンプレートがボタンで並ぶ。押すと入り、もう一度押すと外れる。
