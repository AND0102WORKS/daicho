<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>発注と工程｜アンドワークス</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AW 発注と工程">
<meta name="theme-color" content="#0F5E63">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F5F1;--card:#fff;--ink:#1E2A32;--sub:#55616B;--line:#DAD7CE;--acc:#0F5E63;--ok:#1F6B45;--ok-bg:#E3F0E8;--warn:#A8321A;--warn-bg:#FBE9E4;--amber-bg:#FBF3D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:16px;line-height:1.55;padding:0 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:2}
header h1{font-size:16px;margin:0;flex:1}
header .who{color:var(--sub);font-size:13px}
header button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink)}
main{padding:12px 16px 48px;max-width:640px;margin:0 auto}
.tabs{display:flex;gap:6px;margin:4px 0 10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sum{font-size:13px;color:var(--sub);margin:0 0 4px}
.sum b{color:var(--ink)}
.day{margin:16px 0 6px;font-weight:700;color:var(--sub);font-size:14px}
.day.today{color:var(--acc)}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.job.now{border-color:var(--acc);border-width:2px}
.job.done{background:var(--ok-bg);border-color:#BFD9C9}
.job .prop{font-weight:700;font-size:17px}
.job .meta{color:var(--sub);font-size:13.5px;margin-top:3px}
.job .when{font-size:14px;margin-top:6px}
.job .addr{font-size:14.5px;margin-top:6px}
.job .memo{font-size:14px;margin-top:6px;padding:8px 10px;background:var(--amber-bg);border-radius:7px;white-space:pre-wrap}
.job .key{font-size:14.5px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;white-space:pre-wrap}
.job .key b{font-size:12px;color:var(--sub);font-weight:700;margin-right:6px}
.job .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:9px;background:#EEE;color:var(--ink)}
a.map{color:var(--acc);font-size:15px;text-decoration:none;border:1px solid var(--acc);padding:10px 14px;border-radius:8px}
button.done{flex:1;min-width:150px;padding:11px 14px;border-radius:8px;border:1px solid var(--ok);background:var(--card);color:var(--ok);font-size:16px;font-weight:700}
.job.done button.done{background:var(--ok);color:#fff}
button.done:disabled{opacity:.5}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.mode{display:flex;gap:0;margin:2px 0 12px;border:1px solid var(--acc);border-radius:10px;overflow:hidden}
.mode button{flex:1;padding:11px 4px;border:0;background:var(--card);font-size:15px;font-weight:700;color:var(--acc)}
.mode button.on{background:var(--acc);color:#fff}
.mode .cnt[hidden]{display:none}
.mode .cnt{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--warn);color:#fff;font-size:12px;line-height:20px}
.ord{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;color:var(--ink);text-decoration:none}
.ord.wait{border-color:var(--warn);border-width:2px}
.ord .top{display:flex;gap:8px;align-items:center}
.ord .no{color:var(--sub);font-size:13px;flex:1}
.st{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:9px;background:#EEE}
.st.wait{background:var(--warn-bg);color:var(--warn)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.ord .prop{font-weight:700;font-size:17px;margin-top:4px}
.ord .meta{color:var(--sub);font-size:13.5px;margin-top:3px}
.ord .amt{font-size:16px;font-weight:700;margin-top:6px}
.ord .amt small{font-weight:400;color:var(--sub);font-size:12px}
.ord .go{margin-top:10px;text-align:center;padding:10px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700}
.ord:not(.wait) .go{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.sec{margin:16px 0 4px;font-weight:700;color:var(--sub);font-size:14px}
.hint{font-size:12.5px;color:var(--sub);margin:18px 0 0;line-height:1.7}
.wk{display:flex;gap:4px;margin:6px 0}.wk div{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;font-size:11px;color:var(--sub)}
.wk div b{display:block;font-size:17px;color:var(--ink)}.wk .on{border:2px solid var(--acc)}.wk .hi b{color:var(--warn)}
.vol{font-size:12px;font-weight:700;padding:1px 8px;border-radius:9px;background:var(--amber-bg);color:var(--ink)}
a.route{display:block;text-align:center;padding:9px;border-radius:8px;border:1px solid var(--acc);color:var(--acc);font-weight:700;background:#fff;margin:4px 0 8px;font-size:14px;text-decoration:none}
.sz{font-size:12px;font-weight:900;padding:1px 8px;border-radius:9px;color:#fff;vertical-align:2px}.sz-大{background:#C0503A}.sz-中{background:#D99A2B}.sz-小{background:#5E8F6E}
.ins{margin-top:6px}.ins .works{margin-top:4px;font-size:13.5px}.ins .works div{padding:2px 0}
.wt{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:8px;margin-right:6px}.wt.ok{background:var(--ok-bg);color:var(--ok)}.wt.ng{background:var(--warn-bg);color:var(--warn)}
.warnline{margin-top:4px;font-size:12.5px;color:var(--warn);font-weight:700}
.askc{background:#fff;border:2px solid #E0A21B;border-radius:12px;padding:12px 14px;margin:0 0 10px}
.askc .prop{font-weight:900;font-size:16px;margin-bottom:4px}.askc .meta{font-size:13.5px;color:var(--sub);margin-top:2px}.askc .meta b{color:var(--ink);font-size:15px}
.askb{display:flex;gap:8px;margin-top:10px}.askb button{flex:1;padding:12px 0;border-radius:10px;font-size:15px;font-weight:900;border:1px solid var(--line);background:#fff}
.askb .ok{background:var(--acc);color:#fff;border-color:var(--acc)}.askb .ng{color:var(--warn)}
.rst{font-size:14px;font-weight:700;padding:8px 10px;border-radius:7px;flex-basis:100%}
.rst.wait{background:var(--amber-bg)}.rst.ok{background:var(--ok-bg);color:var(--ok)}.rst.ng{background:var(--warn-bg);color:var(--warn)}
button.sub{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.msheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.msheet h3{margin:0 0 4px;font-size:17px}
.msheet label{display:block;font-size:13px;color:var(--sub);margin-top:12px}
.msheet input,.msheet textarea{display:block;width:100%;margin-top:4px;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;color:var(--ink);background:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs .t{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:#EEE}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pseg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pseg button{padding:8px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink)}
.pseg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.msheet label.pick{display:block;margin-top:14px;padding:14px;border:2px dashed var(--acc);border-radius:10px;text-align:center;color:var(--acc);font-weight:700}
.msheet label.pick input{margin:8px auto 0;border:0;padding:0;font-size:13px}
.rphoto{margin-top:12px;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs .tst{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:2px 0}
.thumbs .tst.ok{background:var(--ok);left:auto;right:auto;width:22px;border-radius:0 8px 0 0}
.thumbs .tst.ng{background:var(--warn)}
.thumbs button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;padding:0}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:8px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btns button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btns button:disabled{opacity:.5}
.bm{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.bm h4{margin:0 0 6px;font-size:15px}
.bm .it{display:flex;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid #EEE}
.bm .it .p{flex:1}.bm .it .a{white-space:nowrap;font-weight:700}
.bm .it small{display:block;color:var(--sub);font-weight:400}
.bm .tot{text-align:right;font-size:14px;margin-top:8px}
.bm .tot b{font-size:17px}
.bm .act{margin-top:10px}
.bm .act button{width:100%;padding:11px;border-radius:8px;background:var(--acc);color:#fff;border:0;font-size:15px;font-weight:700}
.doc{background:#fff;color:#000;font-size:13px;line-height:1.6}
.doc h2{text-align:center;letter-spacing:.4em;font-size:20px;margin:4px 0 12px}
.doc .two{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.doc table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
.doc th,.doc td{border-bottom:1px solid #CCC;padding:5px 4px;text-align:left;vertical-align:top}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc .dsum{margin-top:8px;margin-left:auto;width:min(100%,280px);color:#000;font-size:13px}
.doc .dsum div{display:flex;justify-content:space-between;padding:2px 0}
.doc .dsum .g{font-weight:700;font-size:15px;border-top:2px solid #000;margin-top:4px;padding-top:4px}
.doc .dnote{font-size:11.5px;color:#333;margin-top:10px}
@media print{ body *{visibility:hidden} #docm, #docm *{visibility:visible} #docm{position:absolute;inset:0;background:#fff} #docm .msheet{max-height:none;border-radius:0;box-shadow:none} #docm .noprint{display:none} }
.err{background:var(--warn-bg);color:var(--warn);padding:12px;border-radius:8px}
</style>
</head>
<body>
<header><h1>発注と工程</h1><span class="who" id="who"></span><button id="reload" type="button">更新</button></header>
<main>
  <div class="mode"><button data-m="orders">発注<span class="cnt" id="waitCnt" hidden></span></button><button data-m="sched">工程</button><button data-m="bill">請求</button></div>
  <div id="billView" hidden><div id="blist"><div class="empty">読み込み中…</div></div>
    <p class="hint">完了報告を会社が承認すると、ここに締めの月ごとに並びます。「この月の請求書を発行する」で請求書ができます。<br>会社から支払明細書が届いたときも、ここに出ます。</p></div>
  <div id="ordersView" hidden><div id="olist"><div class="empty">読み込み中…</div></div>
    <p class="hint">このページはあなた専用です。ほかの人に教えないでください。<br>スマホの「ホーム画面に追加」をしておくと、アプリのようにすぐ開けます。</p></div>
  <div id="schedView">
  <div class="tabs"><button data-r="prev">先週</button><button data-r="week" class="on">今週</button><button data-r="next">来週</button><button data-r="month">今月</button></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</main>
<div class="modal" id="rm" hidden><div class="msheet">
  <h3>完了報告</h3><div class="meta" id="rProp"></div>
  <label>完了日<input type="date" id="rDone"></label>
  <label>コメント（任意）<textarea id="rNote" rows="3" placeholder="作業の内容、気づいたことなど"></textarea></label>
  <div class="rphoto" id="rPhotoNote"></div>
  <label>発注金額<input type="text" id="rBase" disabled></label>
  <label>追加金額（税抜・ある場合だけ）<input type="number" id="rExtra" min="0" step="100" inputmode="numeric" placeholder="0"></label>
  <label>追加の理由（追加金額があるときは必ず）<input type="text" id="rExtraNote" placeholder="例：下地補修が追加で必要だった"></label>
  <div class="btns"><button type="button" id="rClose">やめる</button><button type="button" class="primary" id="rSend">報告を送る</button></div>
</div></div>
<div class="modal" id="pm" hidden><div class="msheet">
  <h3>写真</h3><div class="meta" id="pProp"></div>
  <label>区分</label><div class="pseg" id="pCats"></div>
  <div id="pPhase"><label id="pPhLab">施工前・施工後</label><div class="pseg"><button type="button" data-pph="前">施工前</button><button type="button" data-pph="後">施工後</button></div></div>
  <label class="pick">写真を選ぶ（何枚でも。選ぶとすぐ送り始めます）<input type="file" id="pFiles" accept="image/*" multiple></label>
  <div class="hint" id="pUp" style="margin:6px 0 0"></div>
  <div id="pMine"></div>
  <div class="btns"><button type="button" id="pClose">閉じる</button></div>
</div></div>
<div class="modal" id="docm" hidden><div class="msheet"><div id="docBody" class="doc"></div>
  <div class="btns noprint"><button type="button" id="docClose">閉じる</button><button type="button" id="docOk" class="primary" hidden>内容を確認しました</button><button type="button" id="docPrint">印刷・PDF</button></div></div></div>
<script>
const SB_URL='https://stcvyehefqnrxibanlxg.supabase.co', SB_KEY='sb_publishable_ZZelNGtUNXLpXs7j4Nd_zw_XFYwI3fx';
/* ログイン情報は持たない・更新しない（同じブラウザで台帳にログインしていても、そのログインに触らない） */
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const token=new URLSearchParams(location.search).get('t')||'';
const WD=['日','月','火','水','木','金','土'];
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const md=s=>{ if(!s)return ''; s=String(s).slice(0,10); return `${+s.slice(5,7)}/${+s.slice(8,10)}（${WD[new Date(s+'T00:00:00').getDay()]}）`; };
const days=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let range='week', ME=null, busy=false, mode='', ROWS={}, ASKS=[];
const yen=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP');
const SLABEL={'送付済':['承諾待ち','wait'],'承諾':['承諾済み','ok'],'完了':['完了',''],'請求済':['請求済み','']};
/* 発注の一覧（送付済み以降）。承諾待ちを上に。押すと発注書（承諾ボタンのあるページ）を開く */
async function loadOrders(){
  const el=document.getElementById('olist');
  const {data,error}=await sb.rpc('my_orders',{p_token:token});
  if(error){ el.innerHTML='<div class="err">読み込めませんでした。電波の良いところで「更新」を押してください。</div>'; return null; }
  const rows=data||[], wait=rows.filter(o=>o.st==='送付済');
  /* 日程の打診（返事待ち）。発注の一覧の一番上に出す */
  const ra=await sb.rpc('my_asks',{p_token:token}); ASKS=(ra.data||[]);
  const askHtml=ASKS.length?`<div class="sec" style="margin-top:0">日程の打診（${ASKS.length}件）　お返事ください</div>`+ASKS.map(a=>{
    const s=String(a.start_date||'').slice(0,10), e=String(a.end_date||'').slice(0,10);
    return `<div class="askc"><div class="prop">${esc(a.prop)}</div>
      <div class="meta"><span class="tag">${esc(a.kind)}</span>　<b>${md(s)}${e&&e!==s?' 〜 '+md(e):''}</b></div>
      ${a.addr?`<div class="meta">${esc(a.addr)}</div>`:''}
      <div class="askb"><button type="button" class="ok" data-ans="${esc(a.proc_id)}|1">受けられる</button><button type="button" class="ng" data-ans="${esc(a.proc_id)}|0">都合が悪い</button></div></div>`; }).join(''):'';
  const c=document.getElementById('waitCnt'); c.hidden=!(wait.length+ASKS.length); c.textContent=wait.length+ASKS.length;
  if(!rows.length){ el.innerHTML=askHtml+(ASKS.length?'':'<div class="empty">発注はまだありません</div>'); return rows; }
  const card=o=>{ const [lab,cls]=SLABEL[o.st]||[o.st,''], tax=o.taxable!==false, amt=tax?Math.round(o.amount*1.1):o.amount;
    const term=o.start_date?md(o.start_date)+(o.end_date&&String(o.end_date).slice(0,10)!==String(o.start_date).slice(0,10)?' 〜 '+md(o.end_date):''):'未定';
    return `<a class="ord ${o.st==='送付済'?'wait':''}" href="order.html?t=${encodeURIComponent(o.order_token)}&v=${encodeURIComponent(token)}">
      <div class="top"><span class="no">発注No. ${esc(o.order_no)}</span><span class="st ${cls}">${esc(lab)}</span></div>
      <div class="prop">${esc(o.prop)}</div>
      <div class="meta"><span class="tag">${esc(o.kind||'工事')}</span>　工期 ${term}${o.due&&o.st==='送付済'?`　回答期限 ${md(o.due)}`:''}</div>
      <div class="amt">${yen(amt)} <small>${tax?'（税込）':'（消費税なし）'}</small></div>
      <div class="go">${o.st==='送付済'?'発注書を見て承諾する':'発注書を見る'}</div></a>`; };
  const act=rows.filter(o=>o.st==='送付済'||o.st==='承諾'), past=rows.filter(o=>o.st!=='送付済'&&o.st!=='承諾');
  el.innerHTML=askHtml+(wait.length?`<p class="sum">承諾待ちが <b>${wait.length}</b> 件あります</p>`:'')+
    (act.length?act.map(card).join(''):'<div class="empty">進行中の発注はありません</div>')+
    (past.length?`<div class="sec">完了した発注（${past.length}件）</div>`+past.slice(0,20).map(card).join(''):'');
  return rows;
}
function setMode(m){ mode=m;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('ordersView').hidden=m!=='orders'; document.getElementById('schedView').hidden=m!=='sched';
  document.getElementById('billView').hidden=m!=='bill'; if(m==='bill'&&ME)loadBill(); }
function span(){
  const t=new Date(); t.setHours(0,0,0,0);
  if(range==='month'){ const a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0); return [fmt(a),fmt(b)]; }
  const dow=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-dow+(range==='next'?7:range==='prev'?-7:0));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); return [fmt(mon),fmt(sun)];
}
async function load(){
  const list=document.getElementById('list');
  if(!token){ list.innerHTML='<div class="err">このページは会社から送られた専用のリンクで開いてください。</div>'; return; }
  if(!ME){ const {data,error}=await sb.rpc('my_vendor',{p_token:token});
    if(error){ list.innerHTML='<div class="err">読み込めませんでした。電波の良いところで「更新」を押してください。</div>'; return; }
    if(!data||!data.length){ list.innerHTML='<div class="err">リンクが無効です。会社に確認してください。</div>'; return; }
    ME=data[0]; document.getElementById('who').textContent=ME.name+' さん'; }
  const [a,b]=span();

/* 写真は長い辺 1280px・画質 70% の JPEG に縮めてから送る（1枚 150KB 前後。通信量と保存領域を節約） */
async function shrink(file){
  try{ const img=await createImageBitmap(file); const sc=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.7)); }catch(e){ return file; }
}

let DOCI=null;
function openDoc(i){ const v=(BILL.invoices||[])[i]; if(!v)return; DOCI=v;
  document.getElementById('docBody').innerHTML=invoiceDoc(v,BILL.vendor);
  document.getElementById('docOk').hidden=!(v.kind==='支払明細書'&&v.st==='発行');
  document.getElementById('docm').hidden=false; }
async function start(){
  if(!token){ setMode('sched'); load(); return; }
  const {data,error}=await sb.rpc('my_vendor',{p_token:token});
  if(error||!data||!data.length){ setMode('sched'); load(); return; }   /* 無効なリンクの表示は load() に任せる */
  ME=data[0]; document.getElementById('who').textContent=ME.name+' さん';
  const rows=await loadOrders();
  setMode(ASKS.length||(rows&&rows.some(o=>o.st==='送付済'))?'orders':(rows&&rows.length&&ME.type==='外注'?'orders':'sched'));
  load();
}
document.addEventListener('click',async e=>{
  const mb=e.target.closest('[data-m]'); if(mb){ setMode(mb.dataset.m); return; }
  const an=e.target.closest('[data-ans]'); if(an){ const [pid,ok]=an.dataset.ans.split('|');
    const a=ASKS.find(x=>x.proc_id===pid)||{};
    if(!confirm(ok==='1'?`${a.prop||''}\n${md(a.start_date)} ${a.kind||''}\nを受けます。よろしいですか？`:`${a.prop||''}\n${md(a.start_date)} ${a.kind||''}\nは都合が悪いと返事します。よろしいですか？`))return;
    an.disabled=true;
    sb.rpc('answer_ask',{p_token:token,p_proc:pid,p_ok:ok==='1'}).then(({data,error})=>{
      if(error||data==='ng'){ alert('送れませんでした。もう取り消されたか、電波が弱い可能性があります。「更新」を押してください。'); }
      else alert(ok==='1'?'受けると返事しました。工程に入りました。':'都合が悪いと返事しました。');
      loadOrders(); });
    return; }
  if(e.target.id==='reload'){ loadOrders(); load(); if(mode==='bill')loadBill(); return; }
  /* 完了報告 */
  const rb=e.target.closest('[data-rep]'); if(rb){ openReport(rb.closest('.job').dataset.id); return; }
  if(e.target.id==='rClose'){ document.getElementById('rm').hidden=true; return; }
  if(e.target.id==='rSend'){ sendReport(); return; }
  /* 写真 */
  const pb=e.target.closest('[data-photo]'); if(pb){ const pid=pb.dataset.pid||pb.closest('.job').dataset.id; document.getElementById('rm').hidden=true; openPhotos(pid); return; }
  const pc=e.target.closest('[data-pcat]'); if(pc&&PS){ PS.cat=pc.dataset.pcat; drawPS(); return; }
  const pp=e.target.closest('[data-pph]'); if(pp&&PS){ PS.phase=pp.dataset.pph; drawPS(); return; }
  const rt=e.target.closest('[data-retry]'); if(rt&&PS){ upStart(PS.ups[+rt.dataset.retry]); drawPS(); return; }
  if(e.target.id==='pUp'&&PS){ PS.ups.filter(u=>u.st==='ng').forEach(upStart); drawPS(); return; }
  const dp=e.target.closest('[data-delph]'); if(dp&&PS&&!busy){ if(!confirm('この写真を外しますか？'))return; busy=true;
    const {data}=await sb.rpc('del_my_photo',{p_token:token,p_id:dp.dataset.delph}); busy=false;
    if(data===true)await sb.storage.from('reports').remove([dp.dataset.path]); else alert('外せませんでした（完了報告が承認済みの写真は外せません）');
    loadMine(); return; }
  if(e.target.id==='pClose'){ if(PS&&PS.ups.some(u=>u.st==='up')&&!confirm('まだ送信中の写真があります。閉じると送信が止まることがあります。閉じますか？'))return;
    document.getElementById('pm').hidden=true; PS=null; return; }
  const cb=e.target.closest('[data-cancel]'); if(cb&&!busy){ const job=cb.closest('.job');
    if(!confirm('「'+(job.querySelector('.prop').textContent||'この工程')+'」の完了報告を取り消しますか？'))return;
    busy=true; const {data,error}=await sb.rpc('cancel_report',{p_token:token,p_proc:job.dataset.id}); busy=false;
    if(error||data!==true)alert('取り消せませんでした。会社に確認してください。'); load(); return; }
  /* 請求 */
  const ib=e.target.closest('[data-issue]'); if(ib&&!busy){ const mon=ib.dataset.issue;
    if(!confirm(mlab(mon)+'締めの請求書を発行しますか？\n承認済みの完了報告がまとまります。発行後は取り消せません（誤りは会社にご連絡ください）。'))return;
    busy=true; ib.disabled=true; const {error}=await sb.rpc('issue_invoice',{p_token:token,p_month:mon}); busy=false;
    if(error)alert('発行できませんでした：'+(/empty/.test(error.message)?'この月に請求できる完了報告がありません':error.message));
    await loadBill(); if(!error)openDoc(0); return; }
  const db2=e.target.closest('[data-doc]'); if(db2){ openDoc(+db2.dataset.doc); return; }
  if(e.target.id==='docClose'){ document.getElementById('docm').hidden=true; return; }
  if(e.target.id==='docPrint'){ window.print(); return; }
  if(e.target.id==='docOk'&&DOCI&&!busy){ busy=true; const {data,error}=await sb.rpc('confirm_statement',{p_token:token,p_id:DOCI.id}); busy=false;
    if(error||data!==true)alert('記録できませんでした。会社に確認してください。'); document.getElementById('docm').hidden=true; loadBill(); return; }
  const t=e.target.closest('[data-r]'); if(t){ range=t.dataset.r; document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b===t)); load(); return; }
});
document.addEventListener('change',e=>{ if(e.target.id==='pFiles'&&PS){
  const fs=Array.from(e.target.files||[]); e.target.value='';
  const ph=PHASED.indexOf(PS.cat)>=0?PS.phase:'';
  fs.forEach(f=>{ const u={file:f,url:URL.createObjectURL(f),pid:PS.pid,cat:PS.cat,phase:ph}; PS.ups.push(u); upStart(u); }); drawPS(); } });
/* 画面に戻ってきたら最新にする（朝に開きっぱなしのまま、予定が変わっていることがある） */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!busy&&ME&&document.getElementById('rm').hidden){ loadOrders(); load(); if(mode==='bill')loadBill(); } });
start();
</script>
</body>
</html>
