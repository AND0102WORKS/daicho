<title>Aチーム統合台帳</title>
<meta name="claude:viewport-fit-sides" content="true">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F6F5F1; --card:#FFFFFF; --card2:#FBFAF7; --ink:#1E2A32; --sub:#55616B;
  --line:#DAD7CE; --line2:#ECEAE3; --acc:#0F5E63; --acc-ink:#FFFFFF;
  --warn:#A8321A; --warn-bg:#FBE9E4; --ok:#1F6B45; --ok-bg:#E3F0E8;
  --c-step:#E7D8F0; --c-crea:#CFE3EE; --c-buddy:#F3E2C7; --c-pres:#D8E9D4;
  --c-nz:#F6D9D9; --c-izumi:#E2E4CF; --c-other:#E6E4DD;
  --gut:max(16px, env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding:0 var(--gut) 40px}
h1,h2,h3,h4{margin:0;font-weight:900;letter-spacing:.01em}
p{margin:0}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:9px var(--gut);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:15px;line-height:1.25}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:8px 11px;border-radius:8px;font-weight:700;
  color:var(--sub);min-height:36px;font-size:13.5px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.src{margin-left:auto;font-size:11px;color:var(--sub);text-align:right;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.bar h2{font-size:17px;margin-right:4px}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-width:112px}
.kpi .k small{display:block;font-size:10.5px;color:var(--sub);margin-bottom:1px}
.kpi .k b{font-size:17px;font-variant-numeric:tabular-nums}
select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=month]{
  height:36px;border:1.5px solid var(--line);border-radius:8px;padding:0 9px;background:var(--card)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums;
  appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes chgflash{0%{background:#FDE9A9}70%{background:#FDF3D4}100%{background:transparent}}
table.ln tr.chg td{animation:chgflash 1.6s ease-out}
label.fl{display:block;font-size:11px;color:var(--sub);font-weight:700;margin:0 0 3px}
.btn{height:36px;padding:0 13px;border-radius:8px;border:1.5px solid var(--ink);background:var(--card);
  font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.small{height:30px;padding:0 9px;font-size:12.5px;border-color:var(--line)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--card2);text-align:left;padding:8px 9px;
  font-size:11.5px;color:var(--sub);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:var(--card2)}
tbody tr.on td{background:var(--ok-bg)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.cl{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;
  background:var(--line2);white-space:nowrap}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.wip{background:#FFF1D6}
.st.new{background:var(--warn-bg);color:var(--warn)}
.flag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);
  border-radius:4px;padding:0 5px;margin-right:3px}
/* board */
.boardwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:72vh}
table.bd{font-size:12px;table-layout:fixed;--col:86px;--slot:30px;--slots:1}
table.bd th,table.bd td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;vertical-align:top;overflow:hidden}
table.bd thead th{padding:4px 2px;text-align:center;width:var(--col);font-size:11px}
table.bd thead th b{font-size:13px;color:var(--ink)}
table.bd thead th small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
table.bd thead th.sat{background:#EAF1F6}table.bd thead th.sun{background:#F8EDED}
table.bd thead th.nm,table.bd tbody th.nm{width:112px}
table.bd tbody th.nm{position:sticky;left:0;z-index:3;background:var(--ground);text-align:left;
  padding:6px 8px;font-weight:700;min-width:104px;width:104px;border-right:1px solid var(--line);font-size:12.5px}
table.bd tbody th.nm small{display:block;font-weight:400;color:var(--sub);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c{width:var(--col);height:calc(var(--slots) * var(--slot) + 6px);padding:2px;position:relative}
table.bd th.sm,table.bd td.sm{width:54px;text-align:center;background:var(--ground);font-weight:700}
.more{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;line-height:1.5}
td.c.off{background:repeating-linear-gradient(135deg,#F1EFEA,#F1EFEA 5px,#E8E5DE 5px,#E8E5DE 10px)}
td.c.ok{outline:2px dashed var(--acc);outline-offset:-2px;background:var(--card2)}
td.c.ng{outline:2px dashed var(--warn);outline-offset:-2px;background:var(--warn-bg)}
.chip{display:block;width:100%;text-align:left;border:none;border-radius:6px;padding:2px 4px;
  height:calc(var(--slot) - 2px);margin-bottom:2px;overflow:hidden;
  font-family:inherit;font-size:11px;line-height:1.3;cursor:grab;color:var(--ink)}
.chip.sel{outline:2px solid var(--ink);outline-offset:-2px}
.chip.drag{opacity:.35}
.chip .p{display:block;font-weight:700;font-size:10.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .y{display:block;font-size:9.5px;line-height:1.25;color:var(--sub);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:9px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 工程を組む */
.cases{flex:0 0 290px;width:290px;max-height:72vh;overflow:auto;display:flex;flex-direction:column;gap:5px}
.ci{flex:0 0 auto;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-family:inherit;cursor:pointer;color:var(--ink)}
.ci.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.ci b{display:block;font-size:12.5px;margin:3px 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci small{display:block;font-size:11px;color:var(--sub)}
.ci .nf{color:var(--warn);font-weight:700}
td.pc{width:var(--col);height:42px;padding:2px;cursor:pointer}
td.pc.off{background:repeating-linear-gradient(135deg,#F1EFEA,#F1EFEA 5px,#E8E5DE 5px,#E8E5DE 10px)}
td.pc.busy{background:#FBEFE6}
td.pc.ok{outline:2px dashed var(--acc);outline-offset:-2px;background:var(--card2)}
td.pc.ng{outline:2px dashed var(--warn);outline-offset:-2px;background:var(--warn-bg)}
.chip.pc .y{font-size:10px}
.kneed{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.kk{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;
  font-family:inherit;color:var(--ink);cursor:pointer}
.kk.on{opacity:.55;cursor:default}
@media (max-width:980px){.cases{flex:1 1 auto;width:100%;max-height:260px}}
/* 工事管理の日程表 */
.kenrow{display:flex;gap:3px;flex-wrap:wrap}
.kd{flex:1 1 34px;min-width:34px;border:1px solid var(--line2);border-radius:6px;padding:3px 2px;
  text-align:center;background:var(--card2)}
.kd.we{background:#F2F0EA}
.kd.has{background:var(--ok-bg);border-color:var(--ok)}
.kd b{display:block;font-size:12px}
.kd small{display:block;font-size:9.5px;color:var(--sub)}
.kd span{display:block;font-size:13px;font-weight:900;color:var(--ok);min-height:17px}
/* drawer */
.layout{display:flex;gap:12px;align-items:flex-start}
.layout .main{flex:1;min-width:0}
.drawer{width:380px;flex:0 0 380px;position:sticky;top:62px;max-height:calc(100vh - 76px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.drawer h3{font-size:15px;margin-bottom:2px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fg .full{grid-column:1/-1}
.fg input,.fg select{width:100%}
.pl{margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
.prow{display:grid;grid-template-columns:58px 1fr 118px 14px 118px 84px 26px;gap:5px;align-items:center;margin-bottom:5px}
.prow .tl{text-align:center;color:var(--sub);font-size:12px}
.prow.np{grid-template-columns:70px 1fr 128px 14px 128px 26px}
.chip .cont{display:inline-block;font-size:9.5px;color:var(--sub);margin-left:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--sub);text-align:center;padding:2px 0}
.cal .d{min-height:88px;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:4px 5px}
.cal .d.we{background:#F7F5F0}.cal .d.out{opacity:.35}.cal .d.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cal .d b{display:block;font-size:12px;margin-bottom:3px}.cal .d b small{font-weight:400;color:var(--sub);margin-left:3px}
.cal .ev{display:block;width:100%;text-align:left;border:none;border-radius:5px;padding:2px 4px;margin-bottom:2px;
  font-size:11px;line-height:1.3;cursor:pointer;font-family:inherit;color:var(--ink)}
.cal .ev .w{display:block;font-size:10px;color:var(--sub)}
.cal .ev.nd{background:var(--warn-bg);color:var(--warn)}
.cal .d .flag{margin-top:2px}
.pending{outline:2px dashed var(--acc);outline-offset:-2px}
.prow select,.prow input{height:32px;font-size:12.5px;width:100%;padding:0 6px}
.prow .x{border:none;background:none;color:var(--warn);font-weight:900;cursor:pointer;font-size:15px;padding:0}
.tot{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.tot b{font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--ground);
  border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.55;max-width:320px;
  box-shadow:0 12px 32px rgba(30,42,50,.34)}
.tip b{display:block;font-size:13.5px;margin-bottom:3px;line-height:1.35}
.tip .s{color:#BFCBD1}
.tip .w{color:#BFCBD1;margin-top:3px;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:9px 15px;border-radius:9px;font-size:13px;z-index:70;display:flex;gap:12px;align-items:center;
  box-shadow:0 8px 28px rgba(30,42,50,.3)}
.toast button{background:none;border:none;color:var(--ground);text-decoration:underline;font-weight:700;
  cursor:pointer;font-family:inherit;font-size:13px}
.ask{position:fixed;inset:0;z-index:80;background:rgba(30,42,50,.34);display:flex;align-items:center;
  justify-content:center;padding:16px}
.askbox{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:380px;width:100%;
  padding:16px;box-shadow:0 18px 50px rgba(30,42,50,.22)}
.askbox h4{margin:0 0 6px;font-size:15px}
.askbox ul{margin:0 0 14px;padding-left:18px;font-size:13px;color:var(--warn);line-height:1.7}
.askbtn{display:flex;gap:8px;justify-content:flex-end}
.ck{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;
  background:var(--card);margin-bottom:7px}
.ck .t{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);
  border-radius:4px;padding:1px 6px;margin-right:6px}
.ck .d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.day{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;margin-bottom:8px}
.day h4{font-size:13px;margin-bottom:6px}
.day .it{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line2);font-size:12.5px}
.day .it:first-of-type{border-top:none}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 発注 */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:0 13px;height:36px;font-weight:700;font-size:13.5px;
  font-family:inherit;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.lnw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:68vh}
table.ln{font-size:12.5px;min-width:1260px}
table.ln tbody td{padding:4px 6px}
table.ln input,table.ln select{height:30px;font-size:12.5px;padding:0 6px;width:100%}
table.ln input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--acc)}
table.ln td.n{width:30px;text-align:center}
table.ln th.nmcol,table.ln td.nmcol{min-width:230px}
table.ln .x{border:none;background:none;color:var(--warn);font-weight:900;cursor:pointer;font-size:15px;padding:0}
table.ln .x.pk{color:var(--sub);font-weight:600;font-size:11px;margin-left:3px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;vertical-align:middle}
table.ln .x.pk:hover{color:var(--ink);border-color:var(--ink)}
table.ln tr.ghead td{background:#F3EFE7;border-top:2px solid var(--line);padding:6px 8px}
table.ln td.rn{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;padding-right:4px}
.ocol{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.ocell{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;cursor:pointer}
.ocell:hover{border-color:var(--ink)}
table.ln tr.ghead+tr td{border-top:none}
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ok-bg);border:1px solid var(--ok);
  border-radius:9px;padding:8px 12px;margin:0 0 8px;font-size:13px;position:sticky;top:6px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.selbar b{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:26px 14px;font-size:13px;line-height:1.9}
.cutbox{margin-bottom:10px;background:var(--warn-bg);border-color:#E7BCB0}
.cutbox h3{color:var(--warn)}
.cutbox td{text-decoration:line-through;text-decoration-color:#C9907F}
.cutbox td.note{text-decoration:none}
table.ln tr.cutln{background:var(--warn-bg)}
table.ln tr.cutln .li{color:var(--sub);background:transparent;border-color:#E7BCB0}
table.ln tr.cutln td.nmcol .li{text-decoration:line-through;text-decoration-color:#C9907F}
.cutbadge{background:#C9907F;white-space:nowrap}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.dwsec{display:flex;align-items:baseline;gap:8px;padding:6px 0 2px;border-bottom:1px solid var(--line);font-size:13px}
/* 工程表の旗 */
.ftag{display:inline-block;font-size:10px;line-height:1;padding:3px 9px 3px 6px;color:#fff;font-weight:700;white-space:nowrap;
  clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%);border-radius:2px 0 0 2px;margin:2px 0 0;vertical-align:middle}
.ftag.r{background:#C8372D}.ftag.b{background:#2F6DB5}.ftag.y{background:#E0A800;color:#2B2B2B}
.ftag.off{background:#D5D1C9;color:#fff}
table.bd th .ftag{display:block;margin:3px auto 0;width:max-content}
table.bd th.fd-r,table.bd td.fd-r{box-shadow:inset 3px 0 0 #C8372D;background:#FBECEA}
table.bd th.fd-b,table.bd td.fd-b{box-shadow:inset 3px 0 0 #2F6DB5;background:#E8F0FA}
table.bd th.fd-y,table.bd td.fd-y{box-shadow:inset 3px 0 0 #E0A800;background:#FBF3D6}
.flagline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;font-size:12.5px}
.flagline .fi{display:inline-flex;gap:6px;align-items:center}
.fdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:2px;vertical-align:middle}
.btn .cnt{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:9px;background:rgba(255,255,255,.28);font-size:10.5px;line-height:16px;text-align:center}
.fdot.r{background:#C8372D}.fdot.b{background:#2F6DB5}.fdot.y{background:#E0A800}
.ob{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;
  padding:22px 24px;max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(30,42,50,.22)}
.ob h3{font-size:18px;text-align:center;letter-spacing:.34em;margin-bottom:16px}
.ob .meta{display:grid;grid-template-columns:82px 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:12px;line-height:1.6}
.ob .meta b{color:var(--sub);font-weight:700}
.ob table{font-size:12.5px;margin-bottom:10px}
.ob .amt{text-align:right;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;margin:0}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:470px;width:100%;
  padding:18px;max-height:88vh;overflow:auto;box-shadow:0 18px 50px rgba(30,42,50,.22)}
.dlg h4{margin:0 0 10px;font-size:15px}
.dlg textarea{width:100%;height:168px;border:1.5px solid var(--line);border-radius:8px;padding:8px;
  font-size:12.5px;line-height:1.7;font-family:ui-monospace,SFMono-Regular,monospace;color:var(--ink)}
@media (max-width:980px){
  .layout{flex-direction:column}
  .drawer{width:100%;flex:1 1 auto;position:static;max-height:none}
}
</style>
<div class="top">
  <div class="brand">Aチーム統合台帳 <small>案件管理 ＋ 完工予定 ＋ スケジュール管理 を1つに／テストモデル v3</small></div>
  <div class="tabs" id="tabs"></div>
  <div class="src" id="src"></div>
</div>
<div class="wrap"><div id="main"></div></div>
<script>
/* ================= v4：Supabase が正。DB（メモリ）は画面用の写し =================
   方針：
   ・開くときに表を読んで DB を組み立てる。保存は「変わった行だけ upsert、消えた行は delete」。
   ・他の人の変更は Realtime（postgres_changes）で行単位に受け取り、その行だけ差し替える。
   ・合流・墓標・箱分け・採番ロックは無い（サーバー側で行単位に決まる）。
   ・列名と JS の項目名が違うものだけ MAP で変換する。 */

/* 行（DBの列）→ JS のレコード */
function rowToRec(t,row){
  const T=TABLES[t], r={};
  Object.keys(row).forEach(c=>{ if(c==='updated_at'||c==='created_at')return;   /* token は読むだけ（職人・業者のリンク用。書き戻さない） */
    let v=row[c]; const j=REV[t][c]||c;
    if(v===null||v===undefined) v=(T.bools.indexOf(c)>=0)?false:'';
    if(T.dates.indexOf(c)>=0&&v){ if(v instanceof Date) v=`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`; else v=String(v).slice(0,10); }
    if(t==='lines'&&c==='cut') v=v?1:0;
    r[j]=v; });
  if(t==='vendors'||t==='clients'){ if(r.full==null)r.full=''; }
  return r;
}
/* JS のレコード → 行 */
function recToRow(t,rec){
  const T=TABLES[t], row={};
  T.cols.forEach(c=>{ const j=REV[t][c]||c; let v=rec[j];
    if(c==='org'){ row.org=rec.org||ORG; return; }
    if(v===undefined) return;
    if(T.dates.indexOf(c)>=0) v=(v&&/^\d{4}-\d{2}-\d{2}/.test(String(v)))?String(v).slice(0,10):null;
    else if(T.bools.indexOf(c)>=0) v=!!v;
    else if(['sales','add_amt','amt','sell','price','close_day','site'].indexOf(c)>=0||(t==='lines'&&c==='no')) v=(v===''||v==null)?(c==='no'?null:0):(+v||0);
    else if(c==='qty') v=(v===''||v==null)?0:(+v||0);
    else if(v===null) v='';
    row[c]=v; });
  return row;
}

async function fetchAll(t,select){
  const out=[]; let from=0; const step=1000;
  for(;;){ const {data,error}=await sb.from(t).select(select||'*').range(from,from+step-1); if(error)throw error; out.push(...(data||[])); if(!data||data.length<step)break; from+=step; }
  return out;
}
async function dbLoad(){
  const [cases,procs,lines,orders,vendors,clients,prices,recv,paid,off,settings]=await Promise.all([
    fetchAll('cases'),fetchAll('procs'),fetchAll('lines'),fetchAll('orders'),fetchAll('vendors'),fetchAll('clients'),fetchAll('prices'),
    fetchAll('receipts'),fetchAll('payments'),fetchAll('days_off'),fetchAll('settings')]);
  DB={cases:cases.map(r=>rowToRec('cases',r)),procs:procs.map(r=>rowToRec('procs',r)),lines:lines.map(r=>rowToRec('lines',r)),
      orders:orders.map(r=>rowToRec('orders',r)),vendors:vendors.map(r=>rowToRec('vendors',r)),clients:clients.map(r=>rowToRec('clients',r)),
      prices:prices.map(r=>rowToRec('prices',r)),
      recv:{},paid:{},off:{},basis:'完工',seed:'db',seq:0,pseq:0,lseq:0,oseq:0,prseq:0};
  recv.forEach(r=>{DB.recv[r.client+'|'+r.month]=r.amount;});
  paid.forEach(r=>{DB.paid[r.who+'|'+r.month]=r.amount;});
  off.forEach(r=>{(DB.off[r.who]=DB.off[r.who]||{})[r.month]=(r.days||[]).slice();});
  settings.forEach(r=>{ if(r.key==='basis')DB.basis=r.value; });
  /* 案件は新しいものが上。採番は既存の最大＋1 から */
  DB.cases.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  const mx=(arr,re)=>arr.reduce((m,r)=>{const k=re.exec(String(r.id)); return k?Math.max(m,+k[1]):m;},0);
  DB.seq=mx(DB.cases,/^[CRN](\d+)/); DB.pseq=mx(DB.procs,/^[PQ](\d+)/); DB.lseq=mx(DB.lines,/^L(\d+)/); DB.prseq=mx(DB.prices,/^PR(\d+)/);
  migrate(); rememberAll();
  M.senzoku.length=0; DB.vendors.filter(v=>v.type==='専属').forEach(v=>M.senzoku.push(v.name));

}

/* ---- 保存：変わった行だけ ---- */
function save(){ dbSaveSoon(); }
function dbSaveSoon(){ dbDirty=true; clearTimeout(dbSaveTimer); dbSaveTimer=setTimeout(dbSaveNow,400); }
async function dbSaveNow(){
  if(!sb||!dbDirty)return; if(dbBusy){dbSaveSoon();return;}
  dbBusy=true; dbDirty=false;
  try{
    /* 画面側で id 無しで作られたマスタ行に id を振る */
    (DB.vendors||[]).forEach(v=>{ if(!v.id)v.id='V'+Math.random().toString(36).slice(2,10); });
    (DB.clients||[]).forEach(c=>{ if(!c.id)c.id='CL'+Math.random().toString(36).slice(2,10); });
    for(const t of Object.keys(COLS)){
      const arr=DB[t]||[], seen=new Set(), ups=[], dels=[];
      const after=[];
      arr.forEach(r=>{ if(!r.id)return; seen.add(r.id); const k=t+':'+r.id, sg=sig(r); if(recLast[k]!==sg){ ups.push(recToRow(t,r)); after.push([k,sg]); } });
      Object.keys(recLast).forEach(k=>{ if(k.indexOf(t+':')!==0)return; const id=k.slice(t.length+1); if(!seen.has(id))dels.push(id); });
      if(dels.length){ const {error}=await sb.from(t).delete().in('id',dels); if(error)throw error; dels.forEach(id=>delete recLast[t+':'+id]); alog('del '+t,dels.length); }
      for(let i=0;i<ups.length;i+=200){ const {error}=await sb.from(t).upsert(ups.slice(i,i+200),{onConflict:'id'}); if(error)throw error; }
      after.forEach(([k,sg])=>{recLast[k]=sg;});     /* 成功してから「保存済み」にする（失敗分は次回また書く） */
      if(ups.length)alog('upsert '+t,ups.length);
    }
    const kv=JSON.stringify(kvObj());
    if(kv!==kvLast){
      const recv=Object.entries(DB.recv||{}).map(([k,v])=>{const [client,month]=k.split('|'); return {org:ORG,client,month,amount:+v||0};});
      const paid=Object.entries(DB.paid||{}).map(([k,v])=>{const [who,month]=k.split('|'); return {org:ORG,who,month,amount:+v||0};});
      const off=[]; Object.entries(DB.off||{}).forEach(([who,m])=>Object.entries(m||{}).forEach(([month,days])=>off.push({org:ORG,who,month,days:(days||[]).map(Number)})));
      if(recv.length){const {error}=await sb.from('receipts').upsert(recv); if(error)throw error;}
      if(paid.length){const {error}=await sb.from('payments').upsert(paid); if(error)throw error;}
      if(off.length){const {error}=await sb.from('days_off').upsert(off); if(error)throw error;}
      const {error}=await sb.from('settings').upsert({org:ORG,key:'basis',value:DB.basis||'完工'}); if(error)throw error;
      kvLast=kv;
    }
    dbState='保存した '+new Date().toTimeString().slice(0,5);
  }catch(e){
    dbDirty=true; dbState='保存できていない：'+String((e&&e.message)||e); alog('save ERR',(e&&e.message)||e);
    toast('保存に失敗した（'+String((e&&e.message)||e)+'）。もう一度操作するか、再読み込みしてください');
  }finally{ dbBusy=false; }
  const el=document.getElementById('dbState'); if(el)el.textContent=dbState;
}

let rtChan=null;
function dbSubscribe(){
  if(!sb||rtChan)return;
  rtChan=sb.channel('ledger');
  Object.keys(COLS).forEach(t=>{
    rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},payload=>{
      const arr=DB[t]||[];
      if(payload.eventType==='DELETE'){ const id=payload.old&&payload.old.id; const i=arr.findIndex(r=>r.id===id); if(i>=0){arr.splice(i,1); delete recLast[t+':'+id]; renderIdle();} return; }
      const rec=rowToRec(t,payload.new); const k=t+':'+rec.id, sg=sig(rec);
      if(recLast[k]===sg)return;                       /* 自分の書き込みの反射 */
      const i=arr.findIndex(r=>r.id===rec.id);
      if(i>=0){ const l=arr[i]; Object.keys(l).forEach(x=>delete l[x]); Object.assign(l,rec); } else { if(t==='cases')arr.unshift(rec); else arr.push(rec); }
      recLast[k]=sg; renderIdle();
    });
  });
  rtChan.subscribe(st=>{ alog('realtime',st); });
}

/* 発注先の改名：工程・明細・発注・単価表の参照も追随 */
function renameVendor(old,nw){
  if(!old||!nw||old===nw)return;
  DB.procs.forEach(p=>{if(p.who===old)p.who=nw;});
  (DB.lines||[]).forEach(l=>{if(l.who===old)l.who=nw;});
  (DB.orders||[]).forEach(o=>{if(o.who===old)o.who=nw;});
  (DB.prices||[]).forEach(x=>{if(x.who===old)x.who=nw;});
  if(DB.off&&DB.off[old]){DB.off[nw]=DB.off[old]; delete DB.off[old];}
}
/* 顧客の改名：案件・単価表・入金の記録も追随 */
function renameClient(old,nw){
  if(!old||!nw||old===nw)return;
  DB.cases.forEach(x=>{if(x.client===old)x.client=nw;});
  (DB.prices||[]).forEach(x=>{if(x.client===old)x.client=nw;});
  ['recv','paid'].forEach(k=>{const o=DB[k]||{}; Object.keys(o).forEach(key=>{ if(key.indexOf(old+'|')===0){o[nw+key.slice(old.length)]=o[key]; delete o[key];} });});
}

const KORDER=['内装','水道設備','電気設備','リペア補修','清掃','鍵交換','AW検査'];
function needKinds(c){
  const t=[c.memo||'', c.items||''].join(' ');
  let out=[];
  KIND_RULES.forEach(([k,re])=>{ if(re.test(t)&&out.indexOf(k)<0)out.push(k); });
  if(c.keyx==='有'&&out.indexOf('鍵交換')<0)out.push('鍵交換');   /* 発注書に鍵交換の記載あり */
  if(!out.length){ if(c.kind==='清掃のみ')out.push('清掃'); else if(c.kind==='鍵交換')out.push('鍵交換'); }
  if(out.length&&out.indexOf('清掃')<0&&c.kind!=='鍵交換')out.push('清掃');
  if(out.length&&out.indexOf('AW検査')<0)out.push('AW検査');
  return KORDER.filter(k=>out.indexOf(k)>=0);
}

/* ---- 締日サイクル ---- */
const eom=(y,m)=>new Date(y,m,0).getDate();
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const termOf=c=>clientOf(c)||{close:31,site:30};
const vtermOf=v=>vendorOf(v)||{close:30,site:30};
const isEom=t=>(+t.close||31)>=28;
/** 締め月 m（例 2026-10）の対象期間 [from,to] */
function cycle(client,m){
  const t=termOf(client), y=+m.slice(0,4), mo=+m.slice(5,7);
  if(isEom(t)) return [iso(y,mo,1),iso(y,mo,eom(y,mo))];
  const py=mo===1?y-1:y, pm=mo===1?12:mo-1;
  return [iso(py,pm,Math.min(+t.close+1,eom(py,pm))), iso(y,mo,Math.min(+t.close,eom(y,mo)))];
}
/** 入金予定日＝翌月末＋（サイト−30）日。いまの請求一覧の式と同じ */
function dueOf(client,m){
  const t=termOf(client), y=+m.slice(0,4), mo=+m.slice(5,7);
  const d=new Date(y,mo+1,0); d.setDate(d.getDate()+Math.max(0,(+t.site||30)-30));
  return fmtD(d);
}
/** 計上基準に応じて、この案件がどの締め月に乗るか */
function cycMonth(c){
  if(DB.basis==='請求') return ym(c.bill);
  const d=c.done||c.plan||''; if(!d||d<'2020')return '';
  const t=termOf(c.client); if(isEom(t)) return d.slice(0,7);
  let y=+d.slice(0,4), mo=+d.slice(5,7);
  if(+d.slice(8,10)>+t.close){mo++; if(mo>12){mo=1;y++;}}
  return `${y}-${String(mo).padStart(2,'0')}`;
}
const basisLabel=()=>DB.basis==='完工'?'完工日':'請求月';

let toastT=null;
function toast(msg,fn,label){
  const old=document.getElementById('toast'); if(old)old.remove();
  const el=document.createElement('div'); el.id='toast'; el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(fn){const b=document.createElement('button');b.textContent=label||'元に戻す';b.onclick=()=>{el.remove();fn();};el.appendChild(b);}
  document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),6000);
}

/* ================= 検証 ================= */
function issues(){
  const out=[]; const B=byId(); const seen={};
  DB.cases.forEach(c=>{
    const cost=costOf(c.id), sales=salesOf(c), ps=procsOf(c.id);
    if(sales>0&&cost===0) out.push({k:'原価なし',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} に対して発注が1件も入っていない。粗利が過大に出る`});
    if(sales>0&&cost>sales) out.push({k:'赤字',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} ＜ 原価 ${yen(cost)}（${yen(cost-sales)} の持ち出し）`});
    if(sales>0&&!c.bill) out.push({k:'請求月なし',c:c.id,t:`${c.prop}`,d:`売上 ${yen(sales)} が請求一覧に出てこない`});
    if(!c.done&&(c.bill||salesOf(c)>0)) out.push({k:'完工日なし',c:c.id,t:`${c.prop}`,
      d:'完工基準にしたので、完工日が入らないと売上がどの月にも乗らない'});
    if(c.client&&!isClient(c.client)) out.push({k:'顧客マスタ外',c:c.id,t:`${c.prop}`,d:`「${c.client}」は顧客マスタに無い`});
    if(c.want&&c.plan&&c.plan>c.want&&!c.done) out.push({k:'希望日に遅れる',c:c.id,t:`${c.prop}`,
      d:`依頼元の希望 ${md(c.want)} に対して、弊社の完了予定が ${md(c.plan)}`});
    if(c.live&&(c.ord||'未')==='未'&&!c.want) out.push({k:'希望日なし',c:c.id,t:`${c.prop}`,
      d:'依頼元の完了希望日が入っていない。工程を組む順番が決められない'});
    if(c.keyx==='有'&&!procsOf(c.id).some(p=>p.kind==='鍵交換')&&!c.done)
      out.push({k:'鍵交換の手配なし',c:c.id,t:`${c.prop}`,
        d:'発注書に鍵交換の記載があるのに、鍵交換の工程が入っていない'});
    if(c.done&&(c.done<'2020-01-01'||c.done>'2030-01-01'))
      out.push({k:'完工日が壊れている',c:c.id,t:`${c.prop}`,d:`完工日が「${c.done}」。手入力のミスがそのまま残っている`});

    ps.forEach(p=>{
      if(p.who&&!isVendor(p.who)) out.push({k:'発注先マスタ外',c:c.id,t:`${c.prop}`,d:`「${p.who}」は発注先マスタに無い。支払一覧・支払通知書に出ない`});
      if(p.who&&!p.date) out.push({k:'予定日なし',c:c.id,t:`${c.prop}`,d:`${p.who} の${p.kind}に予定日が入っていない`});
      if(p.who&&!p.amt&&!isInsp(p.kind)) out.push({k:'金額なし',c:c.id,t:`${c.prop}`,d:`${p.who} の${p.kind}に発注金額が入っていない`});
    });
    const k=ps.filter(p=>isSeko(p.kind)&&p.date), s=ps.filter(p=>p.kind==='清掃'&&p.date);
    const v=ps.filter(p=>isInsp(p.kind)&&p.date);
    if(k.length&&s.length){
      const lk=k.map(endOf).sort().pop(), fs=s.map(p=>p.date).sort()[0];
      if(fs<lk) out.push({k:'順序',c:c.id,t:`${c.prop}`,d:`清掃 ${md(fs)} が工事 ${md(lk)} より前（先行清掃なら正常）`});
    }
    if(s.length&&v.length){
      const ls=s.map(endOf).sort().pop(), fv=v.map(p=>p.date).sort()[0];
      if(fv<ls) out.push({k:'順序',c:c.id,t:`${c.prop}`,d:`AW検査 ${md(fv)} が清掃 ${md(ls)} より前`});
    }
    ps.forEach(p=>{ if(p.kind&&PKINDS.indexOf(p.kind)<0)
      out.push({k:'区分が旧のまま',c:c.id,t:`${c.prop}`,d:`「${p.kind}」は旧区分。内装／水道設備／電気設備／リペア補修 のどれかに直す`}); });
    const key=(c.prop||'').replace(/[\s　・（）()]/g,'').toLowerCase();
    if(key){ if(seen[key]) out.push({k:'物件名重複',c:c.id,t:`${c.prop}`,d:`同じ物件名の案件が他にもある（${seen[key]}）。二重計上でないか確認`}); else seen[key]=c.id; }
  });
  // 休みの日に手配が入っている（10月のみ休みデータあり）
  DB.procs.forEach(p=>{
    if(!p.who||!p.date)return;
    const hit=spanDays(p).find(d=>isOff(p.who,d));
    if(hit)
      out.push({k:'休みに手配',c:p.case,t:`${p.who} ${md(hit)}`,
        d:`スケジュール管理では休みの日に、台帳では ${(B[p.case]||{}).prop||'現場'} の${p.kind}が入っている`});
  });
  // 同一職人が同日2現場
  const slot={};
  DB.procs.forEach(p=>{ if(!p.who||!p.date||SEN.indexOf(p.who)<0||isInsp(p.kind))return;
    spanDays(p).forEach(d=>{const k=p.who+'|'+d; (slot[k]=slot[k]||[]).push(p);}); });
  Object.entries(slot).forEach(([k,ps])=>{ if(ps.length<2)return;
    const [who,d]=k.split('|');
    if(new Set(ps.map(p=>p.case)).size<2)return;
    out.push({k:'1日2現場',c:ps[0].case,t:`${who} ${md(d)}`,d:ps.map(p=>(B[p.case]||{}).prop).join(' ／ ')});
  });
  return out;
}

/* ================= 受注受付の取り込み =================
   叩き台「受注受付」の行を、Claudeの定期タスクが inbox に書く。
   この画面は inbox を読んで、まだ台帳に無い分だけ案件にする。 */
let INBOX=null, inboxMsg='', PRICEIN=[];
async function openInbox(){ /* v4：ログイン後に boot() が呼ぶ */ }
async function reloadInbox(){
  if(!sb||!SESSION)return;
  try{
    const rows=await fetchAll('inbox');
    INBOX=rows.map(r=>({_id:r.key,key:r.key,caseNo:r.case_no,client:r.client,orderNo:r.order_no,prop:r.prop,room:r.room,propCode:r.prop_code,
      recvDate:r.recv_date||'',net:r.net,tax:r.tax,gross:r.gross,estimate:r.estimate,plan:r.plan||'',moveIn:r.move_in||'',cancel:r.cancel||'',
      memo:r.memo,items:r.items,url:r.url,poLines:r.po_lines||undefined}));

    try{ autoMergeInbox(); }catch(e){}
  }catch(e){ INBOX=[]; inboxMsg='受注受付を読めなかった：'+String((e&&e.message)||e); }
  render();
}
const nkey=s=>{let t=String(s||''); try{t=t.normalize('NFKC');}catch(e){} return t.replace(/[\s　・（）()＜＞<>　＿_-]/g,'').toLowerCase();};   /* 全角英数も半角に寄せて比べる */
function inboxKind(t){
  const s=String(t||'');
  if(/鍵交換|シリンダー/.test(s))return '鍵交換';
  if(/入居中/.test(s))return '入居中修繕';
  for(const k of ['内装','水道設備','電気設備','リペア補修'])
    if((KIND_RULES.find(r=>r[0]===k)||[])[1].test(s))return '工事一式';
  if(/清掃|クリーニング|洗浄/.test(s))return '清掃のみ';
  return 'その他';
}
function pendingInbox(){
  if(!INBOX)return [];
  return INBOX.filter(r=>r.key&&!DB.cases.some(c=>c.recv===r.key));
}

/* 単価表のうち、まだマスタに入っていないもの */

  return PRICEIN.filter(r=>!DB.prices.some(p=>priceKey(p.name)===priceKey(r.name)
    &&(p.unit||'式')===(r.unit||'式')&&(p.client||'')===(r.client||'')));

/* 受注受付1行の情報を既存案件に流し込む。空欄だけ埋める（手で直した値は守る） */
const inboxProp=r=>[r.prop||'',r.room||''].filter(Boolean).join(' ').trim();
const inboxMemo=r=>[r.memo||'', r.moveIn?('次回入居 '+r.moveIn):'', r.items?('削除/追加 '+r.items):''].filter(Boolean).join(' / ');
function mergeInboxRow(r,c){
  const memo=inboxMemo(r);
  c.recv=r.key; c.live=true;
  if(!c.client&&r.client)c.client=r.client;
  if(!c.sales&&+r.net)c.sales=+r.net;
  if(!c.want&&r.plan)c.want=r.plan;
  if(!c.kisan&&r.moveIn)c.kisan=r.moveIn;   /* 次回入居日＝家賃の起算。財託は空で入ってくる */
  if(/鍵交換/.test(memo))c.keyx='有';
  if(/設備保証/.test(memo))c.warr='有';
  if(!c.bill&&r.recvDate)c.bill=r.recvDate.slice(0,7)+'-01';
  if(memo&&(c.memo||'').indexOf(memo)<0)c.memo=[c.memo||'',memo].filter(Boolean).join(' / ');
  c.items=r.items||c.items||'';
}
/* 合流先の候補。過去の完工済みには合流させない（同じ部屋の2回目が前回に吸われるのを防ぐ） */
function inboxMatch(r,exactOnly){
  const byRecv=DB.cases.find(x=>x.recv===r.key); if(byRecv)return byRecv;
  const key=nkey(inboxProp(r))||nkey(r.prop); if(!key)return null;
  const cand=DB.cases.filter(x=>x.live&&!x.done&&!x.recv);
  return cand.find(x=>nkey(x.prop)===key)
      ||(exactOnly?null:cand.find(x=>{const k=nkey(x.prop); return k&&k.length>=4&&(k.indexOf(key)>=0||key.indexOf(k)>=0);}))
      ||null;
}
/* 起動時：物件名がぴったり一致する運用中の案件には自動で合流する。新規作成は人がボタンで */
/* 依頼元の明細が二重に入っている案件を直す（以前の版の同期の穴で、入れ直した分が積み上がったもの）。
   依頼元の行数より多ければ、いちばん新しい取り込み（id の番号が大きい方）だけ残して、残りに墓標を立てる */
function healPO(cid){
  const want=poRowsOf(cid).length; if(!want)return 0;
  const rows=poLinesOf(cid).filter(l=>!l.order); if(rows.length<=want)return 0;
  const keep=new Set(rows.slice().sort((a,b)=>lnum(b.id)-lnum(a.id)||String(b.id).localeCompare(String(a.id))).slice(0,want).map(l=>l.id));
  const drop=rows.filter(l=>!keep.has(l.id)); if(!drop.length)return 0;
  DB.lines=DB.lines.filter(l=>keep.has(l.id)||!(l.case===cid&&l.src==='PO'&&!l.order));
  purgeShared('lines',drop.map(l=>l.id));
  return drop.length;
}
function healAllPO(){
  let n=0, cs=0; DB.cases.forEach(c=>{ if(!c.recv)return; const d=healPO(c.id); if(d){n+=d;cs++;} });
  if(n){ save(); toast(`二重に入っていた依頼元の明細 ${n}行（${cs}案件）を片づけた`); }
  return n;
}
function autoMergeInbox(){
  healAllPO();
  const rows=pendingInbox().filter(r=>inboxMatch(r,true));
  if(!rows.length)return 0;
  snap();
  rows.forEach(r=>mergeInboxRow(r,inboxMatch(r,true)));
  save();
  toast(`受注受付 ${rows.length}件を、同じ物件名の案件に自動で合流させた（金額・起算日・希望日・明細）`, undo);
  return rows.length;
}
function importInbox(){
  const rows=pendingInbox(); if(!rows.length){toast('新しい行は無い');return;}
  snap();
  let add=0, mrg=0;
  rows.forEach(r=>{
    const prop=inboxProp(r);
    const memo=inboxMemo(r);
    let c=inboxMatch(r,false);
    if(c){
      mergeInboxRow(r,c);
      mrg++;
    }else{
      DB.seq++;

/* ================= 発注 =================
   業者の見積を原価明細に落とす → 行を選んで業者ごとに発注する。
   コンクルーとの違い：見積フェーズなし／列は半分／工事内容は明細から自動 */
const OSTS=['下書き','送付済','承諾','完了','請求済'];
const OLSORTS=['工期が近い順','起算日が近い順','完了希望日が近い順','発注日が早い順','発注No順'];
const OSTC={'下書き':'','送付済':'wip','承諾':'wip','完了':'done','請求済':'done'};
const UNITS=['式','m','㎡','枚','個','箇所','台','本','日','人工'];
const lineAmt=l=>Math.round((+l.qty||0)*(+l.price||0));   /* 原価（業者に払う） */
const lineSell=l=>Math.round((+l.qty||0)*(+l.sell||0));   /* 販売（依頼元からもらう） */
const lnum=id=>{const m=/^L(\d+)/.exec(String(id||'')); return m?+m[1]:0;};
/* 明細は依頼元の行番号（no）の順、無ければ作った順（id の番号）。共有保存は id のハッシュで箱分けしているので、読んだままだと順が崩れる */
const lineKey=l=>(l.no!=null&&l.no!==''?+l.no:1e9+lnum(l.id));
const linesOf=cid=>DB.lines.filter(l=>l.case===cid).sort((a,b)=>lineKey(a)-lineKey(b)||String(a.id).localeCompare(String(b.id)));
const ordersOf=cid=>DB.orders.filter(o=>o.case===cid);
const orderLines=oid=>DB.lines.filter(l=>l.order===oid);
const orderAmt=o=>orderLines(o.id).reduce((a,l)=>a+lineAmt(l),0);
/* kintoneは半角カタカナ（ｸﾛｽ・ｺｰｷﾝｸﾞ）なので、全角に直してから判定する */
const wide=s=>{try{return String(s||'').normalize('NFKC');}catch(e){return String(s||'');}};
/* 工程ではない行（経費・自社取り分）。区分は空のままにして、人に決めてもらう */
const NOKIND=/諸経費|写真撮影|撮影費|消臭|仮設照明|運搬|駐車|産廃|廃棄物処理費|管理費/;
function guessKind(name){
  const t=wide(name);
  if(NOKIND.test(t))return '';
  if(/コーキング|シーリング打替|菊割れ|パッキン/.test(t))
    return /菊割れ|パッキン|排水/.test(t)?'水道設備':'リペア補修';
  if(/網戸|面格子|サッシ|レール交換/.test(t))return 'リペア補修';
  for(let i=0;i<KIND_RULES.length;i++){ if(KIND_RULES[i][1].test(t))return KIND_RULES[i][0]; }
  return '';
}
const SAMPLE='【追加】洗面扉パテ処理\t1\t式\t8,000\t扉交換しない場合\n'+
  '洗濯置扉交換(枠ごと)\t1\t式\t71,000\t折れ戸タイプ\n'+
  'ボード下地調整\t1\t式\t20,000\t2箇所\n'+
  '浴室乾燥機交換(手間)\t1\t式\t20,000\tBS-763H2→BS-133HM-2\n'+
  '【追加】洗面扉シート貼り(表裏)\t5\tm\t6,000\t片面2.5㎡の裏表';
function parseLines(txt){
  return String(txt||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s0=>{
    /* 桁区切りのカンマは先に外す（8,000 が 8 と 000 に割れるのを防ぐ） */
    const s=s0.replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
    const c=s.split(/\t|,|、|\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
    const name=c[0]||''; let qty=1,unit='式',price=0,memo='';
    const nums=[];
    c.slice(1).forEach(x=>{const v=+String(x).replace(/[,¥￥円\s]/g,'');
      if(/\d/.test(x)&&!isNaN(v))nums.push(v);});
    if(nums.length>=2){qty=nums[0];price=nums[nums.length-1];}
    else if(nums.length===1){price=nums[0];}
    const u=c.find(x=>UNITS.indexOf(x)>=0); if(u)unit=u;
    const tail=c[c.length-1];
    if(tail&&tail!==name&&tail!==unit&&!/^[\d,¥￥円\s.]+$/.test(tail))memo=tail;
    return {name,qty,unit,price,memo};
  }).filter(r=>r.name);
}
function addLines(cid,rows,noSnap){
  if(!noSnap)snap();
  rows.forEach(r=>{DB.lseq++;
    const q=(r.qty===''||r.qty==null)?1:(+r.qty||0);   /* 数量0は0のまま（＝見積のみで発注されなかった行） */
    DB.lines.push({id:'L'+DB.lseq+DEV,case:cid,name:r.name,spec:r.spec||'',qty:q,unit:r.unit||'式',no:(r.no!=null?r.no:DB.lseq),
      sell:+r.sell||0,price:+r.price||0,kind:r.kind||'',who:'',memo:r.memo||'',   /* 区分は自動で当てない。人が「区分をつける」で決める */
      cut:r.cut?1:0,src:r.src||'',order:''});});
  save();
}
/* 依頼元の発注書（kintoneの見積テーブル／ANDPADの発注書）の明細を入れる。販売価格として入る */
function poRowsOf(cid){
  const c=DB.cases.find(x=>x.id===cid); if(!c||!c.recv||!INBOX)return [];
  const d=INBOX.find(r=>r.key===c.recv);
  return (d&&Array.isArray(d.poLines))?d.poLines:[];
}
/* 依頼元に落とされた行。cut フラグが本命。古いデータ用に数量0も拾う */
const isCut=r=>!!r.cut||!(+r.qty>0);
const poLive=rows=>rows.filter(r=>!isCut(r));
const poCut =rows=>rows.filter(r=>isCut(r));
const poLinesOf=cid=>DB.lines.filter(l=>l.case===cid&&l.src==='PO');
function importPO(cid){
  const all=poRowsOf(cid);
  if(!all.length){toast('依頼元の明細が来ていない');return;}
  /* 2回目以降は「入れ直し」：発注に出していない取り込み行を消してから入れる。発注済の行はそのまま */
  healPO(cid);
  const had=poLinesOf(cid), keep=had.filter(l=>l.order);
  snap();
  if(had.length){ const ids=had.filter(l=>!l.order).map(l=>l.id); DB.lines=DB.lines.filter(l=>!(l.case===cid&&l.src==='PO'&&!l.order)); purgeShared('lines',ids); }
  /* 古い版で入れた同じ行（src が無い）も、依頼元の行と名称・場所が同じなら消して入れ直す */
  const poKey=new Set(all.map(r=>(r.name||'')+'|'+(r.place||'')));
  DB.lines=DB.lines.filter(l=>!(l.case===cid&&!l.order&&!l.src&&poKey.has((l.name||'')+'|'+(l.spec||''))));
  const dup=r=>keep.some(l=>l.name===(r.name||'')&&(l.spec||'')===(r.place||''));
  /* 落とされた行も明細に入れる。数量0・金額0で、発注には出せない形にする */
  const rows=all.map((r,i)=>[r,i]).filter(([r])=>!dup(r)).map(([r,i])=>{const c=isCut(r);
    return {name:r.name||'', spec:r.place||'', qty:c?0:r.qty, unit:r.unit||'式', no:i+1,
      sell:c?0:r.price, price:0, memo:r.memo||'', cut:c?1:0, src:'PO'};});
  addLines(cid, rows, true);
  render();
  const z=rows.filter(r=>r.cut).length;
  toast(`${had.length?'依頼元の明細を入れ直した':'依頼元の明細を入れた'}（${rows.length}行${z?`、うち${z}行は依頼元が落とした項目`:''}${keep.length?`。発注済の${keep.length}行はそのまま`:''}）`, undo);
}

async function createOrder(cid,ids,f,quiet){
  const c=DB.cases.find(x=>x.id===cid);
  if(!quiet)snap();
  const n=await allocOrderNo();
  const oid='O'+n+DEV, no='AW-H'+String(n).padStart(4,'0');
  const amt=DB.lines.filter(l=>ids.indexOf(l.id)>=0).reduce((a,l)=>a+lineAmt(l),0);
  DB.orders.push({id:oid,no,case:cid,who:f.who,kind:f.kind,start:f.start,end:f.end,due:f.due,
    naiyo:f.naiyo,memo:f.memo,st:'下書き',sent:'',
    name:`${c?c.prop||'':''} ${f.kind}_${f.who||'業者未定'}`.trim()});
  DB.lines.forEach(l=>{ if(ids.indexOf(l.id)>=0){l.order=oid;l.who=f.who;l.kind=f.kind;} });
  /* 「工程を組む」で作った工程があればそれに紐づける（期間を直していればそちらを正にする）。無ければ新しく1本作る */
  const p=f.proc?DB.procs.find(x=>x.id===f.proc&&x.case===cid&&!x.order):null;
  if(p){ p.order=oid; p.who=f.who; p.kind=f.kind; p.date=f.start; p.end=f.end; p.amt=Math.round(amt*1.1); }
  else { DB.pseq++;
    DB.procs.push({id:'Q'+DB.pseq+DEV,case:cid,kind:f.kind,who:f.who,date:f.start,end:f.end,
      amt:Math.round(amt*1.1),month:'',prog:'',order:oid,auto:1}); }
  recalcPlan(c);
  oSel={}; if(quiet)return; save(); render();
  toast(p?`${no} を作って、工程（${f.kind}／${f.who||'業者未定'}）に紐づけた`
         :`${no} を作った。工程も1本できた（${f.kind}／${f.who||'業者未定'}）`, undo);
}
/* 完了予定日＝最後の工程の日。工程が1本も無ければ今の値を残す。完工済みは触らない */
function recalcPlan(c){
  if(!c||c.done||c.planManual)return;   /* 手で入れた完了予定は工程で上書きしない */
  const d=lastDayOf(procsOf(c.id)); if(d)c.plan=d;
}
/* 発注の送付で '済' にした案件は、送付済以上の発注が1つも無くなったら '未' に戻す。手で '済' にしたものは触らない */
function recalcOrd(c){
  if(!c||c.ordBy!=='order')return;
  const live=DB.orders.some(o=>o.case===c.id&&OSTS.indexOf(o.st)>=OSTS.indexOf('送付済'));
  if(!live){c.ord='未'; delete c.ordBy;}
}
function nextOrderSt(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  const i=OSTS.indexOf(o.st); if(i<0||i>=OSTS.length-1)return;
  snap(); o.st=OSTS[i+1];
  if(o.st==='送付済'){
    o.sent=fmtD(new Date());
    const c=DB.cases.find(x=>x.id===o.case);
    if(c){ if(c.ord!=='済')c.ordBy='order'; c.ord='済'; if(STATUS.indexOf(c.st)<STATUS.indexOf('発注書送付'))c.st='発注書送付';}}
  save(); render(); toast(`${o.no} を ${o.st} にした`, undo);
}
function delOrder(oid){
  const o=DB.orders.find(x=>x.id===oid); if(!o)return;
  snap();
  DB.lines.forEach(l=>{ if(l.order===oid)l.order=''; });
  let kept=0;
  DB.procs=DB.procs.filter(p=>{ if(p.order!==oid)return true; if(p.auto)return false; p.order=''; kept++; return true; });
  DB.orders=DB.orders.filter(x=>x.id!==oid);
  const c=DB.cases.find(x=>x.id===o.case); recalcOrd(c); recalcPlan(c);
  save(); render(); toast(`${o.no} を取り消した（明細は未発注に戻した${kept?'。工程を組むで作った工程は残してある':''}）`, undo);
}

function renderTabs(){
  /* タブの数字は運用中の案件ぶんだけ（案件単位で数える）。過去データの件数は要確認タブの中で見る */
  const B=byId(); const seen=new Set();
  issues().forEach(i=>{const c=B[i.c]; if(c&&c.live)seen.add(i.k+'|'+i.c);});
  const n=seen.size;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    `<button class="${tab===k?'on':''}" data-t="${k}">${l}${k==='check'&&n?` <span style="opacity:.75">${n}</span>`:''}</button>`).join('');
  document.getElementById('src').innerHTML=
    `運用中 ${DB.cases.filter(c=>c.live).length} 件／過去 ${DB.cases.filter(c=>!c.live).length} 件／工程 ${DB.procs.length} 件`+
    `<br><span id="dbState">${esc(dbState)}</span>`;
}

/* ================= 工程を組む ================= */
const shiftM=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)+n;
  while(mo>12){mo-=12;y++;} while(mo<1){mo+=12;y--;} return `${y}-${String(mo).padStart(2,'0')}`;};
function procMonth(c,ps){
  /* 工程の日付が無ければ、旗（完了希望→起算日→完了予定）の月を開く。それも無ければ今月 */
  const d=ps.map(p=>p.date).filter(Boolean).sort()[0]||c.want||c.kisan||c.plan||c.done||c.bill||fmtD(new Date());
  return shiftM(d.slice(0,7),pShift);
}
function vProc(){
  const DONE=DONE_ST;
  let list=DB.cases.filter(c=>
    (pFilter==='すべて'?true:
     pFilter==='発注前（未）'?(c.ord||'未')==='未':
     pFilter==='発注済・進行中'?((c.ord||'未')==='済'&&DONE.indexOf(c.st)<0):
     DONE.indexOf(c.st)>=0)&&
    (!pQ||(c.prop+c.client).toLowerCase().includes(pQ.toLowerCase())));
  list=sortCases(list,pSort);
  // 選んでいる案件は、工程を足して絞り込みから外れても一覧に残す
  const sel=pCase?DB.cases.find(x=>x.id===pCase):null;
  if(sel){ if(!list.some(c=>c.id===pCase)) list=[sel,...list]; }
  else pCase=(list[0]||{}).id||null;
  const c=DB.cases.find(x=>x.id===pCase);
  const mi=DB.cases.filter(x=>(x.ord||'未')==='未').length;
  const noP=DB.cases.filter(x=>(x.ord||'未')==='未'&&!procsOf(x.id).length).length;
  const left=`<div class="cases">${list.slice(0,300).map(x=>`
    <button class="ci ${pCase===x.id?'sel':''}" data-pc="${x.id}">
      <span class="cl" style="background:${col(x.client)}">${esc(x.client||'—')}</span>
      <b>${esc(x.prop||'（物件未入力）')}</b>
      <small>${(x.ord||'未')==='未'?'<span class="nf">発注 未</span>　':''}${esc(x.kind)}　${
        procsOf(x.id).length?procsOf(x.id).length+'工程':'<span class="nf">工程なし</span>'}</small>
      <small><i class="fdot r"></i>${x.kisan?md(x.kisan):'—'}　<i class="fdot b"></i>${x.want?md(x.want):'—'}　<i class="fdot y"></i>${
        x.plan?md(x.plan):'—'}</small></button>`).join('')||'<p class="note">該当なし</p>'}
    ${list.length>300?'<p class="note">先頭300件</p>':''}</div>`;
  const idx=list.findIndex(x=>x.id===pCase);
  const nav=pHide?`<button class="btn small" id="pPrevCase" ${idx>0?'':'disabled'}>◀ 前の案件</button>
      <span class="note" style="margin:0">${idx>=0?(idx+1)+' / '+list.length:'—'}</span>
      <button class="btn small" id="pNextCase" ${idx>=0&&idx<list.length-1?'':'disabled'}>次の案件 ▶</button>`:'';
  return `<div class="bar"><h2>工程を組む</h2>
      <button class="btn small" id="pHide" title="${pHide?'左の一覧を出す':'左の一覧を隠して工程表を広く使う'}">${pHide?'▶ 一覧を出す':'◀ 一覧を隠す'}</button>
      <select id="pFilter" title="案件の絞り込み">${optsL(['発注前（未）','発注済・進行中','完工済','すべて'],pFilter,
        {'すべて':'案件：すべて'})}</select>
      <select id="pSort" title="並び替え">${optsL(SORTS,pSort,{})}</select>
      <input type="search" id="pQ" placeholder="物件名で探す" value="${esc(pQ)}" style="min-width:170px">
      ${nav}
      <span class="note" style="margin:0">発注前（未） <b style="color:var(--warn)">${mi}件</b>／うち工程が1つも無い ${noP}件
        <br>2026発注手配・完工予定（9月タブ）の発注列が「未」の行を取り込んである</span></div>
    <div class="layout">${pHide?'':left}<div class="main">${c?procPanel(c):'<div class="card">'+(pHide?'該当する案件がない。絞り込みか検索を変える。':'左で案件を選ぶ。')+'</div>'}</div></div>`;
}
/* 工程表に立てる旗：起算日＝赤、依頼元の完了希望日＝青、弊社の完了予定日＝黄 */
const FLAGS=[['kisan','起算日','r'],['want','完了希望','b'],['plan','完了予定','y']];
const flagsOn=(c,ds)=>FLAGS.filter(f=>c[f[0]]&&c[f[0]]===ds);
const flagHtml=(c,ds)=>flagsOn(c,ds).map(f=>`<span class="ftag ${f[2]}" title="${f[1]} ${md(ds)}">${f[1]}</span>`).join('');
const flagCls=(c,ds)=>flagsOn(c,ds).map(f=>'fd-'+f[2]).join(' ');
function flagLine(c,m){
  return `<div class="flagline">${FLAGS.map(f=>{const v=c[f[0]];
    return `<span class="fi"><span class="ftag ${f[2]}${v?'':' off'}">${f[1]}</span>${
      v?`<b>${md(v)}</b>${ym(v)!==m?`<button class="btn small" data-pjump="${v.slice(0,7)}" title="その月の工程表へ">${+v.slice(5,7)}月へ</button>`:''}`
       :'<span class="note" style="margin:0">—</span>'}</span>`;}).join('')}
    <span class="note" style="margin:0 0 0 auto">発注が届くと自動で立つ。日付は案件台帳で直せる</span></div>`;
}
function procPanel(c){
  const ps=procsOf(c.id).slice().sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  const m=procMonth(c,ps), D=daysIn(m), y=+m.slice(0,4), mo=+m.slice(5,7);
  const sales=salesOf(c), cost=costOf(c.id);
  const head=`<tr><th class="nm">工程</th>${Array.from({length:D},(_,i)=>{
    const d=i+1,w=new Date(y,mo-1,d).getDay(), ds=iso(y,mo,d);
    return `<th class="${w===6?'sat':w===0?'sun':''} ${flagCls(c,ds)}"><b>${d}</b><small>${WD[w]}</small>${flagHtml(c,ds)}</th>`;}).join('')}</tr>`;
  const body=ps.map(p=>{
    const off=new Set(SEN.indexOf(p.who)>=0?offDays(p.who,m):[]);
    const tds=Array.from({length:D},(_,i)=>{
      const d=i+1, ds=iso(y,mo,d), on=onDay(p,ds), first=p.date===ds;
      const busy=!on&&p.who&&!isInsp(p.kind)&&clash(p.id,p.who,[ds]);
      const pend=pendStart&&pendStart.pid===p.id&&pendStart.day===ds;
      const cls=['pc',off.has(d)?'off':'',busy?'busy':'',pend?'pending':'',flagCls(c,ds)].filter(Boolean).join(' ');
      return `<td class="${cls}" data-pid="${p.id}" data-day="${ds}">${on?
        `<button class="chip pc ${selProc===p.id?'sel':''}" draggable="true" data-p="${p.id}"
          style="background:${kcol(p.kind)}">
          <span class="p">${esc(p.kind)}${first?'':'<span class="cont">続</span>'}</span>
          <span class="y">${esc(p.who||'業者未定')}</span></button>`:''}</td>`;}).join('');
    return `<tr><th class="nm">${esc(p.kind)}<small>${esc(p.who||'業者未定')}${
      p.date?'　'+spanLabel(p):(p.memo?'　'+esc(p.memo):'')}</small></th>${tds}</tr>`;
  }).join('');
  const warn=[];
  const k=ps.filter(p=>isSeko(p.kind)&&p.date), s=ps.filter(p=>p.kind==='清掃'&&p.date);
  const v=ps.filter(p=>isInsp(p.kind)&&p.date);
  if(k.length&&s.length){const lk=k.map(endOf).sort().pop(), fs=s.map(p=>p.date).sort()[0];
    if(fs<lk)warn.push(`清掃 ${md(fs)} が工事 ${md(lk)} より前になっている`);}
  if(s.length&&v.length){const ls=s.map(endOf).sort().pop(), fv=v.map(p=>p.date).sort()[0];
    if(fv<ls)warn.push(`AW検査 ${md(fv)} が清掃 ${md(ls)} より前になっている`);}
  ps.forEach(p=>{
    if(!p.who)warn.push(`${p.kind}の業者が決まっていない`);
    else if(!p.date)warn.push(`${p.who}（${p.kind}）の日付が決まっていない`);
    else{
      const offHit=SEN.indexOf(p.who)>=0?spanDays(p).find(d=>isOff(p.who,d)):null;
      if(offHit)warn.push(`${p.who} は ${md(offHit)} が休み`);
      if(!isInsp(p.kind)&&clash(p.id,p.who,spanDays(p)))
        warn.push(`${p.who} は ${spanLabel(p)} に別の現場がある`);
    }
  });
  return `<div class="card" style="margin-bottom:10px">
      <div class="bar" style="margin:0 0 8px">
        <h3 style="font-size:16px;margin:0">${esc(c.prop||'（物件未入力）')}</h3>
        <span class="cl" style="background:${col(c.client)}">${esc(c.client||'—')}</span>
        <span class="st ${stCls(c.st)}">${esc(c.st)}</span>
        ${(c.ord||'未')==='未'?'<span class="flag">発注 未</span>':'<span class="st done">発注済</span>'}
        ${(()=>{const un=ps.filter(p=>!p.order&&!isInsp(p.kind)), ready=un.filter(p=>p.who&&p.date);
          return `<button class="btn small ${ready.length?'primary':''}" data-ocopen="${c.id}" style="margin-left:auto"
            title="${ready.length?'業者と日程が決まった工程が'+ready.length+'件ある。発注の画面でその業者・期間が最初から入る':'工程に業者と日程を入れると、発注にそのまま引き継がれる'}">発注へ →${

/* ================= 手配ボード ================= */
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function boardRows(m){
  const D=daysIn(m), B=byId();
  const names=[...SEN,...[...new Set(DB.procs.filter(p=>p.who&&SEN.indexOf(p.who)<0&&spanInMonth(p,m))
    .map(p=>p.who))]];
  return names.map(nm=>{
    const days={};
    DB.procs.filter(p=>p.who===nm&&spanInMonth(p,m)).forEach(p=>{
      spanDays(p).forEach(ds=>{ if(ym(ds)!==m)return; const d=+ds.slice(8,10); (days[d]=days[d]||[]).push(p);});});
    return {name:nm,days,off:offDays(nm,m),sen:SEN.indexOf(nm)>=0};
  });
}
function vBoard(){
  const m=bMonth, D=daysIn(m), rows=boardRows(m), B=byId();
  const y=+m.slice(0,4), mo=+m.slice(5,7);
  // 1マスに入る最大件数（3件まで同じ高さでそろえ、超えた分は「+n」）
  const MAXSLOT=3;
  let peak=1; rows.forEach(w=>{for(let d=1;d<=D;d++){const k=(w.days[d]||[]).length; if(k>peak)peak=k;}});
  const slots=Math.min(peak,MAXSLOT);
  const head=`<tr><th class="nm">職人・業者</th>${Array.from({length:D},(_,i)=>{
    const d=i+1, w=new Date(y,mo-1,d).getDay();
    return `<th class="${w===6?'sat':w===0?'sun':''}"><b>${d}</b><small>${WD[w]}</small></th>`;}).join('')}<th class="sm">稼働</th></tr>`;
  const body=rows.map(w=>{
    let n=0;
    const tds=Array.from({length:D},(_,i)=>{
      const d=i+1, ds=`${m}-${String(d).padStart(2,'0')}`, off=w.off.includes(d);
      const ps=w.days[d]||[]; n+=ps.length;
      const attr=`data-who="${esc(w.name)}" data-day="${ds}"`;
      const cls=['c',off?'off':''].filter(Boolean).join(' ');
      const show=ps.slice(0,slots), rest=ps.length-show.length;
      const inner=show.map(p=>{const c=B[p.case]||{};
        return `<button class="chip ${selProc===p.id?'sel':''}" draggable="true" data-p="${p.id}"
          style="background:${col(c.client)}">
          <span class="p">${esc(c.prop||'（物件未入力）')}${p.date===ds?'':'<span class="cont">続</span>'}</span>
          <span class="y">${esc(p.kind)}${p.amt?' '+yen(p.amt):''}</span></button>`;}).join('')
        +(rest>0?`<span class="more">＋${rest}件</span>`:'');
      return `<td class="${cls}" ${attr}>${inner}</td>`;
    }).join('');
    return `<tr><th class="nm">${esc(w.name)}<small>${w.sen?`<button class="lnk" data-off="${esc(w.name)}" title="この月の休みを入れる">休み${w.off.length}日${w.off.length?'：'+w.off.join(',') :''} ✎</button>`:'外注'}</small></th>${tds}<td class="sm">${n}</td></tr>`;
  }).join('');
  return `<div class="bar"><h2>手配ボード</h2>
      <select id="bMonth" title="表示する月">${MONTHS.map(m=>`<option value="${m}"${m===bMonth?' selected':''}>${mlab(m)}の予定</option>`).join('')}</select>
      <button class="btn small" id="undoBtn">ひとつ戻す</button>
      <span class="note" style="margin:0">データベース：Supabase（${esc(SB_URL.replace(/^https?:\/\//,''))}）　ログイン中：${esc((ME&&(ME.name||ME.email))||'')}　役割：${esc((ME&&ME.role)||'')}</span>
      <button class="btn small" id="signOut">ログアウト</button></div>
    ${location.hash==='#admin'?`<div class="card" style="margin-top:10px"><h3 style="margin:0 0 6px">旧台帳（Artifact版）からの取り込み</h3>
      <p class="note">旧台帳のマスタ画面（#admin）で「全データをコピーする」を押してから、ここに貼り付けて「取り込む」。同じ id は上書き、無いものは追加。</p>
      <textarea id="impJson" style="width:100%;height:120px;font:11px ui-monospace,monospace" placeholder="ここに貼り付け"></textarea>
      <div class="bar"><button class="btn small primary" id="impRun">取り込む</button><span id="impMsg" class="note"></span></div></div>
    <div class="card" style="margin-top:10px"><h3 style="margin:0 0 6px">診断ログ（この端末）　端末 ${esc(DEV)}　状態 ${esc(dbState)}</h3>
      <textarea readonly style="width:100%;height:260px;font:11px/1.4 ui-monospace,monospace">${esc(AWLOG.slice().reverse().map(r=>r.join('  ')).join('\n'))}</textarea></div>`:''}
    <div class="legend">${Object.keys(CC).map(k=>`<span><i style="background:${col(k)}"></i>${esc(k)}</span>`).join('')}
      <span><i style="background:var(--c-other)"></i>その他</span>
      <span style="margin-left:6px">チップをドラッグすると別の職人・別の日に移せる（期間はそのまま平行移動）。「続」は前日からの続き</span></div>
    <div class="boardwrap"><table class="bd" style="--slots:${slots};width:${112+86*D+54}px"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p class="note">ここに出ているのは案件台帳の工程そのもの。動かすと台帳の予定日・担当も変わり、完工予定と支払にも同時に反映される。
      休み（斜線）は2026年10月のスケジュール管理から取り込んだもの。</p>`;
}

/* ================= 完工予定 ================= */
function vKanko(){
  const m=kMonth, D=daysIn(m), y=+m.slice(0,4), mo=+m.slice(5,7);
  const KEN=M.kensa||'検査担当';
  const all=DB.cases.filter(c=>ym(planOf(c))===m);
  const insp=c=>procsOf(c.id).filter(p=>isInsp(p.kind));
  const noArr=c=>{const ps=procsOf(c.id);
    return !ps.length||ps.some(p=>!p.who||!p.date);};
  const list=all.filter(c=>
    kView==='すべて'?true:
    kView==='検査が未手配'?insp(c).length===0:
    kView==='手配が未完了'?noArr(c):
    kView==='未完工'?!c.done:true);
  const byDay={}; list.forEach(c=>{const d=planOf(c); (byDay[d]=byDay[d]||[]).push(c);});
  const days=Object.keys(byDay).sort();
  // 検査担当の検査予定（この月）
  const kenDays={};
  DB.procs.filter(p=>isInsp(p.kind)&&ym(p.date)===m).forEach(p=>{
    (kenDays[p.date]=kenDays[p.date]||[]).push(p);});
  const kenN=Object.values(kenDays).reduce((a,x)=>a+x.length,0);
  const B=byId();
  return `<div class="bar"><h2>完工予定</h2>
      <select id="kMonth" title="表示する月">${MONTHS.map(m=>`<option value="${m}"${m===kMonth?' selected':''}>${mlab(m)}の完工予定</option>`).join('')}</select>
      <select id="kView" title="絞り込み">${optsL(['すべて','検査が未手配','手配が未完了','未完工'],kView,
        {'すべて':'絞り込み：なし'})}</select>
      <span class="note" style="margin:0">工事管理（${esc(KEN)}）の日程表としても使う</span></div>
    <div class="kpi">
      <div class="k"><small>この月の完工予定</small><b>${all.length}件</b></div>

      <div class="k"><small>AW検査あり</small><b>${all.filter(c=>insp(c).length).length}件</b></div>
      <div class="k"><small>AW検査なし</small><b style="color:var(--warn)">${all.filter(c=>!insp(c).length).length}件</b></div>
      <div class="k"><small>手配が未完了</small><b style="color:var(--warn)">${all.filter(noArr).length}件</b></div>
      <div class="k"><small>${esc(KEN)}の検査予定</small><b>${kenN}件</b></div>
    </div>
    ${kenN?`<div class="card" style="margin-bottom:12px">
      <h3 style="font-size:14px;margin-bottom:7px">${esc(KEN)}の${mo}月の検査予定</h3>
      <div class="kenrow">${Array.from({length:D},(_,i)=>{
        const d=i+1, ds=iso(y,mo,d), w=new Date(y,mo-1,d).getDay(), ks=kenDays[ds]||[];
        return `<div class="kd ${ks.length?'has':''} ${w===0||w===6?'we':''}" title="${esc(ks.map(p=>(B[p.case]||{}).prop||'').join(' / '))}">
          <b>${d}</b><small>${WD[w]}</small><span>${ks.length||''}</span></div>`;}).join('')}</div>
      <p class="note">数字はその日の検査件数。いまは検査が工程として入っている案件だけが出る。</p></div>`:
      `<div class="card" style="margin-bottom:12px"><p class="note" style="margin:0">
      この月は${esc(KEN)}のAW検査が1件も工程に入っていないので、日程表が作れない。
      下の「AW検査を足す」を押すと、その現場の清掃日に${esc(KEN)}のAW検査が入る。</p></div>`}
    ${days.length?days.map(d=>{
      const ks=(kenDays[d]||[]).length;
      return `<div class="day"><h4>${md(d)}（${wdOf(d)}）　${byDay[d].length}件${
        ks?`　<span class="st">${esc(KEN)}の検査 ${ks}件</span>`:''}</h4>
      ${byDay[d].map(c=>{const ps=procsOf(c.id), iv=insp(c);
        return `<div class="it">
          <span class="cl" style="background:${col(c.client)}">${esc(c.client||'—')}</span>

            ps.some(p=>!p.who)?'<span class="flag" style="margin-left:6px">業者未定</span>':''}${
            ps.some(p=>p.who&&!p.date)?'<span class="flag" style="margin-left:6px">日付未定</span>':''}</span>

          ${iv.length?`<span class="st done">検査 ${esc(iv[0].who||'担当未定')} ${md(iv[0].date)||'日未定'}</span>`
            :`<button class="btn small" data-addins="${c.id}">AW検査を足す</button>`}
          <button class="btn small ${c.done?'':'primary'}" data-done="${c.id}">${c.done?'完工 '+md(c.done):'完工にする'}</button>

    <p class="note">完工予定日は案件の最後の工程の日。「AW検査を足す」は清掃日と同じ日に${esc(KEN)}の検査を入れる（日付は工程タブで動かせる）。
      「工程」を押すとその案件の工程タブへ飛ぶ。</p>`;

/* ================= 検査カレンダー ================= */
function vInsp(){
  const m=cMonth, y=+m.slice(0,4), mo=+m.slice(5,7), D=daysIn(m), B=byId();
  const all=DB.procs.filter(p=>isInsp(p.kind));
  const whos=[...new Set(all.map(p=>p.who).filter(Boolean))].sort();
  const mine=all.filter(p=>cWho==='すべて'||p.who===cWho);
  const inM=mine.filter(p=>ym(p.date)===m);
  const byDay={}; inM.forEach(p=>{(byDay[p.date]=byDay[p.date]||[]).push(p);});
  const noDate=mine.filter(p=>!p.date).map(p=>B[p.case]).filter(Boolean);
  // この月に完工予定なのに検査が入っていない案件
  const noInsp=DB.cases.filter(c=>ym(planOf(c))===m&&!procsOf(c.id).some(p=>isInsp(p.kind)));
  const today=fmtD(new Date());
  const first=new Date(y,mo-1,1).getDay();
  const cells=[];
  for(let i=0;i<first;i++)cells.push('<div class="d out"></div>');
  for(let d=1;d<=D;d++){
    const ds=iso(y,mo,d), w=new Date(y,mo-1,d).getDay(), ks=(byDay[ds]||[]);
    const cleanOf=p=>{const c=procsOf(p.case).filter(x=>x.kind==='清掃'&&x.date).map(endOf).sort().pop();return c?'清掃 '+md(c):'';};
    cells.push(`<div class="d ${w===0||w===6?'we':''} ${ds===today?'today':''}">
      <b>${d}<small>${WD[w]}</small>${ks.length?`<small style="float:right;color:var(--ok);font-weight:900">${ks.length}件</small>`:''}</b>
      ${ks.map(p=>{const c=B[p.case]||{};
        return `<button class="ev" data-pcopen="${p.case}" style="background:${col(c.client)}" title="${esc(c.client||'')}">
          ${esc(c.prop||'（物件未入力）')}<span class="w">${esc(cWho==='すべて'?(p.who||'担当未定')+'　':'')}${esc(cleanOf(p))}</span></button>`;}).join('')}
    </div>`);
  }
  while(cells.length%7)cells.push('<div class="d out"></div>');
  return `<div class="bar"><h2>検査カレンダー</h2>
      <select id="cMonth" title="表示する月">${MONTHS.map(m=>`<option value="${m}"${m===cMonth?' selected':''}>${mlab(m)}の検査</option>`).join('')}</select>
      <select id="cWho" title="検査の担当で絞る">${optsL(['すべて',...whos],cWho,{'すべて':'担当：すべて'})}</select>
      <span class="note" style="margin:0">AW検査の予定だけを月表示。検査担当（${esc(whos.join('・')||'—')}）はここを見る</span></div>
    <div class="kpi">
      <div class="k"><small>この月の検査</small><b>${inM.length}件</b></div>
      <div class="k"><small>検査担当</small><b>${whos.length}人</b></div>
      <div class="k"><small>検査日が未定</small><b style="color:${noDate.length?'var(--warn)':'var(--ink)'}">${noDate.length}件</b></div>
      <div class="k"><small>完工予定なのに検査なし</small><b style="color:${noInsp.length?'var(--warn)':'var(--ink)'}">${noInsp.length}件</b></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="cal">${WD.map(w=>`<div class="h">${w}</div>`).join('')}${cells.join('')}</div>
      <p class="note">カードの色は依頼元。押すとその案件の「工程を組む」へ飛ぶ。検査日は工程タブで動かす。</p>
    </div>
    ${noDate.length?`<div class="card" style="margin-bottom:12px"><h3 style="font-size:14px;margin-bottom:6px">検査は入っているが日付が未定</h3>
      ${noDate.map(c=>`<div class="ck"><span class="t">日未定</span>${esc(c.prop)}　<button class="btn small" data-pcopen="${c.id}">工程</button></div>`).join('')}</div>`:''}
    ${noInsp.length?`<div class="card"><h3 style="font-size:14px;margin-bottom:6px">${mo}月完工予定なのに検査が入っていない</h3>
      ${noInsp.map(c=>`<div class="ck"><span class="t">検査なし</span><span class="cl" style="background:${col(c.client)}">${esc(c.client||'—')}</span>　${esc(c.prop)}　完工予定 ${md(planOf(c))}
        　<button class="btn small" data-addins="${c.id}">AW検査を足す</button></div>`).join('')}</div>`:''}`;
}

/* ================= マスタ ================= */
function usedBy(nm){return DB.procs.filter(p=>p.who===nm).length;}
function oldKindOf(nm){return DB.procs.filter(p=>p.who===nm&&PKINDS.indexOf(p.kind)<0).length;}
function offK(v){return DB.procs.filter(p=>p.who===v.name&&p.kind!==v.defKind).length;}
function convertVendor(nm,quiet){
  const v=vendorOf(nm); if(!v)return 0;
  const hit=DB.procs.filter(p=>p.who===nm&&p.kind!==v.defKind&&PKINDS.indexOf(p.kind)<0);
  if(!hit.length)return 0;
  if(!quiet)snap();
  hit.forEach(p=>{p.kind=v.defKind;});
  return hit.length;
}
function convertAll(){
  snap(); let n=0;
  DB.vendors.forEach(v=>{n+=convertVendor(v.name,true);});
  save(); render();
  toast(n?`${n}件の区分を既定の区分に置き換えた`:'置き換える工程は無かった', n?undo:null);
}

/* 表記ゆれを吸収してから照合する。貼替／張替／貼り替え／張り替え は同じ扱い */
const priceKey=s=>wide(s).replace(/[\s　（）()・]/g,'')
  .replace(/張り替え|貼り替え|張替え|貼替え|張替/g,'貼替').replace(/張り/g,'貼り')
  .replace(/剝離/g,'剥離').toLowerCase();
/* 依頼元ごとに呼び方が違うので、単価表の工事名に別名を持たせる（マスタの「別名」欄でも足せる） */
const ALIASES={
  'クロス貼替':['クロス張替','クロス貼り替え'],
  'CF貼替':['CF張替','クッションフロア貼替','クッションフロア張替','クッションフロア','CF'],
  'ソフト巾木':['巾木貼替','巾木張替','巾木交換'],
  'エアコン機械洗浄':['エアコン洗浄','エアコン内部洗浄','エアコンクリーニング','AC内部洗浄','AC洗浄','エアコン分解洗浄'],

  '冷蔵庫背板貼り':['背板張り','背板貼り','背板'],

  'パッキン・コマ交換':['パッキン交換','コマ交換'],
  'シングルレバー水栓交換':['シングルレバー'],
  'ワックス剥離洗浄':['WAX剥離洗浄','ワックス剥離','WAX剥離'],
  '引掛シーリング取り付け(丸型)':['引掛シーリング'],
  '床鳴り止め取付':['床鳴り'],
  'UB鏡裏取り':['鏡裏取り'],
  'タオル掛け交換':['タオル掛け'],
  'ペーパーホルダー交換':['ペーパーホルダー'],
  '便座交換':['ウォシュレット交換','便座'],
  '玄関ドアクローザー調整':['ドアクローザー調整','ドアクローザー'],
  '照明引き紐交換':['引き紐交換','引き紐'],
  'ドアスコープ交換':['ドアスコープ'],
  'スイッチ交換':['スイッチ'],
  'コンセント交換':['コンセント'],
};
const ALIASK={}; Object.keys(ALIASES).forEach(n=>{ALIASK[priceKey(n)]=ALIASES[n].map(priceKey);});
/* 単価表1行が持つ照合キー：工事名＋別名欄＋既定の別名 */
function priceKeys(p){
  const k0=priceKey(p.name), ks=[k0];
  String(p.alias||'').split(/[／/,、\n]/).forEach(a=>{const k=priceKey(a); if(k)ks.push(k);});
  (ALIASK[k0]||[]).forEach(k=>ks.push(k));
  return ks.filter(Boolean);
}
/** 明細の名称から発注単価を引く。業者指定の行が優先、無ければ共通の行 */
function findPrice(name,who,unit,client){
  const k=priceKey(name); if(!k)return null;
  /* 1) 完全一致（別名込み） */
  let hit=DB.prices.filter(p=>priceKeys(p).indexOf(k)>=0);
  /* 2) 部分一致。名称が別名を含む（「キッチンコーキング」⊃「コーキング」）か、その逆。いちばん長く当たったものを採る */
  if(!hit.length){
    let best=0, cand=[];
    DB.prices.forEach(p=>{
      priceKeys(p).forEach(pk=>{
        if(pk.length<3)return;
        if(k.indexOf(pk)<0&&pk.indexOf(k)<0)return;
        if(pk.length>best){best=pk.length;cand=[p];}
        else if(pk.length===best&&cand.indexOf(p)<0)cand.push(p);
      });
    });
    const names=cand.map(p=>p.name).filter((v,i,a)=>a.indexOf(v)===i);
    if(names.length===1)hit=cand;           /* 候補が1種類に絞れたときだけ使う */
  }
  /* 依頼元が一致する単価を優先。無ければ依頼元を指定していない（共通の）単価 */
  if(client){
    const byCl=hit.filter(p=>p.client===client);
    hit = byCl.length ? byCl : hit.filter(p=>!p.client);
  }
  if(hit.length>1&&unit){                       /* 同じ名前で単位違い（コーキング打替 m と 式） */
    const byUnit=hit.filter(p=>(p.unit||'式')===unit);
    if(byUnit.length)hit=byUnit;
  }
  return hit.find(p=>p.who&&p.who===who) || hit.find(p=>!p.who) || null;
}

function parsePrices(txt){
  return String(txt||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s0=>{
    const s=s0.replace(/(\d),(?=\d{3}(\D|$))/g,'$1');
    const c=s.split(/\t|,|、|\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
    const name=c[0]||''; let unit='式', price=0, who='', kind='', client='';
    c.slice(1).forEach(x=>{
      if(UNITS.indexOf(x)>=0){unit=x;return;}
      if(PKINDS.indexOf(x)>=0){kind=x;return;}
      const v=+String(x).replace(/[,¥￥円\s]/g,'');
      if(/\d/.test(x)&&!isNaN(v)){price=v;return;}
      if(isClient(x)){client=x;return;}
      if(isVendor(x))who=x;
    });
    return {name,unit,price,who,client,kind:kind||guessKind(name)};
  }).filter(r=>r.name&&r.price);
}

    const grams=[]; for(let i=0;i+2<=k.length;i++)grams.push(k.slice(i,i+2));

    l.price=price; el.remove(); save(); render(); toast(`単価表に登録して ${yen(price)} を入れた`, undo);

function applyPrices(cid){
  const cl=(DB.cases.find(x=>x.id===cid)||{}).client||'';
  const ls=DB.lines.filter(l=>l.case===cid&&!l.order&&+l.qty>0);
  let n=0, miss=[], todo=[];
  snap();
  ls.forEach(l=>{
    if(l.price)return;
    const p=findPrice(l.name,l.who,l.unit,cl);
    if(p&&+p.price>0){l.price=+p.price; if(p.unit&&!l.unit)l.unit=p.unit; n++;}
    else if(p){todo.push(l.name);}          /* 表にはあるが単価が空 */
    else if(l.name)miss.push(l.name);
  });
  save(); render();
  const tail=[todo.length?`${todo.length}行は単価未設定（${todo.slice(0,2).join('・')}${todo.length>2?' ほか':''}）`:'',
              miss.length?`${miss.length}行は${cl?cl+'の':''}単価表に無い`:''].filter(Boolean).join('／');
  toast(n?`${n}行に単価を入れた${tail?'／'+tail:''}`
         :(DB.prices.length?(tail||'単価表に合う行が無かった'):'単価マスタがまだ空'), n?undo:null);
}

    Object.values(rows[b]).reduce((x,y)=>x+y,0)-Object.values(rows[a]).reduce((x,y)=>x+y,0));

/* ================= 月次 ================= */
function vPl(){
  const MS=MS_LIST();
  const bill={}, done={};
  DB.cases.forEach(c=>{const s=salesOf(c), k=costOf(c.id);
    const mb=ym(c.bill), mdn=ym(planOf(c));
    if(mb){bill[mb]=bill[mb]||{s:0,c:0,n:0}; bill[mb].s+=s; bill[mb].c+=k; bill[mb].n++;}
    if(mdn){done[mdn]=done[mdn]||{s:0,c:0,n:0}; done[mdn].s+=s; done[mdn].c+=k; done[mdn].n++;}});
  const tb=(o,t)=>`<div class="card" style="margin-bottom:12px"><h3 style="font-size:14px;margin-bottom:8px">${t}</h3>
    <div class="tw" style="max-height:none"><table><thead><tr><th></th>
    ${MS.map(m=>`<th class="r">${mlabel(m)}</th>`).join('')}<th class="r">合計</th></tr></thead><tbody>
    ${[['件数','n',v=>v],['売上（税込）','s',yen],['原価','c',yen]].map(([l,f,fmt])=>
      `<tr><td>${l}</td>${MS.map(m=>`<td class="r">${fmt((o[m]||{})[f]||0)}</td>`).join('')}
       <td class="r"><b>${fmt(MS.reduce((a,m)=>a+((o[m]||{})[f]||0),0))}</b></td></tr>`).join('')}
    <tr><td><b>粗利</b></td>${MS.map(m=>{const x=o[m]||{s:0,c:0};
      return `<td class="r"><b>${yen(x.s-x.c)}</b></td>`;}).join('')}
      <td class="r"><b>${yen(MS.reduce((a,m)=>a+((o[m]||{s:0}).s-(o[m]||{c:0}).c),0))}</b></td></tr>
    <tr><td>粗利率</td>${MS.map(m=>{const x=o[m]||{s:0,c:0};
      return `<td class="r">${x.s?((x.s-x.c)/x.s*100).toFixed(1)+'%':'—'}</td>`;}).join('')}
      <td class="r">${(()=>{const s=MS.reduce((a,m)=>a+((o[m]||{s:0}).s),0),c=MS.reduce((a,m)=>a+((o[m]||{c:0}).c),0);
        return s?((s-c)/s*100).toFixed(1)+'%':'—';})()}</td></tr>
    </tbody></table></div></div>`;
  const z=DB.cases.filter(c=>salesOf(c)>0&&costOf(c.id)===0);
  const A=tb(done,'完工（予定）月ベース　工事が実際に動いた月で見る'+(DB.basis==='完工'?'　← いま採用中':''));
  const Bt=tb(bill,'請求月ベース　いまの月次決算表と同じ見方'+(DB.basis==='請求'?'　← いま採用中':''));
  return `<div class="bar"><h2>月次</h2>
      <span class="note" style="margin:0">計上基準</span>
      <select id="basisSel" title="売上をどの日付で月に乗せるか">${optsL(['完工','請求'],DB.basis,{'完工':'計上：完工基準','請求':'計上：請求月基準'})}</select>
      <span class="note" style="margin:0">請求タブの締め方も一緒に切り替わる</span></div>
    ${DB.basis==='完工'?A+Bt:Bt+A}
    <div class="card"><h3 style="font-size:14px;margin-bottom:6px">この粗利率が信用できない理由</h3>
      <p class="note" style="margin-top:0">売上はあるのに発注が1件も入っていない案件が <b>${z.length}件・${yen(z.reduce((a,c)=>a+salesOf(c),0))}</b> ある。
      その分だけ原価が抜け、粗利が過大に出る。販管費はこの台帳にそもそも入っていないので（経費シートは見出しだけ）、
      月次決算表の営業利益＝売上総利益になっている。販管費はfreee側にあるので、そちらと突き合わせないと営業利益は出ない。</p></div>`;
}

/* ================= 要確認 ================= */
let ckScope='運用中';
function vCheck(){
  const B=byId();
  let all=issues();
  const total=all.length;
  if(ckScope==='運用中')all=all.filter(i=>{const c=B[i.c]; return c&&c.live;});
  /* 同じ案件・同じ種類は1つにまとめる（工程ごとに何度も出ないように） */
  const g={};
  all.forEach(i=>{ const arr=(g[i.k]=g[i.k]||[]); const hit=arr.find(x=>x.c===i.c);
    if(hit){hit.n=(hit.n||1)+1; if(i.t&&hit.t.indexOf(i.t)<0&&hit.t.length<80)hit.t+='／'+i.t;} else arr.push(Object.assign({n:1},i)); });
  const order=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
  const shown=order.reduce((a,k)=>a+g[k].length,0);
  return `<div class="bar"><h2>要確認 <span style="color:var(--warn)">${shown}</span></h2>
      <div class="seg"><button data-ck="運用中" class="${ckScope==='運用中'?'on':''}">運用中だけ</button><button data-ck="すべて" class="${ckScope==='すべて'?'on':''}">過去データも</button></div>
      <span class="note" style="margin:0">${ckScope==='運用中'?`過去データを含めると ${total} 件。過去分は「マスタ」の一括置き換えや「完工日なし」の予定日ボタンでまとめて減らせる`:'案件ごとにまとめて数えている'}</span></div>
    ${shown?`<div class="kpi">${order.map(k=>`<div class="k"><small>${esc(k)}</small><b>${g[k].length}</b></div>`).join('')}</div>`
      :'<div class="card empty">運用中の案件に、直すところは無い。</div>'}
    ${order.map(k=>`<h3 style="font-size:14px;margin:14px 0 7px">${esc(k)}　${g[k].length}件</h3>
      ${g[k].slice(0,25).map(i=>`<div class="ck"><span class="t">${esc(k)}${i.n>1?` ×${i.n}`:''}</span><b>${esc((B[i.c]||{}).prop||i.t)}</b>${(B[i.c]||{}).prop&&i.t!==(B[i.c]||{}).prop?`<span class="note" style="margin:0 0 0 8px">${esc(i.t)}</span>`:''}
        <div class="d">${esc(i.d)}</div>
        ${k==='原価なし'?fixCost(i.c):
          k==='完工日なし'?fixDone(i.c):
          `<button class="btn small" data-open="${i.c}" style="margin-top:6px">この案件を開く</button>`}</div>`).join('')}
      ${g[k].length>25?`<p class="note">ほか ${g[k].length-25} 件。上から直していくと減る。</p>`:''}`).join('')}
    <p class="note">この一覧は入力を直すと自動で減る。</p>`;
}

/* ================= render ================= */
/* 再描画の前後で「どこを見ていたか・どこに入力していたか」を覚えて戻す。
   #main を丸ごと書き直す方式なので、これが無いと1セル直すたびに表が先頭に戻りフォーカスも消える */
const SCROLLERS='.tw,.lnw,.boardwrap,.cases,#dw,.cal,.drawer';
function elKey(el){
  if(el.id)return '#'+el.id;
  const cls=(typeof el.className==='string'?el.className:'').trim(); if(!cls)return null;
  const sel='.'+cls.split(/\s+/).join('.');
  return sel+'|'+[...document.querySelectorAll(sel)].indexOf(el);
}
function elByKey(k){
  if(!k)return null;
  if(k[0]==='#')return document.getElementById(k.slice(1));
  const [sel,i]=k.split('|'); return document.querySelectorAll(sel)[+i]||null;
}
function memView(){
  const m={win:[window.scrollX,window.scrollY],els:[],focus:null};
  document.querySelectorAll(SCROLLERS).forEach(el=>{ if(el.scrollTop||el.scrollLeft){const k=elKey(el); if(k)m.els.push([k,el.scrollLeft,el.scrollTop]);} });
  const a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!a.closest('.ask')){
    let sel=null;
    if(a.id)sel='#'+CSS.escape(a.id);
    else{
      const attr=['data-lf','data-pf','data-f'].find(n=>a.hasAttribute(n));
      const row=a.closest('[data-l],[data-p],[data-pr],[data-v],[data-cm]');
      if(attr&&row){const rn=['data-l','data-p','data-pr','data-v','data-cm'].find(n=>row.hasAttribute(n));
        sel=`[${rn}="${CSS.escape(row.getAttribute(rn))}"] [${attr}="${CSS.escape(a.getAttribute(attr))}"]`;}
      else if(attr){const box=a.closest('#dw,.drawer,.card'); const bk=box?elKey(box):null;
        sel=(bk&&bk[0]==='#'?bk+' ':'')+`[${attr}="${CSS.escape(a.getAttribute(attr))}"]`;}
      else if(a.dataset.k)sel=`[data-k="${CSS.escape(a.dataset.k)}"]`;
    }
    if(sel){let ss=null,se=null; try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){} m.focus={sel,ss,se};}
  }
  return m;
}
function restoreView(m){
  if(!m)return false;
  let hitBoard=false;
  m.els.forEach(([k,x,y])=>{const el=elByKey(k); if(el){el.scrollLeft=x; el.scrollTop=y; if(/boardwrap/.test(k))hitBoard=true;}});
  window.scrollTo(m.win[0],m.win[1]);
  if(m.focus){ let el=null; try{el=document.querySelector(m.focus.sel);}catch(e){}
    if(el){ el.focus({preventScroll:true});
      try{ if(m.focus.ss!=null&&typeof el.setSelectionRange==='function'&&/^(text|search|)$/.test(el.type||''))el.setSelectionRange(m.focus.ss,m.focus.se); }catch(e){} } }
  return hitBoard;
}

/* ================= ドラッグ ================= */
let dragId=null;
const clearDZ=()=>document.querySelectorAll('td.ok,td.ng').forEach(n=>n.classList.remove('ok','ng'));
function checkDrop(pid,who,ds){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return ['工程が見つからない'];
  const w=[], len=spanLen(p), days=spanDays({date:ds,end:len>1?addDays(ds,len-1):''}), last=days[days.length-1]||ds;
  const h=days.find(d=>isOff(who,d));
  if(h)w.push(`${who} は ${md(h)} が休み`);
  if(!isInsp(p.kind)&&clash(pid,who,days))w.push(`${days.length>1?md(ds)+'〜'+md(last):md(ds)} はすでに現場が入っている（1日2現場になる）`);
  const c=DB.cases.find(x=>x.id===p.case);
  if(c){const other=procsOf(c.id).filter(x=>x.id!==pid&&x.date);
    if(p.kind==='清掃'&&other.some(x=>isSeko(x.kind)&&endOf(x)>ds))w.push('工事より前に清掃が来る');
    if(isSeko(p.kind)&&other.some(x=>x.kind==='清掃'&&x.date<last))w.push('清掃より後に工事が来る');
    if(isInsp(p.kind)&&other.some(x=>x.kind==='清掃'&&endOf(x)>ds))w.push('清掃より前にAW検査が来る');}
  return w;
}
function applyMove(pid,who,ds){
  snap();
  const p=DB.procs.find(x=>x.id===pid); const c=DB.cases.find(x=>x.id===p.case);
  const from=`${p.who} ${md(p.date)}`;
  const len=spanLen(p); p.who=who; p.date=ds; p.end=len>1?addDays(ds,len-1):''; p.month='';
  recalcPlan(c);
  selProc=pid; save(); render();
  toast(`${(c||{}).prop||'現場'}：${from} → ${who} ${md(ds)}`, undo);
}
/** 工程を組むタブ：担当はそのままで日だけ動かす */
function setDate(pid,ds,de){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  if(de&&de<ds){const t=ds;ds=de;de=t;}
  const nEnd=(de&&de>ds)?de:'';
  if(p.date===ds&&(p.end||'')===nEnd)return;
  snap(); const from=p.date?spanLabel(p):'未定'; p.date=ds; p.end=nEnd; p.month='';
  const c=DB.cases.find(x=>x.id===p.case);
  recalcPlan(c);
  selProc=pid; save(); render();
  toast(`${p.kind}（${p.who||'業者未定'}）を ${from} → ${spanLabel(p)} に`, undo);
}
/** ドラッグ：期間の長さを保ったまま開始日を動かす */
function shiftDate(pid,ds){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return;
  const len=spanLen(p); setDate(pid,ds,len>1?addDays(ds,len-1):'');
}
function dateWarn(pid,ds,de){
  const p=DB.procs.find(x=>x.id===pid); if(!p)return [];
  const w=[]; const days=spanDays({date:ds,end:de||''}); const last=days[days.length-1]||ds;
  if(p.who&&SEN.indexOf(p.who)>=0){const h=days.find(d=>isOff(p.who,d));
    if(h)w.push(`${p.who} は ${md(h)} が休み`);}
  if(p.who&&!isInsp(p.kind)&&clash(pid,p.who,days))
    w.push(`${p.who} は ${days.length>1?md(ds)+'〜'+md(last):md(ds)} に別の現場がある`);
  const other=procsOf(p.case).filter(x=>x.id!==pid&&x.date);
  if(p.kind==='清掃'&&other.some(x=>isSeko(x.kind)&&endOf(x)>ds))w.push('工事より前に清掃が来る');
  if(isSeko(p.kind)&&other.some(x=>x.kind==='清掃'&&x.date<last))w.push('清掃より後に工事が来る');
  if(isInsp(p.kind)&&other.some(x=>x.kind==='清掃'&&endOf(x)>ds))w.push('清掃より前にAW検査が来る');
  return w;
}
function tryDate(pid,ds,de,keep){
  if(keep){const p=DB.procs.find(x=>x.id===pid); const len=p?spanLen(p):1; de=len>1?addDays(ds,len-1):'';}
  const w=dateWarn(pid,ds,de);
  if(!w.length){setDate(pid,ds,de);return;}
  const el=document.createElement('div'); el.className='ask';
  el.innerHTML=`<div class="askbox"><h4>この日に置くと問題が出る</h4>
    <ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>

}
/** 工程を組む表のクリック：1回目＝開始日、2回目＝終了日。同じ日を2回なら1日だけ */
function clickDay(pid,ds){

    const a=pendStart.day; pendStart=null;

function tryMove(pid,who,ds){

  pendStart=null;

      <button class="btn small primary" id="askYes">このまま移動</button></div></div>`;

    if(LBL[f])toast(`${l.name||'明細'}　${LBL[f]} ${was||0} → ${l[f]||0}　（販売 ${yen(lineSell(l))} ／ 原価 ${yen(lineAmt(l))}）`);
    return;}
  if(el.id==='mTab'){mTab=el.value;mQ='';render();return;}

    const tr=el.closest('[data-v]'); const v=vendorOf(tr.dataset.v); if(!v)return;

      renameClient(old,el.value);}
